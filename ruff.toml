# Ruff-Konfiguration (Python-Lint) — genutzt von .github/workflows/lint.yml
#
# Regel-Set: Default-Familien E (pycodestyle) + F (pyflakes). Bewusst kein
# erweitertes Regelwerk, damit der Bestandscode nicht ohne Mehrwert umgebaut wird.
target-version = "py38"
line-length = 120

[lint]
select = ["E", "F"]

# tools/re/ sind einmalige RE-Helfer (apply_*.py) mit langen eingebetteten
# Lua-/Patch-String-Literalen — E501 dort bewusst ignorieren (kein Produktivcode).
[lint.per-file-ignores]
"tools/re/*.py" = ["E501"]
