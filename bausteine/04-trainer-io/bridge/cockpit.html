<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>carbonium</title>
        <style>
            :root {
                color-scheme: dark;
            }
            body {
                background: #0a0f0a;
                color: #9fef9f;
                font:
                    16px/1.5 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Consolas,
                    monospace;
                margin: 0;
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.1rem;
                margin: 0 0 1rem;
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 0.6rem;
                align-items: center;
                margin-bottom: 0.6rem;
            }
            .val {
                color: #fff;
            }
            .dim {
                color: #5f8f5f;
            }
            input,
            button {
                background: #0f1a0f;
                color: #9fef9f;
                border: 1px solid #3a5a3a;
                border-radius: 3px;
                font: inherit;
                padding: 0.35rem 0.6rem;
            }
            button:hover {
                background: #1a2a1a;
                cursor: pointer;
            }
            .err {
                color: #ef9f9f;
            }
        </style>
    </head>
    <body>
        <h1>carbonium</h1>

        <section>
            <div class="row">
                <span class="dim">now</span>
                <span id="carbonium" class="val">—</span>
                <span class="dim">/ max</span>
                <span id="carbonium_max" class="val">—</span>
            </div>
            <div class="row">
                <input id="amount" size="10" value="10" />
                <button id="add">+ add</button>
                <button id="sub">− subtract</button>
            </div>
            <div id="out" class="err"></div>
        </section>

        <script>
            (function () {
                var $ = function (id) {
                    return document.getElementById(id);
                };
                var $ = function (id) {
                    return document.getElementById(id);
                };

                async function post(path, body) {
                    var res = await fetch(path, {
                        method: "POST",
                        headers: { "content-type": "application/json" },
                        body: body === undefined ? "{}" : JSON.stringify(body),
                    });
                    return res.json();
                }

                function fmt(v) {
                    return typeof v === "number" ? v.toLocaleString() : String(v);
                }

                async function refresh() {
                    try {
                        var s = await post("get_state");
                        $("carbonium").textContent = fmt(s.carbonium);
                        $("carbonium_max").textContent = fmt(s.carbonium_max);
                        $("out").textContent = "";
                    } catch (e) {
                        $("out").textContent = "ERR " + e.message;
                    }
                }

                async function addResource(amount) {
                    try {
                        var r = await post("add_resource", { amount: String(amount) });
                        $("out").textContent = r && r.ok ? "" : JSON.stringify(r);
                        refresh();
                    } catch (e) {
                        $("out").textContent = "ERR " + e.message;
                    }
                }

                $("add").onclick = function () {
                    addResource($("amount").value);
                };
                $("sub").onclick = function () {
                    var a = parseFloat($("amount").value) || 0;
                    addResource(-a);
                };

                refresh();
                setInterval(refresh, 3000);
            })();
        </script>
    </body>
</html>
