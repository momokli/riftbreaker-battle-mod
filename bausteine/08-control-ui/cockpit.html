<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>RIFT BATTLE — OPERATOR COCKPIT</title>
        <style>
            :root {
                color-scheme: dark;
                --win: #2a2d31;
                --panel: #31353a;
                --base: #1f2225;
                --line: #454a50;
                --text: #dfe3e6;
                --dim: #8b949b;
                --accent: #3fd0d4;
                --good: #5cc47c;
                --warn: #d6b04a;
                --bad: #e05252;
                --btn-hover: #3c4248;
                --btn-active: #25282c;
                --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            }

            *, *::before, *::after {
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
                background-color: var(--win);
                color: var(--text);
                font-family: var(--font-ui);
                font-size: 13px;
                line-height: 1.4;
                overflow: hidden;
                -webkit-font-smoothing: antialiased;
            }

            /* Scrollbar styling */
            * {
                scrollbar-width: thin;
                scrollbar-color: var(--line) var(--base);
            }
            *::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            *::-webkit-scrollbar-track {
                background: var(--base);
            }
            *::-webkit-scrollbar-thumb {
                background: var(--line);
                border-radius: 3px;
            }
            *::-webkit-scrollbar-thumb:hover {
                background: var(--dim);
            }

            /* Main Layout */
            #app-root {
                display: flex;
                flex-direction: column;
                height: 100vh;
                width: 100vw;
                overflow: hidden;
            }

            /* Top Chrome Header */
            header.app-header {
                flex: 0 0 28px;
                background: #232629;
                border-bottom: 1px solid var(--line);
                display: flex;
                align-items: center;
                padding: 0 12px;
                font-family: var(--font-mono);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.08em;
                color: var(--dim);
                user-select: none;
            }
            header.app-header .title-badge {
                color: var(--accent);
                margin-right: 8px;
            }

            /* Workspace Grid */
            main.workspace {
                flex: 1 1 auto;
                display: grid;
                padding: 8px;
                gap: 8px;
                overflow: hidden;
                /* Default 980-1399px: two columns */
                grid-template-columns: minmax(360px, 480px) minmax(400px, 1fr);
                grid-template-rows: 1fr;
            }

            .left-col {
                display: flex;
                flex-direction: column;
                gap: 8px;
                overflow-y: auto;
                min-width: 0;
            }

            .right-col {
                display: flex;
                flex-direction: column;
                min-width: 0;
                height: 100%;
                overflow: hidden;
            }

            /* >= 1400px: three columns */
            @media (min-width: 1400px) {
                main.workspace {
                    grid-template-columns: minmax(360px, 400px) minmax(440px, 560px) minmax(420px, 1fr);
                    grid-template-rows: auto 1fr;
                }
                .left-col {
                    display: contents;
                }
                #panel-resources {
                    grid-column: 1;
                    grid-row: 1;
                    align-self: start;
                }
                #panel-creatures {
                    grid-column: 1;
                    grid-row: 2;
                    align-self: start;
                }
                #panel-mission {
                    grid-column: 2;
                    grid-row: 1;
                    align-self: start;
                }
                .right-col {
                    grid-column: 3;
                    grid-row: 1 / span 2;
                    min-height: 0;
                }
            }

            /* < 980px: single column */
            @media (max-width: 979px) {
                html, body {
                    overflow-y: auto;
                }
                #app-root {
                    height: auto;
                    min-height: 100vh;
                    overflow: visible;
                }
                main.workspace {
                    display: flex;
                    flex-direction: column;
                    height: auto;
                    overflow: visible;
                }
                .left-col {
                    overflow: visible;
                }
                .right-col {
                    height: auto;
                    overflow: visible;
                }
                #panel-server {
                    height: auto !important;
                }
                .log-scroll-area {
                    height: 340px !important;
                    max-height: 40vh;
                }
            }

            /* QGroupBox emulation */
            fieldset.q-groupbox {
                margin: 0;
                padding: 10px 10px 8px 10px;
                border: 1px solid var(--line);
                border-radius: 3px;
                background: var(--panel);
                position: relative;
                min-width: 0;
            }

            fieldset.q-groupbox legend {
                padding: 0 5px;
                font-family: var(--font-ui);
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--dim);
                margin-left: 4px;
            }

            /* Form Controls */
            input, button {
                font-family: inherit;
                font-size: 12px;
                height: 25px;
                border-radius: 3px;
                border: 1px solid var(--line);
                background: var(--base);
                color: var(--text);
                padding: 0 6px;
                outline: none;
                transition: background-color 100ms ease, border-color 100ms ease;
            }

            input:focus, button:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 1px var(--accent);
            }

            input.mono, .mono {
                font-family: var(--font-mono);
                font-variant-numeric: tabular-nums;
            }

            input[readonly] {
                background: #25282c;
                color: var(--dim);
                border-color: #383c42;
                cursor: default;
            }
            /* Read-only stays muted, but the focus indicator must stay visible
               (WCAG 2.4.7) — dimmed instead of removed. */
            input[readonly]:focus {
                border-color: var(--dim);
                box-shadow: 0 0 0 1px var(--dim);
            }

            button {
                background: #363b41;
                border: 1px solid #4a5058;
                color: var(--text);
                cursor: pointer;
                font-weight: 500;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                white-space: nowrap;
                user-select: none;
            }
            button:hover {
                background: var(--btn-hover);
                border-color: #586069;
            }
            button:active {
                background: var(--btn-active);
                border-color: #3d4349;
            }
            button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            button.btn-primary {
                border-color: #27888c;
                background: #23585c;
                color: #e5fbfb;
            }
            button.btn-primary:hover {
                background: #2c6f74;
                border-color: var(--accent);
            }

            button.btn-danger {
                border-color: #7a3232;
                background: #4a2424;
                color: #fcebeb;
            }
            button.btn-danger:hover {
                background: #5e2e2e;
                border-color: var(--bad);
            }

            /* Group A: Resources */
            .resource-table {
                display: grid;
                grid-template-columns: 86px minmax(50px, 1fr) 14px minmax(50px, 1fr) 52px 28px 28px;
                gap: 6px 6px;
                align-items: center;
            }

            .res-label {
                font-family: var(--font-mono);
                font-size: 12px;
                font-weight: 600;
                color: var(--text);
                letter-spacing: 0.02em;
            }

            .res-val {
                font-family: var(--font-mono);
                font-size: 13px;
                font-variant-numeric: tabular-nums;
                font-weight: 600;
                color: #ffffff;
                text-align: right;
                min-width: 48px;
            }

            .res-sep {
                color: var(--dim);
                text-align: center;
                user-select: none;
            }

            .res-max {
                font-family: var(--font-mono);
                font-size: 12px;
                font-variant-numeric: tabular-nums;
                color: var(--dim);
                text-align: left;
                min-width: 48px;
            }

            .res-input {
                width: 100%;
                text-align: right;
            }

            .btn-stepper {
                width: 25px;
                height: 25px;
                padding: 0;
                font-size: 13px;
                font-family: var(--font-mono);
            }

            /* Group B: Mission Flow */
            .flow-container {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .flow-readouts {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                background: var(--base);
                padding: 6px 8px;
                border-radius: 3px;
                border: 1px solid #2d3137;
            }

            .flow-prop {
                display: flex;
                align-items: baseline;
                gap: 6px;
                min-width: 0;
            }
            .prop-label {
                font-size: 11px;
                color: var(--dim);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                user-select: none;
            }
            .prop-val {
                font-family: var(--font-mono);
                font-size: 12.5px;
                font-weight: 600;
                color: #ffffff;
                font-variant-numeric: tabular-nums;
                overflow-wrap: anywhere;
            }

            .flow-action-row {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
            }

            /* Action rows: every control keeps its natural width; only the
               path/ID inputs opt into growing (.flow-grow). */
            .flow-action-row input,
            .flow-action-row button {
                flex: 0 0 auto;
            }

            .flow-action-row input.flow-grow {
                flex: 1 1 auto;
                min-width: 0;
            }

            /* Group C: Server Control (Plane B) */
            #panel-server {
                display: flex;
                flex-direction: column;
                height: 100%;
                min-height: 0;
            }

            .server-group-content {
                display: flex;
                flex-direction: column;
                gap: 8px;
                flex: 1 1 auto;
                min-height: 0;
            }

            .server-status-strip {
                display: flex;
                flex-wrap: wrap;
                gap: 12px 18px;
                background: var(--base);
                padding: 6px 8px;
                border-radius: 3px;
                border: 1px solid #2d3137;
            }

            .status-pair {
                display: inline-flex;
                align-items: baseline;
                gap: 5px;
                white-space: nowrap;
            }

            .server-toolbar {
                display: flex;
                gap: 6px;
                align-items: center;
            }

            .server-logs-container {
                display: flex;
                flex-direction: column;
                flex: 1 1 auto;
                min-height: 0;
                gap: 6px;
            }

            .logs-header-bar {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .log-scroll-area {
                flex: 1 1 auto;
                min-height: 140px;
                background: var(--base);
                border: 1px solid var(--line);
                border-radius: 3px;
                position: relative;
                display: flex;
                overflow: hidden;
            }

            #server_logs {
                flex: 1 1 auto;
                margin: 0;
                padding: 6px 8px;
                font-family: var(--font-mono);
                font-size: 11.5px;
                line-height: 1.38;
                color: #cdd3da;
                white-space: pre;
                overflow: auto;
                height: 100%;
                width: 100%;
            }

            /* Group D: Status Bar */
            footer.status-bar {
                flex: 0 0 24px;
                height: 24px;
                background: #232629;
                border-top: 1px solid var(--line);
                display: grid;
                grid-template-columns: 1fr 1px 1fr;
                align-items: center;
                padding: 0 10px;
                font-family: var(--font-mono);
                font-size: 11px;
                user-select: none;
            }

            .sb-separator {
                width: 1px;
                height: 14px;
                background: var(--line);
            }

            .sb-cell {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                line-height: 24px;
            }

            .sb-cell.left {
                padding-right: 8px;
            }

            .sb-cell.right {
                padding-left: 8px;
                text-align: right;
            }

            #out {
                color: var(--bad);
            }

            #server_control_msg {
                color: var(--dim);
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div id="app-root">
            <header class="app-header">
                <span class="title-badge">◆</span> RIFT BATTLE — OPERATOR COCKPIT
            </header>

            <main class="workspace">
                <div class="left-col">
                    <!-- A. RESOURCES -->
                    <fieldset class="q-groupbox" id="panel-resources">
                        <legend>Resources</legend>
                        <div class="resource-table">
                            <!-- Carbonium Row -->
                            <label for="amount" class="res-label">carbonium</label>
                            <span id="carbonium" class="res-val" title="current">—</span>
                            <span class="res-sep">/</span>
                            <span id="carbonium_max" class="res-max" title="max">—</span>
                            <input id="amount" class="mono res-input" size="5" value="10" aria-label="Carbonium transfer amount" />
                            <button id="add" class="btn-stepper" title="+ Add Carbonium" aria-label="+ Add Carbonium">+</button>
                            <button id="sub" class="btn-stepper" title="− Subtract Carbonium" aria-label="− Subtract Carbonium">−</button>

                            <!-- Ironium Row -->
                            <label for="ironium_amount" class="res-label">ironium</label>
                            <span id="ironium" class="res-val" title="current">—</span>
                            <span class="res-sep">/</span>
                            <span id="ironium_max" class="res-max" title="max">—</span>
                            <input id="ironium_amount" class="mono res-input" size="5" value="10" aria-label="Ironium transfer amount" />
                            <button id="ironium_add" class="btn-stepper" title="+ Add Ironium" aria-label="+ Add Ironium">+</button>
                            <button id="ironium_sub" class="btn-stepper" title="− Subtract Ironium" aria-label="− Subtract Ironium">−</button>
                        </div>
                    </fieldset>

                    <!-- B. MISSION FLOW (WAVE) -->
                    <fieldset class="q-groupbox" id="panel-mission">
                        <legend>Mission Flow (Wave)</legend>
                        <div class="flow-container">
                            <!-- Row 1: Observe -->
                            <div class="flow-readouts">
                                <div class="flow-prop">
                                    <span class="prop-label">flow</span>
                                    <span id="mission_flow" class="prop-val">—</span>
                                </div>
                                <div class="flow-prop">
                                    <span class="prop-label">active</span>
                                    <span id="mission_flow_active" class="prop-val">—</span>
                                </div>
                                <div class="flow-prop">
                                    <span class="prop-label">payload.spawn_point</span>
                                    <span id="mission_flow_spawn" class="prop-val">—</span>
                                </div>
                            </div>

                            <!-- Row 2: Act (Start wave) -->
                            <div class="flow-action-row">
                                <input
                                    id="flow_logic"
                                    class="mono flow-grow"
                                    value="logic/dom/attack_level_1_entry.logic"
                                    aria-label="Mission flow logic entry path"
                                    title="Mission logic entry path"
                                />
                                <input
                                    id="flow_mode"
                                    class="mono"
                                    size="8"
                                    value="default"
                                    readonly
                                    title="fest auf 'default' (#447): jeder andere Modus killt die DLL-Pipe"
                                    aria-label="Mission flow mode (locked to default)"
                                />
                                <input
                                    id="flow_spawn"
                                    class="mono"
                                    size="14"
                                    placeholder="spawn_point (#386)"
                                    title="optionaler Exor::Database-Payload (SetString &quot;spawn_point&quot;)"
                                    aria-label="Optional database payload spawn_point"
                                />
                                <button id="flow_start" class="btn-primary">start wave</button>
                            </div>

                            <!-- Row 3: Act (Stop wave) -->
                            <div class="flow-action-row">
                                <input
                                    id="flow_stop"
                                    class="mono flow-grow"
                                    placeholder="flow-id (empty = most recently started)"
                                    aria-label="Flow ID to stop"
                                />
                                <button id="flow_stop_btn">stop wave</button>
                            </div>
                        </div>
                    </fieldset>

                    <!-- C. CREATURES BASE DIFFICULTY -->
                    <fieldset class="q-groupbox" id="panel-creatures">
                        <legend>Creatures Base Difficulty</legend>
                        <div class="flow-container">
                            <!-- Row 1: Observe -->
                            <div class="flow-readouts">
                                <div class="flow-prop">
                                    <span class="prop-label">now</span>
                                    <span id="creatures_base_difficulty" class="prop-val">—</span>
                                </div>
                            </div>

                            <!-- Row 2: Act (set / increase / decrease) -->
                            <div class="flow-action-row">
                                <input
                                    id="cbd_value"
                                    class="mono"
                                    size="10"
                                    value="1"
                                    aria-label="Creatures base difficulty value"
                                />
                                <button id="cbd_set" aria-label="Set creatures base difficulty">set</button>
                                <button id="cbd_inc" aria-label="Increase creatures base difficulty">+ increase</button>
                                <button id="cbd_dec" aria-label="Decrease creatures base difficulty">− decrease</button>
                            </div>
                        </div>
                    </fieldset>
                </div>

                <div class="right-col">
                    <!-- C. SERVER CONTROL (PLANE B) -->
                    <fieldset class="q-groupbox" id="panel-server">
                        <legend>Server Control (Plane B)</legend>
                        <div class="server-group-content">
                            <!-- Status Strip -->
                            <div class="server-status-strip">
                                <div class="status-pair">
                                    <span class="prop-label">state</span>
                                    <span id="server_state" class="prop-val">—</span>
                                </div>
                                <div class="status-pair">
                                    <span class="prop-label">health</span>
                                    <span id="server_health" class="prop-val">—</span>
                                </div>
                                <div class="status-pair">
                                    <span class="prop-label">uptime</span>
                                    <span id="server_uptime" class="prop-val">—</span>
                                </div>
                                <div class="status-pair">
                                    <span class="prop-label">started</span>
                                    <span id="server_started_at" class="prop-val">—</span>
                                </div>
                            </div>

                            <!-- Qt-toolbar Action Bar -->
                            <div class="server-toolbar">
                                <button id="server_restart" class="btn-primary">Restart server</button>
                                <button id="server_start">Start</button>
                                <button id="server_stop" class="btn-danger">Stop</button>
                            </div>

                            <!-- Log Viewer with independent scroll container -->
                            <div class="server-logs-container">
                                <div class="logs-header-bar">
                                    <label for="server_logs_tail" class="prop-label">logs (tail)</label>
                                    <input id="server_logs_tail" class="mono" size="6" style="width: 55px; text-align: right;" value="50" aria-label="Log lines tail count" />
                                    <button id="server_logs_refresh">refresh logs</button>
                                </div>
                                <div class="log-scroll-area">
                                    <pre id="server_logs">—</pre>
                                </div>
                            </div>
                        </div>
                    </fieldset>
                </div>
            </main>

            <!-- D. STATUS BAR -->
            <footer class="status-bar">
                <div class="sb-cell left">
                    <span id="out" aria-live="polite"></span>
                </div>
                <div class="sb-separator" aria-hidden="true"></div>
                <div class="sb-cell right">
                    <span id="server_control_msg" aria-live="polite"></span>
                </div>
            </footer>
        </div>

        <script>
            (function () {
                var $ = function (id) {
                    return document.getElementById(id);
                };

                async function post(path, body) {
                    var res = await fetch(path, {
                        method: "POST",
                        headers: { "content-type": "application/json" },
                        body: body === undefined ? "{}" : JSON.stringify(body),
                    });
                    return res.json();
                }

                function fmt(v) {
                    return typeof v === "number" ? v.toLocaleString() : String(v);
                }

                async function refresh() {
                    try {
                        var s = await post("get_state");
                        $("carbonium").textContent = fmt(s.carbonium);
                        $("carbonium_max").textContent = fmt(s.carbonium_max);
                        $("ironium").textContent = fmt(s.ironium);
                        $("ironium_max").textContent = fmt(s.ironium_max);
                        $("mission_flow").textContent = s.mission_flow || "—";
                        $("mission_flow_active").textContent =
                            s.mission_flow_active === undefined
                                ? "—"
                                : String(s.mission_flow_active);
                        var mfp = s.mission_flow_payload;
                        $("mission_flow_spawn").textContent = mfp &&
                            mfp.spawn_point !== undefined
                                ? String(mfp.spawn_point)
                                : "—";
                        $("creatures_base_difficulty").textContent =
                            s.creatures_base_difficulty === undefined ||
                            s.creatures_base_difficulty === null
                                ? "—"
                                : String(s.creatures_base_difficulty);
                        $("out").textContent = "";
                    } catch (e) {
                        $("out").textContent = "ERR " + e.message;
                    }
                }

                async function addResource(resource, amount) {
                    try {
                        var body = { amount: String(amount) };
                        if (resource) {
                            body.resource = resource;
                        }
                        var r = await post("add_resource", body);
                        $("out").textContent = r && r.ok ? "" : JSON.stringify(r);
                        refresh();
                    } catch (e) {
                        $("out").textContent = "ERR " + e.message;
                    }
                }

                $("add").onclick = function () {
                    addResource(null, $("amount").value);
                };
                $("sub").onclick = function () {
                    var a = parseFloat($("amount").value) || 0;
                    addResource(null, -a);
                };
                $("ironium_add").onclick = function () {
                    addResource("ironium", $("ironium_amount").value);
                };
                $("ironium_sub").onclick = function () {
                    var a = parseFloat($("ironium_amount").value) || 0;
                    addResource("ironium", -a);
                };

                async function startMissionFlow() {
                    try {
                        var r = await post("activate_mission_flow", {
                            logic: $("flow_logic").value,
                            // #447: mode ist fest "default" — das Spiel
                            // erwartet das so (eigenes Lua sendet nichts
                            // anderes); ein Freitext-Wert killte die Pipe.
                            mode: "default",
                            // #386: optionaler Database-Payload. Leer = kein
                            // Payload (Alt-Verhalten, data=NULL).
                            spawn_point: $("flow_spawn").value,
                        });
                        $("out").textContent = r && r.ok ? "" : JSON.stringify(r);
                        refresh();
                    } catch (e) {
                        $("out").textContent = "ERR " + e.message;
                    }
                }

                $("flow_start").onclick = function () {
                    startMissionFlow();
                };

                async function stopMissionFlow() {
                    try {
                        var body = {};
                        var f = $("flow_stop").value;
                        if (f) {
                            body.flow = f;
                        }
                        var r = await post("deactivate_mission_flow", body);
                        $("out").textContent = r && r.ok ? "" : JSON.stringify(r);
                        refresh();
                    } catch (e) {
                        $("out").textContent = "ERR " + e.message;
                    }
                }

                async function creaturesDifficulty(op) {
                    try {
                        var r = await post("creatures_difficulty", {
                            op: op,
                            value: parseFloat($("cbd_value").value) || 0,
                        });
                        $("out").textContent = r && r.ok ? "" : JSON.stringify(r);
                        refresh();
                    } catch (e) {
                        $("out").textContent = "ERR " + e.message;
                    }
                }

                $("flow_stop_btn").onclick = function () {
                    stopMissionFlow();
                };

                $("cbd_set").onclick = function () {
                    creaturesDifficulty("set");
                };
                $("cbd_inc").onclick = function () {
                    creaturesDifficulty("increase");
                };
                $("cbd_dec").onclick = function () {
                    creaturesDifficulty("decrease");
                };

                refresh();
                setInterval(refresh, 3000);

                // --- server-control panel (testable) ---
                function createServerControlPanel(deps) {
                    var fetchFn = deps.fetch;
                    var doc = deps.document;
                    var DASH = "—";
                    var STATUS_IDS = [
                        "server_state",
                        "server_health",
                        "server_uptime",
                        "server_started_at",
                    ];
                    var LOG_ID = "server_logs";
                    var MSG_ID = "server_control_msg";

                    function el(id) {
                        return doc ? doc.getElementById(id) : null;
                    }

                    function setText(id, value) {
                        var node = el(id);
                        if (!node) return;
                        node.textContent =
                            value === undefined || value === null || value === ""
                                ? DASH
                                : String(value);
                    }

                    function dashAll() {
                        for (var i = 0; i < STATUS_IDS.length; i++) {
                            setText(STATUS_IDS[i], DASH);
                        }
                        setText(LOG_ID, DASH);
                    }

                    function msg(text) {
                        var node = el(MSG_ID);
                        if (node) node.textContent = text || "";
                    }

                    async function getJson(path) {
                        var res = await fetchFn(path, { method: "GET" });
                        if (!res || !res.ok) {
                            throw new Error("HTTP " + (res && res.status));
                        }
                        return res.json();
                    }

                    async function refreshStatus() {
                        try {
                            var s = await getJson("/server/status");
                            setText("server_state", s && s.state);
                            setText("server_health", s && s.health);
                            setText("server_uptime", s && s.uptime);
                            setText("server_started_at", s && s.started_at);
                            msg("");
                        } catch (e) {
                            dashAll();
                            msg("server status unavailable");
                        }
                    }

                    function tailCount() {
                        var node = el("server_logs_tail");
                        var n = node ? parseInt(node.value, 10) : NaN;
                        if (!isFinite(n) || n <= 0) n = 50;
                        if (n > 5000) n = 5000;
                        return n;
                    }

                    async function refreshLogs() {
                        try {
                            var n = tailCount();
                            var data = await getJson("/server/logs?tail=" + n);
                            var lines = data && data.lines;
                            if (!lines || !lines.length) {
                                setText(LOG_ID, DASH);
                                return;
                            }
                            setText(LOG_ID, lines.join("\n"));
                            msg("");
                        } catch (e) {
                            setText(LOG_ID, DASH);
                            msg("server logs unavailable");
                        }
                    }

                    async function control(action) {
                        if (
                            action !== "restart" &&
                            action !== "start" &&
                            action !== "stop"
                        ) {
                            return;
                        }
                        var failed = false;
                        try {
                            var res = await fetchFn("/server/" + action, {
                                method: "POST",
                                headers: { "content-type": "application/json" },
                                body: "{}",
                            });
                            if (!res || !res.ok) {
                                throw new Error("HTTP " + (res && res.status));
                            }
                        } catch (e) {
                            failed = true;
                        }
                        // Poll first, then set the outcome message: the refresh
                        // helpers clear/populate #server_control_msg, so setting it
                        // afterwards keeps the user confirmation visible.
                        await refreshStatus();
                        await refreshLogs();
                        msg("server " + action + (failed ? " failed" : " requested"));
                    }

                    return {
                        refreshStatus: refreshStatus,
                        refreshLogs: refreshLogs,
                        control: control,
                    };
                }
                // --- end server-control panel ---

                var serverPanel = createServerControlPanel({
                    fetch: window.fetch.bind(window),
                    document: document,
                });

                $("server_restart").onclick = function () {
                    serverPanel.control("restart");
                };
                $("server_start").onclick = function () {
                    serverPanel.control("start");
                };
                $("server_stop").onclick = function () {
                    serverPanel.control("stop");
                };
                $("server_logs_refresh").onclick = function () {
                    serverPanel.refreshLogs();
                };

                serverPanel.refreshStatus();
                serverPanel.refreshLogs();
                setInterval(serverPanel.refreshStatus, 5000);
            })();
        </script>
    </body>
</html>
