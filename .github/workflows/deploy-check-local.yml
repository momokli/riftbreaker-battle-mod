name: Deploy Check (local)

# Compose-natives Gate (Issue #1093/#1122): Ansible ist nicht mehr die Runtime.
# Validiert NUR noch den eingecheckten Compose-Stack (`compose.yaml`) — keine
# Playbook-Syntax, keine env-Schema-/Render-Tests, kein deploy-gate mehr.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevante Pfade (Deploy-Check-Local)
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Relevante Pfade bestimmen
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch: kein diff -> immer voll laufen lassen.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null || true)"
          # Diff-Probleme: over-inclusive laufen lassen (nie faelschlich skippen).
          if [ -z "$CHANGED" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" \
             | grep -Eq '^(deploy/|compose\.yaml|\.env\.example|\.github/workflows/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-check-local:
    # Rein lokale Compose-Checks auf einem GitHub-Hosted-Runner.
    name: deploy-check-local
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keine relevanten Pfade — Deploy-Check übersprungen (Gate bleibt grün)
        if: needs.changes.outputs.relevant != 'true'
        run: echo "Keine deploy-relevanten Pfade geändert — kein Deploy-Check nötig."

      - name: Fork-PR erkennen (Gate nur für Repo-eigene PRs)
        id: gate
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork-PR — deploy-check-local wird übersprungen (nur Repo-eigene PRs)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'

      # YAML-Lint der eingecheckten compose.yaml (echte YAML-Fehler frueh fangen;
      # `docker compose config` parst zusätzlich, yamllint ergaenzt die Style-Regeln).
      - name: "YAML-Lint (compose.yaml)"
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet "yamllint==1.35.1"
          yamllint -c .yamllint compose.yaml

      # Compose-natives Gate: validiert die EINGECHECKTE compose.yaml gegen die
      # Modus-Matrix solo/versus (der Stack ist das Artefakt, Issue #1093).
      - name: "Compose (checked-in): docker compose config + Modus-Matrix"
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          for mode in solo versus; do
            echo "== RBB_MODE=$mode =="
            RBB_MODE="$mode" docker compose --env-file .env config >/dev/null
          done
          echo "compose.yaml OK (solo, versus)"

      # Dockerfile-Guard (Issue #1132): die Code-Services WIRKLICH bauen (nicht nur
      # `config`) — ein kaputtes COPY/Context faellt sonst erst beim Deploy auf.
      # Bewusst ohne die schweren Images: `dedicated` (Wine ~2 GB) bleibt aus.
      - name: "Compose: Build der Code-Services (Dockerfile-Guard)"
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose --env-file .env build \
            session-recorder send-tailer match-loop attack-cycle \
            capsule-flow crash-collector server-control \
            queue provisioner warm

      # Hygiene-Timer-Sidecar (Issue #1103): die Ofelia-Jobs (image-retention /
      # host-hygiene) muessen per Labels/Env/Mounts am `hygiene`-Service sitzen.
      - name: "Hygiene-Timer (Ofelia) verdrahtet (#1103)"
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: bash deploy/tests/hygiene-sidecar/run.sh

      # content-init-Idempotenz (Issue #1102): der Compose-Init-Container zieht den
      # Content nur beim Erstlauf bzw. mit force; danach offline gruen (#1095).
      - name: "content-init Idempotenz (hermetisch)"
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: bash deploy/compose/init/test-content-init.sh
