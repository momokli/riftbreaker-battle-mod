name: Follow-up-Issues

# Follow-up-Issues auf Anforderung: Ein Follow-up-Issue mit der Checkliste der
# Qualitaets-Dimensionen (Code-Optimierung, Dokumentation, Accessibility,
# UI-Design, HUD-Design, Game-Design) entsteht NUR, wenn ein Issue explizit mit
# dem Label "quality-sweep" markiert wird. Das Label wird danach wieder
# entfernt (one-shot) — erneutes Anfordern heisst: Label erneut setzen.
#
# Historie: Bis 2026-09-23 hing der Workflow an "issues: [closed]" und erzeugte
# bei JEDEM Close ein Issue. Ergebnis: 163 offene Follow-ups ohne eigenen Inhalt
# (am 2026-09-23 geschlossen; der Workflow dazu deaktiviert und durch dieses
# explizite Gate ersetzt).
#
# Guards:
#  - Ohne "quality-sweep" passiert gar nichts.
#  - Issues mit Label "follow-up" werden uebersprungen -> keine Follow-up-Ketten
#    (jedes Follow-up traegt das Label).
#  - Assignee wird nur bei Menschen gesetzt (kein "[bot]") und nur, wenn der
#    Login existiert; bei Fehler wird ohne --assignee wiederholt.
# Least privilege: issues:write (Label + Issue anlegen/entfernen), contents:read.

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  followup:
    name: Follow-up-Issue anlegen
    if: >-
      github.event.label.name == 'quality-sweep'
      && !contains(github.event.issue.labels.*.name, 'follow-up')
    runs-on: ubuntu-latest
    steps:
      - name: Labels sicherstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create follow-up \
            --color bf3989 \
            --description "Automatisch erstelltes Follow-up-Issue" \
            || true  # existiert das Label bereits, ist der Fehler harmlos
          gh label create quality-sweep \
            --color 0e8a16 \
            --description "Stoesst ein Follow-up-Issue an (wird danach entfernt)" \
            || true

      - name: Follow-up-Issue erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REQUESTER: ${{ github.actor }}
        run: |
          # GitHub-Titel-Limit: 256 Zeichen — bei Bedarf kuerzen.
          TITLE="Follow-up zu #$ISSUE_NUMBER: $ISSUE_TITLE"
          if (( ${#TITLE} > 256 )); then
            TITLE="Follow-up zu #$ISSUE_NUMBER: ${ISSUE_TITLE:0:120} …"
          fi

          BODY="$(cat <<EOF
          Automatisch erstellt als Follow-up zu #$ISSUE_NUMBER („$ISSUE_TITLE“), angefordert von @$REQUESTER.

          Für jede zutreffende Dimension ein eigenes Issue bzw. einen PR aufmachen und hier verlinken:

          - [ ] Code-Optimierung
          - [ ] Dokumentation
          - [ ] Accessibility
          - [ ] UI-Design
          - [ ] HUD-Design
          - [ ] Game-Design
          EOF
          )"

          # Assignee nur bei Menschen (kein "[bot]") und nur, wenn Login existiert.
          ASSIGNEE=()
          case "$REQUESTER" in
            *'[bot]')
              ;;
            *)
              if gh api "users/$REQUESTER" >/dev/null 2>&1; then
                ASSIGNEE=(--assignee "$REQUESTER")
              fi
              ;;
          esac

          # Bei Fehler (z. B. Assignee nicht zuweisbar) ohne Assignee wiederholen.
          gh issue create --title "$TITLE" --label follow-up --body "$BODY" "${ASSIGNEE[@]}" \
            || gh issue create --title "$TITLE" --label follow-up --body "$BODY"

      - name: Anforderungs-Label entfernen (one-shot)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label quality-sweep
