name: Deploy (CD)

# Continuous Deployment (PROD-ONLY, Issue #1034): nur ein Tag-Push `v*` rollt
# PROD aus (Prod-A :6322 + Prod-B :6325 über den GNS-Entry-Relay planet:6321,
# Operator-Cockpit cockpit.rift.projectmellon.de, deploy/deploy-prod.yml).
# Der frühere Merge-auf-main-Deploy (dev) und der `staging`-Branch-Deploy sind
# mit dem Deployment-Cleanup entfallen — es gibt nur noch die prod-Welt.
#
# Deploy-Mechanik: SSH als deploy-User (`ssh rbd "<sha> <ref>"`), forced command
# macht git fetch + Hard-Checkout + Playbook. Der Remote-forced-command
# akzeptiert NUR `refs/tags/v*` -> prod (deploy/deploy-prod.yml); jeder andere
# ref ist ein Fehler (fail loud).
#
# (2026-09-13) Deploy-Gate ("parken bis 0 Spieler online") ENTFERNT:
# deployt sofort bei jedem Tag-Push, ohne auf leeren Server zu warten.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy Prod A+B (planet :6322/:6325)
    runs-on: [self-hosted, planet]
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: cd-prod
      cancel-in-progress: false
    environment:
      name: prod
      url: https://cockpit.rift.projectmellon.de/
    steps:
      # Prod fährt deploy/deploy-prod.yml (Play 0 host-services + Prod-A +
      # Prod-B; jede Play laedt ihre Vars per `vars_files`, KEIN globales
      # `-e @prod-vars.yml` — Issue #995). Der Remote-forced-command akzeptiert
      # nur Tag-Pushes (Issue #1034).
      - name: Deploy per SSH (deploy-User, forced command)
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes rbd "${GITHUB_SHA} ${GITHUB_REF}"
