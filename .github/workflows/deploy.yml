name: Deploy (CD)

# Continuous Deployment: jeder Merge auf main rollt den aktuellen Mod-Stand
# automatisch auf den Solo-DEV-Server (planet, Port 6321) aus.
#
# Topologie (Issue #91): EIN Server auf :6321, disable_steam "1"; kein Tag→prod-Kanal.
# Deploy-Mechanik: SSH als deploy-User (`ssh rbd "<sha> <ref>"`), forced command macht
# git fetch + Hard-Checkout + Playbook.
#
# (2026-09-13) Deploy-Gate ("parken bis 0 Spieler online") ENTFERNT:
# deployt sofort bei jedem Merge auf main, ohne auf leeren Server zu warten.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Dev (planet :6321)
    runs-on: [self-hosted, planet]
    timeout-minutes: 60
    environment:
      name: dev
      url: https://rift.projectmellon.de/solo.html
    steps:
      - name: Deploy per SSH (deploy-User, forced command)
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes rbd "${GITHUB_SHA} ${GITHUB_REF}"
