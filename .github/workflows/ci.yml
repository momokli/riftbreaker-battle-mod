name: CI

# Tests + Build/Package. Läuft für alle Pull Requests, auf Push nach main und auf Tag-Push (v*).
#
# Path-Gating (Issue #393): die teuren planet-Jobs (`test`, `build`) sind
# Required-Checks und laufen deshalb IMMER (damit der Context nie als
# "Expected" hängen bleibt), überspringen aber ihre Arbeit, wenn kein
# relevanter Pfad geändert wurde. Der vorgelagerte, billige `changes`-Job
# (ubuntu-latest) bestimmt die relevanten Pfade per git diff — dasselbe Muster
# wie in boot-test.yml. `tournament-test` ist KEIN Required-Check und wird
# deshalb über `if:` komplett übersprungen, wenn keine Rust-Quellen betroffen
# sind.
#
# Relevanz-Kategorien:
#   test        client-mod/, server/, cockpit/, tests/, tools/, scripts/ (statische/Unit-Tests)
#   build       server/ + cockpit/ + client-mod/ + Packaging-Skripte (dist/*.zip, rbbridge.dll)
#   tournament  tournament/src + Cargo.toml/Cargo.lock (cargo test)
#
# Tags (`v*`) triggern den Workflow zusätzlich (Issue #499): ein Tag-Push
# überspringt den Pfad-Filter und baut IMMER, damit die Build-Identität
# (ref = Tag) kohärent in den Mod gebacken wird. GitHub-Releases werden
# weiterhin NICHT angelegt - der Download läuft über den deployten Stand
# (https://rift.projectmellon.de/mods/rbbattle.zip).
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

# Per-Ref-Concurrency (Issue #751): jeder Push auf einen PR-Branch legt sonst
# einen kompletten Satz Jobs neu an, waehrend die vorherigen noch in der Queue
# stehen (Push-Kaskade). Diese ref-scoped Group cancelt den ueberholten Lauf
# desselben PRs (cancel-in-progress: true) und verdraengt dabei KEINE wartenden
# Laeufe anderer PRs — das Starving-Problem aus #303 tritt nicht wieder auf
# (das ist nicht die globale Gruppe aus #303/#305).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevante Pfade (CI)
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.decide.outputs.test }}
      build: ${{ steps.decide.outputs.build }}
      tournament: ${{ steps.decide.outputs.tournament }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Relevante Pfade bestimmen
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # Tag-Push (refs/tags/*): IMMER voll bauen - ein Tag soll unabhängig
          # von Pfad-Änderungen paketieren, damit die gebackene Build-Identität
          # (ref = Tag) kohärent ist. Der git-diff-Pfadfilter ist für Tags
          # nicht aussagekräftig (before = vorherige Tag-Spitze bzw. all-zeros).
          case "$GITHUB_REF" in
            refs/tags/*)
              echo "test=true" >> "$GITHUB_OUTPUT"
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "tournament=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # PR: base..head; Push nach main: before..after. Bei Diff-Problemen
          # over-inclusive laufen lassen (nie fälschlich skippen -> Required-
          # Check bliebe sonst fälschlich grün).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null || true)"
          else
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null || true)"
          fi
          if [ -z "$CHANGED" ]; then
            echo "test=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tournament=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$CHANGED" \
             | grep -Eq '^(client-mod/|server/|cockpit/|tests/|tools/|scripts/|\.github/workflows/ci\.yml)'; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "test=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED" \
             | grep -Eq '^(server/|cockpit/|client-mod/|scripts/(package|mod_version|build_ref)\.sh|scripts/bake_mod_ref\.py|\.github/workflows/ci\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED" \
             | grep -Eq '^(tournament/src/|tournament/Cargo\.toml|tournament/Cargo\.lock)'; then
            echo "tournament=true" >> "$GITHUB_OUTPUT"
          else
            echo "tournament=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (Unit-Tests + rbbridge host-test)
    needs: changes
    # Hermetisch (unittest/npm test, Host-cc/gcc fuer den rbbridge-hosttest) —
    # laeuft auf GitHub-Hosted und entlastet so den seriellen planet-Runner.
    # build bleibt auf planet (MinGW/ccache); needs ist runner-agnostisch.
    runs-on: ubuntu-latest
    steps:
      - name: Keine relevanten Pfade — Tests übersprungen (Gate bleibt grün)
        if: needs.changes.outputs.test != 'true'
        run: echo "Keine test-relevanten Pfade geändert — kein Testlauf nötig."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.test == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.test == 'true'
        with:
          node-version: 20
      # Kein npm-Store-Cache mehr (Issue #306): die verbleibenden Node-Tests
      # (rbbridge-/pipe-bridge-hosttest) haben keine externen Dependencies
      # (package.json ohne deps, `node --test`), brauchen also kein `npm ci`
      # und damit auch keinen Cache mehr — der Eintrag war zuletzt ohnehin ein
      # No-op auf Basis des package-lock.json-Hash.
      - name: Unit-Test Deploy-Gate (Issue #118)
        if: needs.changes.outputs.test == 'true'
        working-directory: tools/deploy-gate
        run: python3 -m unittest test_deploy_gate -v
      - name: Unit-Test Mod-Updater (Issue #120)
        if: needs.changes.outputs.test == 'true'
        working-directory: tools/mod-updater
        run: python3 -m unittest test_mod_update -v
      - name: Unit-Test Mods-Guard (Issue #212)
        if: needs.changes.outputs.test == 'true'
        working-directory: tools/mods-guard
        run: python3 -m unittest test_check_mods_dir -v
      - name: Unit-Test Session-Recorder (Issue #280)
        if: needs.changes.outputs.test == 'true'
        working-directory: deploy/session-recorder
        run: python3 -m unittest test_session_recorder -v
      # Send-Tailer (#713): parst -send waveN aus Mod-Chat-Log-Zeilen und POSTet
      # an /order. Hermetisch (Fake-Poster), kein Netz/Spiel. stdlib-only.
      - name: Unit-Test Send-Tailer (Issue #713)
        if: needs.changes.outputs.test == 'true'
        working-directory: deploy/send-tailer
        run: python3 -m unittest test_send_tailer -v
      # Match-Loop (#730): pollt get_state, HQ zerstoert -> end_game(lose) ->
      # restart_map. Hermetisch (Fake-Poster/-Clock), kein Netz/Spiel. stdlib-only.
      - name: Unit-Test Match-Loop (Issue #730)
        if: needs.changes.outputs.test == 'true'
        working-directory: deploy/match-loop
        run: python3 -m unittest test_match_loop -v
      # Attack-Cycle (PoC): 7-min-Zyklus, HQ-Bau-Erkennung, gestapelte Kaeufe.
      # Hermetisch (Fake-Poster/-Clock), kein Netz/Spiel. stdlib-only.
      - name: Unit-Test Attack-Cycle (PoC)
        if: needs.changes.outputs.test == 'true'
        working-directory: deploy/attack-cycle
        run: python3 -m unittest test_attack_cycle -v
      - name: Unit-Test Core-IO-Probe RBBATTLE-Tag-Erkennung (Issue #696)
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/core-io
        run: python3 -m unittest test_core_io_probe -v
      # Pack-Reader (Issue #416): zip64-sichere Game-Pack-Leser, hermetisch
      # (synthetische Zips im tmpdir, kein Game-Daten-Zugriff).
      - name: Unit-Test Pack-Reader (Issue #416)
        if: needs.changes.outputs.test == 'true'
        working-directory: tools/re
        run: python3 -m unittest test_rbpack -v
      # L7-Router (Issue #825): userspace-UDP-Router fuer :6321, Namens-Lernen
      # und Zielwechsel. Hermetisch (UDP auf Loopback, Fake-Clock).
      - name: Unit-Test L7-Router (Issue #825)
        if: needs.changes.outputs.test == 'true'
        working-directory: tools/net-router
        run: python3 -m unittest test_rbrouter -v
      # GNS-Proxy (Issue #831): pcap-Flow-Parser fuer den Handshake-Mitschnitt
      # (Client-Handshake -> Server-Antwort -> Name). Hermetisch (synthetische pcaps).
      - name: Unit-Test GNS-Proxy pcap-Parser (Issue #831)
        if: needs.changes.outputs.test == 'true'
        working-directory: tools/gns-proxy
        run: python3 -m unittest test_pcap_flow -v
      # Routing-Regeln des GNS-Entry-Relays (Issue #843): exakt > Suffix > Default.
      # Reine Logik (route_rules.h) — host-compiliert, kein Wine/Windows/Spiel.
      - name: Host-Test Routing-Regeln (Issue #843)
        if: needs.changes.outputs.test == 'true'
        run: |
          g++ -std=c++17 -Wall -Wextra -O1 -o /tmp/test_route_rules tools/gns-proxy/test_route_rules.cpp
          /tmp/test_route_rules
      # API-Helfer des GNS-Entry-Relays (Issue #857): Target-Spec + JSON lesen /
      # escapen. Reine Logik (api_util.h) — host-compiliert, kein Wine/Windows.
      - name: Host-Test Relay-API-Helfer (Issue #857)
        if: needs.changes.outputs.test == 'true'
        run: |
          g++ -std=c++17 -Wall -Wextra -O1 -o /tmp/test_api_util tools/gns-proxy/test_api_util.cpp
          /tmp/test_api_util
      # Server-Control-Host-Agent (Issue #459): Unit-/Integrationstests ohne
      # Docker, Netz oder Spiel (Fake-docker-Binary + echter Agent auf
      # Ephemeral-Port). Reiner Standardbibliothek-Code, daher kein npm ci.
      - name: Unit-Test Server-Control (Issue #459)
        if: needs.changes.outputs.test == 'true'
        working-directory: deploy/server-control
        run: python3 -m unittest test_server_control -v
      # rbbridge-/pipe-bridge-hosttest sind dependency-frei (node:test) —
      # kein `npm ci` mehr nötig (Issue #306, leaner CI). `npm test` startet
      # `node --test` direkt.
      - name: rbbridge host-test (Issue #243)
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/rbbridge-hosttest
        run: npm test
      # pipe_bridge /health-Logik (Issue #902): Statuscode+Body aus
      # health_logic.h host-kompiliert. "Pipe trennen" = pipe_ok=0 -> 503.
      - name: pipe-bridge host-test (Issue #902)
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/pipe-bridge-hosttest
        run: npm test
      # Server-Control-Panel (#422): extrahiert den testbaren Marker-Block aus
      # cockpit.html und prueft das defensive Contract (immer "—", nie werfen,
      # nie location.reload). Keine Dependencies, daher kein npm ci noetig.
      - name: Unit-Test Server-Control-Panel (Issue #422)
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/server-control-panel
        run: npm test
      # Self-Send-Tracker: zeigt die eigenen Sends (queued/outgoing) + den
      # send-yourself-Toggle. Extrahierter Marker-Block aus cockpit.html,
      # kein Netzwerk/DOM. Keine Dependencies. (Ersetzt das alte Send-Log #527.)
      - name: Unit-Test Self-Send-Tracker
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/self-send-tracker
        run: npm test
      # Persona-Editor (#788): 10x9-Count-Matrix (load/inc/dec/save/restore/
      # add/remove/setActive). Extrahierter Marker-Block, kein Netzwerk/DOM.
      - name: Unit-Test Persona-Editor (Issue #788)
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/persona-editor
        run: npm test
      # Natural-Attacks-Editor (#819): Difficulty 1-9 x attack-count/boss
      # (load/inc/dec/setBoss/setOffset/save/restore). Extrahierter Marker-Block,
      # kein Netzwerk/DOM. Keine Dependencies.
      - name: Unit-Test Natural-Attacks-Editor (#819)
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/natural-attack-editor
        run: npm test
      # Game-Config-Editor (#827/#828): mode/warmup_s + Toggles
      # (natural/persona/send_yourself/send_enemy) + start/ready + State
      # (load/loadStatus/setField/save/restore/start/setReady). Extrahierter
      # Marker-Block, kein Netzwerk/DOM. Keine Dependencies.
      - name: Unit-Test Game-Config-Editor (#827)
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/game-config-editor
        run: npm test
      # Cockpit Render-Test (#832): rendert cockpit.html im echten Chromium
      # (Tab-Struktur + roving tabindex, Formulare, Docker-Log auto-tail, keine
      # JS-Fehler). Playwright/Chromium sind nicht Teil des CI-Images -> der
      # Test ueberspringt sich dann selbst (kein Hard-Fail).
      - name: Render-Test Cockpit (#832)
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/cockpit-render
        run: npm test
      # Chat-Absender (#935): Normalisierung des frei waehlbaren Absenders
      # (leer/"system" -> ohne Prefix, sonst bereinigter Name, max 24 Zeichen).
      # Extrahierter Marker-Block, kein Netzwerk/DOM. Keine Dependencies.
      - name: Unit-Test Chat-Absender (#935)
        if: needs.changes.outputs.test == 'true'
        working-directory: tests/chat-sender
        run: npm test

  build:
    name: Build + Package (rbbridge.dll/exe, dist/*.zip)
    needs: [changes]
    runs-on: [self-hosted, planet]
    steps:
      - name: Keine relevanten Pfade — Build übersprungen (Gate bleibt grün)
        if: needs.changes.outputs.build != 'true'
        run: echo "Keine build-relevanten Pfade geändert — kein Build/Package nötig."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.build == 'true'
      # MinGW-w64 ist jetzt vorab auf dem Runner-Host installiert
      # (.github/runner/setup.sh, Issue #153) — kein per-Job-sudo-apt-get mehr.
      # Der Cross-Compiler muss auf dem Host vorhanden sein; sonst fällt
      # package.sh auf das Quell-Zip für Baustein 04 zurück.
      - name: ccache-Cache (MinGW-C++-Build rbbridge)
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-rbbridge-${{ runner.os }}-${{ hashFiles('server/**/*.c') }}
          restore-keys: |
            ccache-rbbridge-${{ runner.os }}-
      - name: Baustein-04-Binaries kompilieren + alle Zips bauen
        if: needs.changes.outputs.build == 'true'
        env:
          # Build-Identität (Issue #499): bei Tag-Push den Tag, sonst den
          # Commit-SHA in den Mod backen (package.sh substituiert
          # RBB_BUILD_REF in der ausgelieferten Lua).
          RBB_BUILD_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          # ccache-Wrapper aus setup.sh aktivieren, falls vorhanden; sonst
          # direkter MinGW-Build (graceful degradation, kein Hard-Fail).
          if [ -d /opt/ccache-rbbattle/bin ]; then
            export PATH="/opt/ccache-rbbattle/bin:$PATH"
            echo "ccache-Wrapper aktiv: $(command -v x86_64-w64-mingw32-gcc)"
          else
            echo "Hinweis: /opt/ccache-rbbattle/bin fehlt — .github/runner/setup.sh noch nicht ausgeführt; Build ohne ccache."
          fi
          bash scripts/package.sh

      # ccache-Effektivitaet sichtbar machen (Issue #306, .github/runner/README.md
      # "Offen" Punkt 4): pro Build die Hit-Rate ausgeben, damit die Kennzahl
      # messbar wird. Bricht nie ab (best-effort).
      - name: ccache-Statistik (Issue #306)
        if: needs.changes.outputs.build == 'true'
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || true
          else
            echo "ccache nicht im PATH — keine Statistik."
          fi
      - name: Artefakte hochladen (dist/*.zip + Mod-Updater)
        if: needs.changes.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-zips
          # Mod-Updater als Einzeldatei mitliefern (Issue #120: ohne Checkout
          # herunterladbar); rbbattle.zip bleibt der Primaer-Download.
          path: |
            dist/*.zip
            tools/mod-updater/mod_update.py
          if-no-files-found: error

  tournament-test:
    name: Test tournament-server (Rust)
    needs: changes
    if: needs.changes.outputs.tournament == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest bringt Rust (rustup, stable) mit; cargo test kompiliert
      # das tournament/-Crate und führt die State-Machine/API-Tests aus.
      - name: cargo test
        working-directory: tournament
        run: cargo test
