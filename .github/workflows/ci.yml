name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Bausteine 06 + 07 E2E)
    runs-on: [self-hosted, planet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Warmer npm-Store (Issue #153): npm ci zieht fengari/luaparse aus dem
      # Cache statt aus dem Netz. Key basiert auf beiden package-lock.json.
      - name: npm-Dependency-Cache (actions/cache)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-store-${{ runner.os }}-${{ hashFiles('tests/lua-static/package-lock.json', 'tests/e2e-vollkette/package-lock.json') }}
          restore-keys: |
            npm-store-${{ runner.os }}-
      - name: E2E Baustein 06 (tournament-server)
        working-directory: bausteine/06-tournament-server
        run: bash test_e2e.sh
      - name: E2E Baustein 07 (relay-Prototyp)
        working-directory: bausteine/07-relay
        run: bash test_e2e_prototype.sh
      - name: Unit-Test Relay-Pipe-Dispatch (Issue #60)
        working-directory: bausteine/07-relay
        run: python3 -m unittest test_dispatch -v
      - name: Unit-Test Deploy-Gate (Issue #118)
        working-directory: tools/deploy-gate
        run: python3 -m unittest test_deploy_gate -v
      - name: Unit-Test Solo-Feed (Issue #157)
        working-directory: tools/solo-feed
        run: python3 -m unittest test_feed -v
      - name: Unit-Test Mod-Updater (Issue #120)
        working-directory: tools/mod-updater
        run: python3 -m unittest test_mod_update -v
      - name: Lua Static Tests (fengari + luaparse, Issue #28)
        working-directory: tests/lua-static
        run: npm ci && npm test
      - name: Vollketten-E2E (Issue #11: rb_wave 3 Web-UI → Server → Relay → rbbridge → Mod)
        working-directory: tests/e2e-vollkette
        run: npm ci && npm test
      - name: Landing Live-Status-Widget (Issue #30)
        working-directory: tests/live-status
        run: node --test

  build:
    name: Build + Package (rbbridge.dll/exe, dist/*.zip)
    needs: test
    runs-on: [self-hosted, planet]
    steps:
      - uses: actions/checkout@v4
      # MinGW-w64 ist jetzt vorab auf dem Runner-Host installiert
      # (.github/runner/setup.sh, Issue #153) — kein per-Job-sudo-apt-get mehr.
      # Der Cross-Compiler muss auf dem Host vorhanden sein; sonst fällt
      # package_bausteine.sh auf das Quell-Zip für Baustein 04 zurück.
      - name: ccache-Cache (MinGW-C++-Build rbbridge)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-rbbridge-${{ runner.os }}-${{ hashFiles('bausteine/04-trainer-io/**/*.c') }}
          restore-keys: |
            ccache-rbbridge-${{ runner.os }}-
      - name: Baustein-04-Binaries kompilieren + alle Zips bauen
        run: |
          # ccache-Wrapper aus setup.sh aktivieren, falls vorhanden; sonst
          # direkter MinGW-Build (graceful degradation, kein Hard-Fail).
          if [ -d /opt/ccache-rbbattle/bin ]; then
            export PATH="/opt/ccache-rbbattle/bin:$PATH"
            echo "ccache-Wrapper aktiv: $(command -v x86_64-w64-mingw32-gcc)"
          else
            echo "Hinweis: /opt/ccache-rbbattle/bin fehlt — .github/runner/setup.sh noch nicht ausgeführt; Build ohne ccache."
          fi
          bash scripts/package_bausteine.sh
      - name: Artefakte hochladen (dist/*.zip + Mod-Updater)
        uses: actions/upload-artifact@v4
        with:
          name: bausteine-zips
          # Mod-Updater als Einzeldatei mitliefern (Issue #120: ohne Checkout
          # herunterladbar); rbbattle.zip bleibt der Primaer-Download.
          path: |
            dist/*.zip
            tools/mod-updater/mod_update.py
          if-no-files-found: error

  release:
    name: GitHub Release (Tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Der release-Job läuft bewusst auf GitHub-Hosted ubuntu-latest (ephemer,
      # nicht planet) und braucht MinGW daher weiterhin per apt — das pre-baked
      # planet-Setup greift hier nicht.
      - name: MinGW-W64 installieren (Windows-x64 Cross-Compiler)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Zips bauen (wie Job build)
        run: bash scripts/package_bausteine.sh
      - name: Release anlegen (falls Tag noch nicht existiert)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME existiert bereits — Zips + Mod-Updater nachladen."
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.zip tools/mod-updater/mod_update.py --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.zip tools/mod-updater/mod_update.py \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
