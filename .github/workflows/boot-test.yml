name: Boot-Test (interne Verifikation)

# Pre-Merge-Gate (CI/CD-Plan F1, Issue #275): baut die Images und bootet den
# Game-Server + den Tournament-Server als ZWEI Container im selben Compose/Netz.
# Die Test-Instanz hat BEWUSST keine Host-Ports; verifiziert wird ausschliesslich
# INTERN per `docker inspect`/`docker exec` (kein Host-curl) — deterministisch,
# ohne Port-Kollision mit Prod (6321/8081/9001 bleiben Prod vorbehalten).
# Der Job-Name IST der Required-Check-Context "boot-test".
#
# Kein Secret nötig: Dummy-Vault (Test-Passwort) + Test-Pfade.

on:
  pull_request:

permissions:
  contents: read

# Serialisieren: nur EIN Test-Container-Set zur Zeit (Netz rb_default ist pro
# Lauf exklusiv) — verhindert Kollisionen bei parallelen PR-Läufen.
concurrency:
  group: boot-test
  cancel-in-progress: false

jobs:
  boot-test:
    name: boot-test
    runs-on: [self-hosted, planet]
    timeout-minutes: 25
    steps:
      - name: Fork-PR erkennen (Gate nur für Repo-eigene PRs)
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork-PR — Boot-Test übersprungen (nur Repo-eigene PRs)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Tooling bereitstellen (ansible für den Runner-User)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Kein rustup/cargo mehr: der Tournament-Server wird als Image im
          # Docker-Build gebaut (Issue #275), nicht mehr auf dem Runner.
          VENV="$HOME/.local/ansible-deploy-check"
          if [ ! -x "$VENV/bin/ansible-playbook" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --disable-pip-version-check \
              "ansible-core==2.19.*" "yamllint==1.35.1"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/ansible" --version

      - name: SSH-Voraussetzung prüfen (runner -> root@planet)
        if: steps.gate.outputs.skip != 'true'
        run: |
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 planet 'id -u' >/dev/null 2>&1; then
            echo "::error::Boot-Test braucht SSH runner@planet -> root@planet (Alias planet). Einrichtung: deploy/README.md, Abschnitt deploy-check (PR-Gate)."
            exit 1
          fi

      - name: Runner-Cleanup (stehengebliebene Test-Container/Netz entfernen)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Infra-Gate: ein zuvor abgebrochener Lauf kann die Test-Container bzw.
          # das Netz stehen lassen. Dann ist das Netz rb_default belegt und der
          # Deploy scheitert — das Required-Gate `boot-test` stünde dauerhaft rot,
          # unabhängig vom PR-Diff.
          ssh planet 'docker rm -f riftbreaker-dedicated-test riftbreaker-dedicated-test-tournament 2>/dev/null || true'
          ssh planet 'docker network rm rb_default 2>/dev/null || true'

      - name: Test-Deploy ohne Host-Ports (Dummy-Vault, kein Secret)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          INV="$(mktemp -d)/inventory"
          cp -r deploy/inventory "$INV"
          cat > "$INV/host_vars/planet/vault.yml" <<'EOF'
          ---
          riftbreaker_server_password: boot-test
          vault_solo_basic_auth_hash: ""
          EOF
          ansible-playbook -i "$INV" deploy/test-deploy.yml -e @deploy/test-vars.yml

      - name: Boot verifizieren (intern — docker inspect/exec, keine Host-Ports)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ssh planet bash -s <<'REMOTE'
          set -euo pipefail
          DEDI=riftbreaker-dedicated-test
          TOURN=riftbreaker-dedicated-test-tournament

          echo "== Container-Status =="
          dst="$(docker inspect -f '{{.State.Status}}' "$DEDI")"
          drst="$(docker inspect -f '{{.State.Restarting}}' "$DEDI")"
          echo "dedicated: status=$dst restarting=$drst"
          [ "$dst" = running ] || { echo "::error::$DEDI bootet nicht (status=$dst)"; exit 1; }
          [ "$drst" = false ] || { echo "::error::$DEDI ist in einer Crash-Loop"; exit 1; }

          echo "== Tournament healthy (bounded retry) =="
          healthy=false
          for i in $(seq 1 30); do
            tst="$(docker inspect -f '{{.State.Status}}' "$TOURN" 2>/dev/null || echo missing)"
            ths="$(docker inspect -f '{{.State.Health.Status}}' "$TOURN" 2>/dev/null || echo unknown)"
            echo "try $i: status=$tst health=$ths"
            if [ "$tst" = running ] && [ "$ths" = healthy ]; then healthy=true; break; fi
            sleep 5
          done
          [ "$healthy" = true ] || { echo "::error::$TOURN wird nicht healthy"; exit 1; }

          echo "== /health intern (docker exec) =="
          docker exec "$TOURN" curl -fsS http://127.0.0.1:8081/health | tee /tmp/tournament-health.json
          grep -q '"ok":true' /tmp/tournament-health.json \
            || { echo "::error::/health liefert kein ok:true"; exit 1; }

          echo "== Kein Host-Port der Test-Instanz =="
          for c in "$DEDI" "$TOURN"; do
            p="$(docker port "$c")"
            if [ -n "$p" ]; then
              echo "::error::$c publiziert Host-Ports: $p"
              exit 1
            fi
          done
          # Nur die alten, test-spezifischen Ports pruefen: 8081/9001 gehoeren im
          # Produktivbetrieb dem Dedi-/Tournament-Container (loopback-Publish) und
          # sind hier bewusst NICHT verboten — der Test selbst publiziert nichts
          # (docker port ist oben leer).
          if ss -ltn | grep -qE ':(6323|8091|9003)\b'; then
            echo "::error::Alter Test-Host-Port belegt:"
            ss -ltn | grep -E ':(6323|8091|9003)\b' || true
            exit 1
          fi
          echo "keine Test-Host-Ports (docker port leer, ss sauber)"

          echo "== Interner DNS-Pfad zur Bridge (bounded retry) =="
          dns_ok=false
          for i in $(seq 1 30); do
            if out="$(docker exec "$TOURN" curl -fsS "http://$DEDI:9001/health" 2>/dev/null)"; then
              echo "try $i: $out"
              if printf '%s' "$out" | grep -q '"ok":true'; then dns_ok=true; break; fi
            else
              echo "try $i: Bridge noch nicht erreichbar"
            fi
            sleep 5
          done
          [ "$dns_ok" = true ] || { echo "::error::Bridge $DEDI:9001 aus dem Tournament-Container nicht erreichbar (Docker-DNS)"; exit 1; }

          echo "== POST /wave intern (200 + ok:true + exec_ok:true, bounded retry) =="
          wave_ok=false
          for i in $(seq 1 24); do
            raw="$(docker exec "$TOURN" curl -sS -X POST \
              -H 'content-type: application/json' \
              -d '{"world":"A","n":3}' \
              -w '\n%{http_code}' http://127.0.0.1:8081/wave 2>/dev/null || true)"
            code="${raw##*$'\n'}"
            body="${raw%$'\n'*}"
            echo "try $i: http=$code body=$body"
            if [ "$code" = 200 ] \
               && printf '%s' "$body" | grep -q '"ok":true' \
               && printf '%s' "$body" | grep -q '"exec_ok":true'; then
              wave_ok=true; break
            fi
            sleep 10
          done
          [ "$wave_ok" = true ] || { echo "::error::POST /wave liefert kein exec_ok:true (Bridge/Mod nicht bereit)"; exit 1; }

          echo "Boot-Test OK: beide Container laufen, /health + Bridge-DNS + /wave intern verifiziert."
          REMOTE

      - name: Aufräumen (Container + Netz + Legacy-Unit-Reste)
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          ssh planet 'docker compose -f /opt/rbbattle-deploy/test/rb/docker-compose.yml down --remove-orphans 2>/dev/null || true'
          ssh planet 'docker rm -f riftbreaker-dedicated-test riftbreaker-dedicated-test-tournament 2>/dev/null || true'
          ssh planet 'docker network rm rb_default 2>/dev/null || true'
          # Legacy-Test-Unit best-effort entfernen (kein systemd-Verifikationspfad):
          ssh planet 'systemctl stop tournament-server-test 2>/dev/null || true'
          ssh planet 'rm -f /etc/systemd/system/tournament-server-test.service 2>/dev/null || true'
          ssh planet 'systemctl daemon-reload 2>/dev/null || true'
