name: Boot-Test (Test-Ports)

# Pre-Merge-Gate (CI/CD-Plan F1): baut + bootet den Stack auf Test-Ports
# (6323/8082) und beweist so „baut + bootet", bevor ein PR auf main darf.
# Der Job-Name IST der Required-Check-Context "boot-test".
#
# Kein Secret nötig: Dummy-Vault (Test-Passwort) + Test-Ports/Pfade.
# Prod (6321/8081) wird nie berührt.
#
# Path-Filter (Issue #303, Option A): Der Job `boot-test` läuft IMMER (damit der
# Required-Check nie als "Expected" hängen bleibt), überspringt aber den teuren
# Deploy/Boot, wenn kein relevanter Pfad (mod/, deploy/, tools/dedicated-server/,
# scripts/, dieses Workflow-File) geändert wurde. Doku-/Metadaten-PRs ziehen den
# Gate damit nicht mehr.
#
# Keine globale `concurrency`-Group mehr (Issue #303): GitHubs Concurrency
# verdrängt wartende Läufe statt sie zu reihen — bei mehreren offenen PRs blieb
# der Required-Check so offen. Aktuell serialisiert der EINE Self-Hosted-Runner
# (planet) die Läufe ohnehin; die Test-Ports (6323/8091/9003) bleiben dadurch
# exklusiv. VOR einem Scale-out auf >=2 Runner (#304) muss die Port-Exklusivität
# neu abgesichert werden (#290, Port-/Container-Namen je Lauf ableiten).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Relevante Pfade (Boot-Test-Gate)
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Relevante Pfade bestimmen
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch erzwingt den Boot-Test immer: das ist der Zweck —
          # einen verhungerten Lauf ohne Leer-Commit nachholen zu können.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Over-inclusive bei jedem Diff-Problem: lieber einmal zu viel laufen
          # als einen relevanten Change fälschlich zu skippen (Gate bliebe
          # sonst fälschlich grün). Doku-PRs landen hier auf relevant=false.
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          if printf '%s\n' "$CHANGED" \
             | grep -Eq '^(mod/|deploy/|tools/dedicated-server/|scripts/|\.github/workflows/boot-test\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  boot-test:
    name: boot-test
    needs: changes
    runs-on: [self-hosted, planet]
    timeout-minutes: 25
    steps:
      - name: Keine relevanten Pfade — Boot-Test übersprungen (Gate bleibt grün)
        if: needs.changes.outputs.relevant != 'true'
        run: echo "Keine boot-test-relevanten Pfade geändert — kein Deploy/Boot nötig."

      - name: Fork-PR erkennen (Gate nur für Repo-eigene PRs)
        id: gate
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork-PR — Boot-Test übersprungen (nur Repo-eigene PRs)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'

      - name: Tooling bereitstellen (ansible + rustup für den Runner-User)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VENV="$HOME/.local/ansible-deploy-check"
          if [ ! -x "$VENV/bin/ansible-playbook" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --disable-pip-version-check \
              "ansible-core==2.19.*" "yamllint==1.35.1"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH gilt erst im NÄCHSTEN Step — hier daher voller Pfad.
          "$HOME/.cargo/bin/cargo" --version

      - name: SSH-Voraussetzung prüfen (runner -> root@planet)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 planet 'id -u' >/dev/null 2>&1; then
            echo "::error::Boot-Test braucht SSH runner@planet -> root@planet (Alias planet). Einrichtung: deploy/README.md, Abschnitt deploy-check (PR-Gate)."
            exit 1
          fi

      - name: Runner-Cleanup (stehengebliebene Test-Container/Netz entfernen)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Infra-Gate: ein zuvor abgebrochener Lauf kann den Test-Container
          # bzw. das Netz stehen lassen. Dann ist Test-Port 9001 belegt und der
          # Deploy scheitert mit "port is already allocated" — das Required-Gate
          # `boot-test` stünde dauerhaft rot, unabhängig vom PR-Diff.
          ssh planet 'docker rm -f riftbreaker-dedicated-test 2>/dev/null || true'
          ssh planet 'docker network rm rb_default 2>/dev/null || true'

      - name: Test-Deploy auf Test-Ports (Dummy-Vault, kein Secret)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          INV="$(mktemp -d)/inventory"
          cp -r deploy/inventory "$INV"
          cat > "$INV/host_vars/planet/vault.yml" <<'EOF'
          ---
          riftbreaker_server_password: boot-test
          vault_solo_basic_auth_hash: ""
          EOF
          ansible-playbook -i "$INV" deploy/test-deploy.yml -e @deploy/test-vars.yml

      - name: Boot verifizieren (Container stabil + UDP-Bind + tournament healthy)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Wine/Xvfb brauchen einen Moment — erst nach 30 s prüfen.
          sleep 30
          STATUS="$(ssh planet 'docker inspect -f "{{.State.Status}}" riftbreaker-dedicated-test')"
          RESTARTING="$(ssh planet 'docker inspect -f "{{.State.Restarting}}" riftbreaker-dedicated-test')"
          echo "Test-Container: status=$STATUS restarting=$RESTARTING"
          [ "$STATUS" = "running" ] || { echo "::error::Test-Container bootet nicht (status=$STATUS)."; exit 1; }
          [ "$RESTARTING" = "false" ] || { echo "::error::Test-Container ist in einer Crash-Loop."; exit 1; }

          # HARTES Bind-Gate (Issue #239): "Container läuft" ist kein Beweis —
          # DedicatedServer.exe kann vor dem bind() hängen/crashen; dann ist der
          # Port stumm, obwohl der Container "Up" ist. Genau so war main grün,
          # während :6321 auf planet keinen Listener hatte. Darum: der Server
          # muss IM Container wirklich einen UDP-Socket auf seinem Game-Port
          # gebunden haben. Der Port wird NICHT geraten, sondern aus dem
          # Docker-Mapping des publizierten Test-Ports gelesen (Rezept mappt
          # 6323/udp -> container 6321/udp). Bis zu 150 s pollen (Welt-Boot
          # unter Wine/llvmpipe).
          CTR=riftbreaker-dedicated-test
          PUB=6323
          # `docker port <ctr>` listet "PRIVAT/PROTO -> HOST" (z. B.
          # "6321/udp -> 0.0.0.0:6323") — der container-interne Port steht
          # LINKS. Also über den publizierten Test-Port die passende Zeile
          # finden und deren linke Portnummer nehmen.
          MAP="$(ssh planet "docker port ${CTR}" 2>/dev/null | grep -E 'udp ->' | grep -E "[:.]${PUB}\$" | head -1 || true)"
          IPORT="${MAP%%/*}"
          if [ -z "$IPORT" ]; then
            echo "::error::Kein UDP-Port-Mapping für ${PUB}/udp am Test-Container (docker port: '${MAP}') — Compose/Rezept prüfen (Issue #239)."
            exit 1
          fi
          HEX="$(printf '%04x' "$IPORT")"
          BOUND=false
          for _ in $(seq 1 30); do
            if ssh planet "docker exec ${CTR} cat /proc/net/udp /proc/net/udp6 2>/dev/null || true" \
                 | awk '{print $2}' | tr '[:upper:]' '[:lower:]' | grep -q ":${HEX}$"; then
              BOUND=true
              break
            fi
            sleep 5
          done
          if [ "$BOUND" != "true" ]; then
            echo "::group::Diagnose — kein UDP-Bind auf ${IPORT} (Issue #239)"
            echo "== docker port =="
            ssh planet "docker port ${CTR}" || true
            echo "== docker top =="
            ssh planet "docker top ${CTR} -eo pid,ppid,stat,time,wchan:24,args" || true
            echo "== docker logs (tail 120) =="
            ssh planet "docker logs --tail 120 ${CTR} 2>&1" || true
            echo "== /proc/net/udp + udp6 =="
            ssh planet "docker exec ${CTR} cat /proc/net/udp /proc/net/udp6 2>/dev/null || true" || true
            echo "::endgroup::"
            echo "::error::${CTR} hat keinen UDP-Socket auf Port ${IPORT} gebunden — DedicatedServer bootet nicht bis zum bind() (Issue #239)."
            exit 1
          fi
          echo "UDP-Bind OK: ${CTR} lauscht auf ${IPORT}/udp (publiziert als 6323/udp)."

          curl --silent --show-error --fail --max-time 10 \
            http://127.0.0.1:8091/health | grep -q '"ok":true'
          echo "Boot-Test OK: Container läuft stabil, UDP ${IPORT}/udp gebunden, tournament-server healthy auf 8091."

      - name: Aufräumen (Test-Container + Unit stoppen)
        if: always() && needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          ssh planet 'docker compose -f /opt/rbbattle-deploy/test/rb/docker-compose.yml down --remove-orphans 2>/dev/null || docker rm -f riftbreaker-dedicated-test 2>/dev/null || true'
          ssh planet 'docker network rm rb_default 2>/dev/null || true'
          ssh planet 'systemctl stop tournament-server-test 2>/dev/null || true'
          ssh planet 'systemctl disable tournament-server-test 2>/dev/null || true'
          ssh planet 'rm -f /etc/systemd/system/tournament-server-test.service 2>/dev/null || true'
          ssh planet 'systemctl daemon-reload 2>/dev/null || true'
