name: Boot-Test

# Pre-Merge-Gate (CI/CD-Plan F1): baut + bootet den Stack und beweist so
# „baut + bootet", bevor ein PR auf main darf. Der Job-Name IST der
# Required-Check-Context "boot-test".
#
# Kein Secret nötig: Dummy-Vault (Test-Passwort) + je Lauf eindeutige
# Namen/Pfade/Ports (Issue #307). Keine festen Host-Ports mehr — der
# Smoke-Test prüft nur Container-Status + tournament-/health. Prod
# (6321/9001/8081) wird nie berührt.
#
# Path-Filter (Issue #303, Option A): Der Job `boot-test` läuft IMMER (damit der
# Required-Check nie als "Expected" hängen bleibt), überspringt aber den teuren
# Deploy/Boot, wenn kein relevanter Pfad (mod/, deploy/, tools/dedicated-server/,
# scripts/, dieses Workflow-File) geändert wurde. Doku-/Metadaten-PRs ziehen den
# Gate damit nicht mehr.
#
# Keine globale `concurrency`-Group mehr (Issue #303): GitHubs Concurrency
# verdrängt wartende Läufe statt sie zu reihen — bei mehreren offenen PRs blieb
# der Required-Check so offen. Issue #307 entkoppelt zusätzlich alle festen
# Ressourcen (Container-/Unit-Namen, Compose-Projekt/-Netz, Named Volumes,
# Host-Pfade, Tournament-Port) je Lauf über `github.run_id`, sodass parallel
# laufende boot-tests nicht kollidieren (Vorbereitung für #304 Scale-out).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Relevante Pfade (Boot-Test-Gate)
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Relevante Pfade bestimmen
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch erzwingt den Boot-Test immer: das ist der Zweck —
          # einen verhungerten Lauf ohne Leer-Commit nachholen zu können.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Over-inclusive bei jedem Diff-Problem: lieber einmal zu viel laufen
          # als einen relevanten Change fälschlich zu skippen (Gate bliebe
          # sonst fälschlich grün). Doku-PRs landen hier auf relevant=false.
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          if printf '%s\n' "$CHANGED" \
             | grep -Eq '^(mod/|deploy/|tools/dedicated-server/|scripts/|\.github/workflows/boot-test\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  boot-test:
    name: boot-test
    needs: changes
    runs-on: [self-hosted, planet]
    timeout-minutes: 25
    steps:
      - name: Keine relevanten Pfade — Boot-Test übersprungen (Gate bleibt grün)
        if: needs.changes.outputs.relevant != 'true'
        run: echo "Keine boot-test-relevanten Pfade geändert — kein Deploy/Boot nötig."

      - name: Fork-PR erkennen (Gate nur für Repo-eigene PRs)
        id: gate
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork-PR — Boot-Test übersprungen (nur Repo-eigene PRs)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'

      - name: Tooling bereitstellen (ansible + rustup für den Runner-User)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VENV="$HOME/.local/ansible-deploy-check"
          if [ ! -x "$VENV/bin/ansible-playbook" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --disable-pip-version-check \
              "ansible-core==2.19.*" "yamllint==1.35.1"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH gilt erst im NÄCHSTEN Step — hier daher voller Pfad.
          "$HOME/.cargo/bin/cargo" --version

      - name: SSH-Voraussetzung prüfen (runner -> root@planet)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 planet 'id -u' >/dev/null 2>&1; then
            echo "::error::Boot-Test braucht SSH runner@planet -> root@planet (Alias planet). Einrichtung: deploy/README.md, Abschnitt deploy-check (PR-Gate)."
            exit 1
          fi

      - name: Run-Kennung + Tournament-Port ableiten (je Lauf eindeutig)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          # Deterministic Port aus run_id (monoton steigend): gleichzeitige Läufe
          # haben benachbarte run_ids -> praktisch immer verschiedene Ports.
          # Bereich 10000–29999: unterhalb der ephemeren Linux-Range (32768+),
          # oberhalb Prod (6321/8081/9001–9003). Muss mit der Formel in
          # deploy/test-vars.yml (tournament_port) übereinstimmen.
          PORT=$(( 10000 + (RUN_ID % 20000) ))
          echo "RBBATTLE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "TOURNAMENT_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Runner-Cleanup (stehengebliebene Test-Ressourcen dieses Laufs entfernen)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Infra-Gate: ein zuvor abgebrochener Lauf desselben run_id kann
          # Container/Netz/Unit stehen lassen. Namen sind je Lauf eindeutig
          # (Issue #307), daher räumt dieser Lauf NUR seine eigenen Reste weg.
          C="riftbreaker-dedicated-test-${RBBATTLE_RUN_ID}"
          P="rb-test-${RBBATTLE_RUN_ID}"
          D="/opt/rbbattle-deploy/test/rb-${RBBATTLE_RUN_ID}"
          U="tournament-server-test-${RBBATTLE_RUN_ID}"
          ssh planet "docker compose -p '${P}' -f '${D}/docker-compose.yml' down --remove-orphans -v 2>/dev/null || true"
          ssh planet "docker rm -f '${C}' 2>/dev/null || true"
          ssh planet "docker network rm '${P}_default' 2>/dev/null || true"
          ssh planet "systemctl stop '${U}' 2>/dev/null || true"
          ssh planet "systemctl disable '${U}' 2>/dev/null || true"
          ssh planet "rm -f '/etc/systemd/system/${U}.service' 2>/dev/null || true"
          ssh planet "systemctl daemon-reload 2>/dev/null || true"

      - name: Test-Deploy (Dummy-Vault, kein Secret; je Lauf eindeutige Ressourcen)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          INV="$(mktemp -d)/inventory"
          cp -r deploy/inventory "$INV"
          cat > "$INV/host_vars/planet/vault.yml" <<'EOF'
          ---
          riftbreaker_server_password: boot-test
          vault_solo_basic_auth_hash: ""
          EOF
          ansible-playbook -i "$INV" deploy/test-deploy.yml \
            -e @deploy/test-vars.yml \
            -e rbbattle_run_suffix="$RBBATTLE_RUN_ID" \
            -e tournament_port="$TOURNAMENT_PORT"

      - name: Boot verifizieren (Container stabil + tournament healthy)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          C="riftbreaker-dedicated-test-${RBBATTLE_RUN_ID}"
          # Wine/Xvfb brauchen einen Moment — erst nach 30 s prüfen.
          sleep 30
          STATUS="$(ssh planet "docker inspect -f '{{.State.Status}}' '${C}'")"
          RESTARTING="$(ssh planet "docker inspect -f '{{.State.Restarting}}' '${C}'")"
          echo "Test-Container: status=$STATUS restarting=$RESTARTING"
          [ "$STATUS" = "running" ] || { echo "::error::Test-Container bootet nicht (status=$STATUS)."; exit 1; }
          [ "$RESTARTING" = "false" ] || { echo "::error::Test-Container ist in einer Crash-Loop."; exit 1; }
          curl --silent --show-error --fail --max-time 10 \
            "http://127.0.0.1:${TOURNAMENT_PORT}/health" | grep -q '"ok":true'
          echo "Boot-Test OK: Container läuft stabil, tournament-server healthy auf ${TOURNAMENT_PORT}."

      - name: Aufräumen (Test-Container + Unit + je Lauf eindeutige Pfade/Volumes)
        if: always() && needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          C="riftbreaker-dedicated-test-${RBBATTLE_RUN_ID}"
          P="rb-test-${RBBATTLE_RUN_ID}"
          D="/opt/rbbattle-deploy/test/rb-${RBBATTLE_RUN_ID}"
          U="tournament-server-test-${RBBATTLE_RUN_ID}"
          # Container + Netz + Named Volumes (down -v); Fallback auf rm -f,
          # falls das Compose-File (z. B. nach frühem Abbruch) nicht existiert.
          ssh planet "docker compose -p '${P}' -f '${D}/docker-compose.yml' down --remove-orphans -v 2>/dev/null || true"
          ssh planet "docker rm -f '${C}' 2>/dev/null || true"
          ssh planet "docker network rm '${P}_default' 2>/dev/null || true"
          # systemd-Unit dieses Laufs entfernen.
          ssh planet "systemctl stop '${U}' 2>/dev/null || true"
          ssh planet "systemctl disable '${U}' 2>/dev/null || true"
          ssh planet "rm -f '/etc/systemd/system/${U}.service' 2>/dev/null || true"
          ssh planet "systemctl daemon-reload 2>/dev/null || true"
          # Je Lauf eindeutige Host-Pfade entfernen (sonst akkumulieren pro Lauf
          # ~664 MB Game-Content + Mods/Deploy-Artefakte).
          ssh planet "rm -rf '${D}' '/srv/rbgame-test-${RBBATTLE_RUN_ID}' '/srv/rbgame-test-${RBBATTLE_RUN_ID}-backups' '/opt/rbbattle-deploy/test/mods-${RBBATTLE_RUN_ID}' '/opt/rbmods/tournament-server-test-${RBBATTLE_RUN_ID}' 2>/dev/null || true"
