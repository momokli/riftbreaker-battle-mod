name: Boot-Test

# Pre-Merge-Gate (CI/CD-Plan F1): baut + bootet den Stack und beweist so
# „baut + bootet", bevor ein PR auf main darf. Der Job-Name IST der
# Required-Check-Context "boot-test".
#
# Kein Secret nötig: Dummy-Vault (Test-Passwort) + je Lauf eindeutige
# Namen/Pfade/Ports (Issue #307). Keine festen Host-Ports mehr — der
# Smoke-Test prüft nur Container-Status + tournament-/health. Prod
# (6321/9001/8081) wird nie berührt.
#
# Seit Issue #289 fährt dieser Job zusätzlich das **Core-IO-Gate** am selben
# gebooteten Stack: C1 (Mod geladen) -> C2 (Ingress-Effekt, Invariante
# `ok:true ⟹ Effekt-Logzeile`) -> C3 (Egress an einen laufenden Consumer) ->
# C4 (serverseitig ausgelöster Wave-Auftrag erreicht den Mod). Damit ist der
# Kern-Kanal automatisiert abgesichert, der in #288 regressiert ist — ohne
# zweiten Boot (ein Workflow, ein Boot). Die Probe lebt in tests/core-io/
# (hermetische Selbsttests in ci.yml `test`).
#
# Path-Filter (Issue #303, Option A): Der Job `boot-test` läuft IMMER (damit der
# Required-Check nie als "Expected" hängen bleibt), überspringt aber den teuren
# Deploy/Boot, wenn kein relevanter Pfad geändert wurde. Relevant (Issue #393):
#   * server/dll/  -> DLL: build + host/boot test
#   * server/pipe-bridge/    -> HTTP-Bridge: build + smoke
#   * deploy/, deploy/dedicated-server/, scripts/, dieses Workflow-File
# Bewusst NICHT relevant: client-mod/ (PLAYERMOD, HUD-only, low risk -> kein Heavy-Test)
# und tournament/web/ (statische WebUI -> kein Boot-Test). Doku-/Metadaten-PRs
# ziehen das Gate damit nicht mehr.
#
# Concurrency (Issue #352): eine Job-Ebene-`concurrency`-Group auf `boot-test`
# serialisiert die planet-Cold-Boots — parallele Boots ueberlasteten planet
# (Bridge 503/Timeout). `cancel-in-progress: false` laesst den laufenden Job zu
# Ende laufen. `queue: max` laesst bis zu 100 wartende Laeufe pending bleiben:
# der GitHub-Default `queue: single` wuerde bei jedem neuen Lauf den aelteren
# pending-Lauf verdrängen/canceln — genau das #303-Symptom eines auf `cancelled`
# blockierten Required-Checks. Re-Run ist erst bei Queue-Ueberlauf (>100
# wartende) noetig. Issue #307 entkoppelt zusätzlich alle festen Ressourcen
# (Container-/Unit-Namen, Compose-Projekt/-Netz, Named Volumes, Host-Pfade,
# Tournament-Port) je Lauf über `github.run_id`.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Relevante Pfade (Boot-Test-Gate)
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Relevante Pfade bestimmen
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch erzwingt den Boot-Test immer: das ist der Zweck —
          # einen verhungerten Lauf ohne Leer-Commit nachholen zu können.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Over-inclusive bei jedem Diff-Problem: lieber einmal zu viel laufen
          # als einen relevanten Change fälschlich zu skippen (Gate bliebe
          # sonst fälschlich grün). Doku-PRs landen hier auf relevant=false.
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          if printf '%s\n' "$CHANGED" \
             | grep -Eq '^(deploy/|server/(dll|pipe-bridge)/|scripts/(build_rbbridge_tools|package|package_mod|mod_version)\.sh|\.github/workflows/boot-test\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  boot-test:
    name: boot-test
    needs: changes
    runs-on: [self-hosted, planet]
    timeout-minutes: 25
    # Serialisiert die teuren planet-Cold-Boots: nur EIN Dedicated-Server
    # gleichzeitig, sonst ueberlastet der parallele Boot die Bridge/Tournament
    # (503/Timeout, Issue #352). cancel-in-progress:false laesst den laufenden
    # Job zu Ende laufen; queue:max haelt bis zu 100 wartende Laeufe pending
    # statt sie zu verdrängen (Default queue:single wuerde pending-Laeufe
    # canceln und den Required-Check auf cancelled blockieren, #303). Re-Run
    # erst bei Queue-Ueberlauf (>100 wartende) noetig.
    concurrency:
      group: boot-test
      cancel-in-progress: false
      queue: max
    steps:
      - name: Keine relevanten Pfade — Boot-Test übersprungen (Gate bleibt grün)
        if: needs.changes.outputs.relevant != 'true'
        run: echo "Keine boot-test-relevanten Pfade geändert — kein Deploy/Boot nötig."

      - name: Fork-PR erkennen (Gate nur für Repo-eigene PRs)
        id: gate
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork-PR — Boot-Test übersprungen (nur Repo-eigene PRs)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'

      - name: Tooling prüfen (Venv + cargo vom Host-Setup, Issue #318)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Kein nicht-atomares Setup mehr im Job (Issue #318): Ansible-Venv und
          # Rust-Toolchain werden einmalig vom Host-Setup provisioniert
          # (.github/runner/setup.sh). Der Job verifiziert nur — so racen
          # parallele Läufe nicht im gemeinsamen $HOME des Runner-Users.
          VENV="$HOME/.local/ansible-deploy-check"
          if [ ! -x "$VENV/bin/ansible-playbook" ]; then
            echo "::error::Ansible-Venv fehlt ($VENV). Einmalig auf dem Runner-Host: bash .github/runner/setup.sh (siehe .github/runner/README.md, docs/ci-parallel-safety.md)."
            exit 1
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            echo "::error::Rust-Toolchain fehlt ($HOME/.cargo/bin/cargo). Einmalig auf dem Runner-Host: bash .github/runner/setup.sh (siehe .github/runner/README.md, docs/ci-parallel-safety.md)."
            exit 1
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH gilt erst im NÄCHSTEN Step — hier daher voller Pfad.
          "$VENV/bin/ansible" --version | head -n 1
          "$HOME/.cargo/bin/cargo" --version

      - name: SSH-Voraussetzung prüfen (runner -> root@planet)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 planet 'id -u' >/dev/null 2>&1; then
            echo "::error::Boot-Test braucht SSH runner@planet -> root@planet (Alias planet). Einrichtung: deploy/README.md, Abschnitt deploy-check (PR-Gate)."
            exit 1
          fi

      - name: Run-Kennung + Tournament-Port ableiten (je Lauf eindeutig)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          # Tournament-Port (10000–29999) und Bridge-Host-Port (30000–49999) je
          # Lauf eindeutig aus run_id (monoton steigend -> benachbarte Läufe
          # haben verschiedene Ports). Muss mit der Formel in test-vars.yml
          # (tournament_port) übereinstimmen. Unter 32768 kollisionsfrei; der
          # Bridge-Bereich oberhalb 32768 liegt in der ephemeren Linux-Range, ist
          # aber deterministisch aus run_id und kurzlebig -> vernachlässigbar.
          T_PORT=$(( 10000 + (RUN_ID % 20000) ))
          B_PORT=$(( 30000 + (RUN_ID % 20000) ))
          echo "RBBATTLE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "TOURNAMENT_PORT=$T_PORT" >> "$GITHUB_ENV"
          echo "BRIDGE_PORT=$B_PORT" >> "$GITHUB_ENV"

      - name: Runner-Cleanup (stehengebliebene Test-Ressourcen dieses Laufs entfernen)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Infra-Gate: ein zuvor abgebrochener Lauf desselben run_id kann
          # Container/Netz/Unit stehen lassen. Namen sind je Lauf eindeutig
          # (Issue #307), daher räumt dieser Lauf NUR seine eigenen Reste weg.
          C="riftbreaker-dedicated-test-${RBBATTLE_RUN_ID}"
          S="riftbreaker-sessions-test-${RBBATTLE_RUN_ID}"
          E="riftbreaker-egress-test-${RBBATTLE_RUN_ID}"
          P="rb-test-${RBBATTLE_RUN_ID}"
          D="/opt/rbbattle-deploy/test/rb-${RBBATTLE_RUN_ID}"
          U="tournament-server-test-${RBBATTLE_RUN_ID}"
          ssh planet "docker compose -p '${P}' -f '${D}/docker-compose.yml' down --remove-orphans -v 2>/dev/null || true"
          ssh planet "docker rm -f '${C}' 2>/dev/null || true"
          # Sidecars haben einen globalen container_name -> explizit (Issue #318, #358).
          ssh planet "docker rm -f '${S}' 2>/dev/null || true"
          ssh planet "docker rm -f '${E}' 2>/dev/null || true"
          ssh planet "docker network rm '${P}_default' 2>/dev/null || true"
          # Named Volumes zusaetzlich explizit (Fallback, falls `compose down -v`
          # nicht greift — Compose-File nach fruehem Abbruch fehlt, Review-F3).
          ssh planet "docker volume rm 'rb-test-wine-${RBBATTLE_RUN_ID}' 'rb-test-saves-${RBBATTLE_RUN_ID}' 2>/dev/null || true"
          # Run-spezifischer Build-Kontext (Review-F2).
          ssh planet "rm -rf '/opt/rbbattle-deploy/test/dedicated-server-${RBBATTLE_RUN_ID}' 2>/dev/null || true"
          ssh planet "systemctl stop '${U}' 2>/dev/null || true"
          ssh planet "systemctl disable '${U}' 2>/dev/null || true"
          ssh planet "rm -f '/etc/systemd/system/${U}.service' 2>/dev/null || true"
          ssh planet "systemctl daemon-reload 2>/dev/null || true"

      - name: Test-Deploy (Dummy-Vault, kein Secret; je Lauf eindeutige Ressourcen)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          INV="$(mktemp -d)/inventory"
          cp -r deploy/inventory "$INV"
          cat > "$INV/host_vars/planet/vault.yml" <<'EOF'
          ---
          riftbreaker_server_password: boot-test
          vault_solo_basic_auth_hash: ""
          # Server-Control (Issue #424): Bearer-Token PFLICHT. Dummy-Wert fuer
          # den Boot-Test — kein Secret. Prod: echtes Vault-Secret setzen.
          vault_server_control_token: boot-test-token
          EOF
          ansible-playbook -i "$INV" deploy/test-deploy.yml \
            -e @deploy/test-vars.yml \
            -e rbbattle_run_suffix="$RBBATTLE_RUN_ID" \
            -e tournament_port="$TOURNAMENT_PORT" \
            -e riftbreaker_bridge_port="$BRIDGE_PORT" \
            -e tournament_bridge_a_url="http://127.0.0.1:${BRIDGE_PORT}/exec"

      - name: Boot verifizieren (Container stabil + tournament healthy)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          C="riftbreaker-dedicated-test-${RBBATTLE_RUN_ID}"
          # Wine/Xvfb brauchen einen Moment — erst nach 30 s prüfen.
          sleep 30
          STATUS="$(ssh planet "docker inspect -f '{{.State.Status}}' '${C}'")"
          RESTARTING="$(ssh planet "docker inspect -f '{{.State.Restarting}}' '${C}'")"
          echo "Test-Container: status=$STATUS restarting=$RESTARTING"
          [ "$STATUS" = "running" ] || { echo "::error::Test-Container bootet nicht (status=$STATUS)."; exit 1; }
          [ "$RESTARTING" = "false" ] || { echo "::error::Test-Container ist in einer Crash-Loop."; exit 1; }
          curl --silent --show-error --fail --max-time 10 \
            "http://127.0.0.1:${TOURNAMENT_PORT}/health" | grep -q '"ok":true'
          echo "Boot-Test OK: Container läuft stabil, tournament-server healthy auf ${TOURNAMENT_PORT}."

      - name: Core-IO-Gate (C1 Boot — Issue #289)
        if: needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Nach der Green-Field-Refaktorierung prüft das Gate nur noch C1:
          # Container stabil + Mod geladen + Bridge /health ok. C2–C4 (Ingress-
          # Effekt, Egress, Server-Wave) testeten die alte Lua-Architektur und
          # werden gegen die C++-Backend-Pfade (get_state/add_resource) neu
          # aufgebaut (Folge-Issue).
          python3 tests/core-io/core_io_probe.py \
            --remote "ssh planet" \
            --container "riftbreaker-dedicated-test-${RBBATTLE_RUN_ID}" \
            --bridge-url "http://127.0.0.1:${BRIDGE_PORT}/exec" \
            --boot-timeout 240

      - name: Aufräumen (Test-Container + Unit + je Lauf eindeutige Pfade/Volumes)
        if: always() && needs.changes.outputs.relevant == 'true' && steps.gate.outputs.skip != 'true'
        run: |
          C="riftbreaker-dedicated-test-${RBBATTLE_RUN_ID}"
          S="riftbreaker-sessions-test-${RBBATTLE_RUN_ID}"
          E="riftbreaker-egress-test-${RBBATTLE_RUN_ID}"
          P="rb-test-${RBBATTLE_RUN_ID}"
          D="/opt/rbbattle-deploy/test/rb-${RBBATTLE_RUN_ID}"
          U="tournament-server-test-${RBBATTLE_RUN_ID}"
          # Container + Netz + Named Volumes (down -v); Fallback auf rm -f,
          # falls das Compose-File (z. B. nach frühem Abbruch) nicht existiert.
          ssh planet "docker compose -p '${P}' -f '${D}/docker-compose.yml' down --remove-orphans -v 2>/dev/null || true"
          ssh planet "docker rm -f '${C}' 2>/dev/null || true"
          # Sidecars haben einen globalen container_name -> explizit (Issue #318, #358).
          ssh planet "docker rm -f '${S}' 2>/dev/null || true"
          ssh planet "docker rm -f '${E}' 2>/dev/null || true"
          ssh planet "docker network rm '${P}_default' 2>/dev/null || true"
          # `down -v` raeumt die Named Volumes nur, wenn das Compose-File noch
          # existiert. Im Fallback-Zweig (File fehlt nach fruehem Abbruch) blieben
          # `rb-test-wine-/rb-test-saves-<run_id>` als Leck zurueck (Review-F3) —
          # daher hier explizit.
          ssh planet "docker volume rm 'rb-test-wine-${RBBATTLE_RUN_ID}' 'rb-test-saves-${RBBATTLE_RUN_ID}' 2>/dev/null || true"
          # systemd-Unit dieses Laufs entfernen.
          ssh planet "systemctl stop '${U}' 2>/dev/null || true"
          ssh planet "systemctl disable '${U}' 2>/dev/null || true"
          ssh planet "rm -f '/etc/systemd/system/${U}.service' 2>/dev/null || true"
          ssh planet "systemctl daemon-reload 2>/dev/null || true"
          # Je Lauf eindeutige Host-Pfade entfernen (sonst akkumulieren pro Lauf
          # ~664 MB Game-Content + Mods/Deploy-Artefakte + Build-Kontext F2).
          ssh planet "rm -rf '${D}' '/srv/rbgame-test-${RBBATTLE_RUN_ID}' '/srv/rbgame-test-${RBBATTLE_RUN_ID}-backups' '/opt/rbbattle-deploy/test/mods-${RBBATTLE_RUN_ID}' '/opt/rbbattle-deploy/test/dedicated-server-${RBBATTLE_RUN_ID}' '/opt/rbmods/tournament-server-test-${RBBATTLE_RUN_ID}' '/srv/rbmods-sessions-test-${RBBATTLE_RUN_ID}' 2>/dev/null || true"
          # Altlasten des ALTEN, festen Test-Schemas (vor #307): dessen Cleanup
          # zielte auf feste Namen, die diese run-scoped Logik nie mehr anfasst.
          # Idempotent + gefahrlos (reine Test-Pfade, kein Prod-Overlap), daher
          # einmalig hier mit abgeraeumt (Review-F4). Der Session-Sidecar war bis
          # #318 auch fest benannt (riftbreaker-sessions-test) — mit entfernen.
          ssh planet "docker rm -f 'riftbreaker-sessions-test' 2>/dev/null || true"
          ssh planet "rm -rf '/srv/rbgame-test' '/srv/rbgame-test-backups' '/opt/rbmods/tournament-server-test' '/srv/rbmods-sessions-test' 2>/dev/null || true"
