name: Pages

# GitHub-Pages-Deploy aus site/.
#
# site/ ist rein statisch (Landing v2 + solo.html + connectivity.html +
# live-status.js) — es gibt KEINEN Build-Schritt. Downloads bleiben
# GitHub-Releases (dist-Zips); docs/ bleibt Doku im Repo und ist NICHT mehr
# Pages-Quelle (Pages-Source wird per Repo-Setting auf "GitHub Actions" gestellt).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
