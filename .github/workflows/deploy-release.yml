name: Deploy Release (Tag)

# Release-Deploy (Issue #290): deployt die **release-Instanz** (planet, Port
# 6321) aus einem Git-TAG (vX.Y.Z). Damit ist der Live-/Spieler-Stand an einen
# Tag gebunden, während die DEV-Instanz (Port 6322) rolling `main` folgt
# (deploy.yml).
#
# Manuell/explizit (workflow_dispatch) — KEIN Auto-Trigger. Der Kanal ist die
# bewusste Wiedereinführung des in Issue #209 gestrichenen Tag→prod-Pfads; ein
# Release soll ein bewusster Akt sein. Die Umgebung `prod` kann mit Required
# Reviewers als Freigabe-Gate belegt werden.
#
# Deploy-Mechanik = wie deploy.yml: SSH als deploy-User, forced command
# deploy/deploy-ssh.sh mit dem Instanz-Token `release`. Checkout = die SHA des
# Tags (nicht main), damit Mod-Stand UND Image-Tag dem Tag entsprechen.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git-Tag (vX.Y.Z), der auf die release-Instanz deployt wird"
        required: true
        type: string

permissions:
  contents: read

# Gemeinsame Concurrency-Gruppe mit deploy.yml (Issue #290): beide Workflows
# nutzen denselben Host-Checkout (/opt/rbbattle-deploy/repo) UND dieselbe
# Instanz-Datei (/opt/rbbattle-deploy/instance). Getrennte Gruppen (cd-release
# vs. cd-dev) könnten bei mehr als einem Runner / Queue-Peeling parallel laufen
# und Checkout bzw. Instanz-Datei racen -> es würde die falsche Instanz
# deployt. EINE Gruppe serialisiert beide Workflows.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy-release:
    name: Deploy Release (planet :6321, Tag)
    runs-on: [self-hosted, planet]
    timeout-minutes: 30
    environment:
      name: prod
      url: https://rift.projectmellon.de/
    steps:
      - name: Tag auflösen (Tag → SHA)
        id: tag
        env:
          # Input NUR über env (NIE `${{ inputs.tag }}` direkt in `run:`) —
          # verhindert Command-Injection auf dem self-hosted Prod-Runner.
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Echter Muster-Check (kein Shell-Glob): genau v<ziffern>.<ziffern>.<ziffern>.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Erwartet einen Tag der Form vX.Y.Z, bekam: $TAG"
            exit 1
          fi
          sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
                  "refs/tags/${TAG}^{}" | awk '{print $1}')"
          if [ -z "$sha" ]; then
            sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
                    "refs/tags/${TAG}" | awk '{print $1}')"
          fi
          if [ -z "$sha" ]; then
            echo "::error::Tag ${TAG} existiert nicht (oder ist kein Tag-Objekt)."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG} -> ${sha}"

      - name: Deploy per SSH (deploy-User, forced command, Instanz release)
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes rbd "$SHA refs/tags/$TAG release"
