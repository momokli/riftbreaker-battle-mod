name: Deploy Check (planet)

# Echter Host-Check (Issue #209): `ansible-playbook --check --diff` gegen
# planet, read-only, Vault wird NIE entschlüsselt. Läuft auf dem self-hosted
# planet-Runner.
#
# Seit Issue #349 ist dieser Check NON-BLOCKING: der lokale Required-Check ist
# in einen eigenen Workflow (deploy-check-local.yml, ubuntu-latest) ausgelagert,
# damit ein transienter `startup_failure` des planet-Runners nicht mehr den
# Required-Context blockiert. Dieser Lauf bleibt als informationale Rückmeldung
# („Image fehlt / Container-Name belegt / Pfad falsch") bestehen.
#
# Nur für PRs aus DIESEM Repo (keine Forks): der Lauf führt PR-Code auf planet
# aus. Fork-PRs überspringen die Schritte (der Job bleibt grün).
#
# Voraussetzung (host-seitig, einmalig; siehe deploy/README.md):
#   * Runner-User `runner` hat SSH-Zugriff als root auf planet (Alias `planet`).
# Das Vault bleibt root-only und wird hier nicht gelesen — für den Check wird
# ein Dummy-Vault in ein temporäres Inventar kopiert.

# Kein paths-Filter auf PR (Check läuft auf allen PRs); nur push ist
# pfad-gefiltert — deckungsgleich mit deploy-check-local.yml.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - deploy/**
      - tools/deploy-gate/**
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-check.yml
      - .github/workflows/deploy-check-local.yml
  workflow_dispatch:

# Least privilege: nur lesen.
permissions:
  contents: read

jobs:
  deploy-check:
    name: deploy-check
    runs-on: [self-hosted, planet]
    timeout-minutes: 15
    steps:
      - name: Fork-PR erkennen (Gate nur für Repo-eigene PRs)
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork-PR — deploy-check wird übersprungen (nur Repo-eigene PRs)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Tooling prüfen (Venv vom Host-Setup, Issue #318)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Kein nicht-atomares Setup mehr im Job (Issue #318): das Ansible-Venv
          # wird einmalig vom Host-Setup provisioniert (.github/runner/setup.sh)
          # und hier nur verifiziert. Zwei gleichzeitige planet-Jobs würden sonst
          # im gemeinsamen $HOME des Runner-Users um dasselbe Venv racen.
          VENV="$HOME/.local/ansible-deploy-check"
          if [ ! -x "$VENV/bin/ansible-playbook" ]; then
            echo "::error::Ansible-Venv fehlt ($VENV). Einmalig auf dem Runner-Host: bash .github/runner/setup.sh (siehe .github/runner/README.md, docs/ci-parallel-safety.md)."
            exit 1
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/ansible" --version

      - name: SSH-Voraussetzung prüfen (runner -> root@planet)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 planet 'id -u' >/dev/null 2>&1; then
            echo "::error::deploy-check braucht SSH-Zugriff runner@planet -> root@planet (Alias planet). Einrichtung: deploy/README.md, Abschnitt deploy-check (PR-Gate)."
            exit 1
          fi

      - name: Ansible --check --diff gegen planet (read-only, kein Vault)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Vault wird NIE entschlüsselt: ein Dummy-Vault in ein temporäres
          # Inventar kopieren (kein Secret; das echte vault.yml wird nicht
          # gelesen). Der Lauf ist --check (Host wird nie verändert).
          INV="$(mktemp -d)/inventory"
          cp -r deploy/inventory "$INV"
          cat > "$INV/host_vars/planet/vault.yml" <<'EOF'
          ---
          riftbreaker_server_password: check-dummy
          vault_solo_basic_auth_hash: ""
          EOF
          # --tags server,website: der Container-Stack + Website. Content-/
          # Tournament-Rollen brauchen Build-Artefakte (dist/, Rust-Binary) und
          # sind hier bewusst ausgenommen.
          ansible-playbook -i "$INV" deploy/site.yml \
            --check --diff --tags server,website
