name: Deploy Check

# Merge-Gate, das den Deploy wirklich vorhersagt (Issue #209).
#
# Aufteilung (Issue #306): rein lokale Checks (yamllint über deploy/,
# Compose-Templates rendern + `docker compose config`) laufen auf einem
# GitHub-Hosted-Runner (ubuntu-latest) im Job `deploy-check-local` und
# entlasten damit den planet-Runner. Nur der echte Host-Check
# (`ansible-playbook --check --diff` gegen planet, read-only, Vault wird NIE
# entschlüsselt) bleibt im Job `deploy-check` auf dem self-hosted Runner.
#
#   deploy-check-local (GH):  yamllint über deploy/, Compose-Templates rendern,
#                             jedes gerenderte Compose-File durch
#                             `docker compose config`.
#   deploy-check (planet):    ansible --check --diff gegen planet für den
#                             Container-Stack (dedicated-server-image +
#                             riftbreaker-server) und die Website-Rolle.
#
# Ziel: die Fehlerklasse „Image fehlt / Container-Name belegt / Pfad falsch"
# wird im PR sichtbar, nicht erst nach dem Merge.
#
# Nur für PRs aus DIESEM Repo (keine Forks): der `deploy-check`-Lauf führt
# PR-Code auf planet aus. Fork-PRs überspringen die Schritte (die Jobs bleiben
# grün, damit der Required-Check „deploy-check" nicht als pending hängt).
#
# Voraussetzung (host-seitig, einmalig; siehe deploy/README.md):
#   * Runner-User `runner` hat SSH-Zugriff als root auf planet (Alias `planet`).
# Das Vault bleibt root-only und wird hier nicht gelesen — für den Check wird
# ein Dummy-Vault in ein temporäres Inventar kopiert.

# WICHTIG: Der PR-Trigger hat bewusst KEINEN paths-Filter — `deploy-check` ist
# ein Required Status Check auf main; ein pfad-gefilterter Workflow, der auf
# einem PR gar nicht startet, hinterlässt den Check dauerhaft als „Expected".
# Der Job läuft daher auf allen PRs (bei PRs ohne deploy/-Bezug trivial grün).
# Nur der push-Trigger bleibt pfad-gefiltert.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-check.yml'
  workflow_dispatch:

# Least privilege: nur lesen.
permissions:
  contents: read

jobs:
  deploy-check-local:
    # Rein lokale Checks (yamllint + Compose-Render + `docker compose config`)
    # auf einem GitHub-Hosted-Runner — entlastet den planet-Runner (Issue #306).
    name: deploy-check-local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fork-PR erkennen (Gate nur für Repo-eigene PRs)
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork-PR — deploy-check-local wird übersprungen (nur Repo-eigene PRs)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Tooling bereitstellen (ansible-core + yamllint)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VENV="$HOME/.local/ansible-deploy-check"
          if [ ! -x "$VENV/bin/ansible-playbook" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --disable-pip-version-check \
              "ansible-core==2.19.*" "yamllint==1.35.1"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/ansible" --version
          "$VENV/bin/yamllint" --version

      - name: YAML-Lint (deploy/)
        if: steps.gate.outputs.skip != 'true'
        run: yamllint -c .yamllint deploy/

      - name: Compose-Templates rendern + `docker compose config`
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          RENDER_DIR="$(mktemp -d)"
          RBBATTLE_RENDER_DIR="$RENDER_DIR" ansible-playbook deploy/check-render.yml
          shopt -s nullglob
          files=("$RENDER_DIR"/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Keine gerenderten Compose-Dateien gefunden."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "== docker compose config $(basename "$f") =="
            docker compose -f "$f" config >/dev/null
          done

  deploy-check:
    # Dieser Job-Name IST der Required-Check-Context in der Branch Protection.
    name: deploy-check
    runs-on: [self-hosted, planet]
    timeout-minutes: 15
    steps:
      - name: Fork-PR erkennen (Gate nur für Repo-eigene PRs)
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork-PR — deploy-check wird übersprungen (nur Repo-eigene PRs)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Tooling bereitstellen (ansible-core)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VENV="$HOME/.local/ansible-deploy-check"
          if [ ! -x "$VENV/bin/ansible-playbook" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --disable-pip-version-check \
              "ansible-core==2.19.*"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/ansible" --version

      - name: SSH-Voraussetzung prüfen (runner -> root@planet)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 planet 'id -u' >/dev/null 2>&1; then
            echo "::error::deploy-check braucht SSH-Zugriff runner@planet -> root@planet (Alias planet). Einrichtung: deploy/README.md, Abschnitt deploy-check (PR-Gate)."
            exit 1
          fi

      - name: Ansible --check --diff gegen planet (read-only, kein Vault)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Vault wird NIE entschlüsselt: ein Dummy-Vault in ein temporäres
          # Inventar kopieren (kein Secret; das echte vault.yml wird nicht
          # gelesen). Der Lauf ist --check (Host wird nie verändert).
          INV="$(mktemp -d)/inventory"
          cp -r deploy/inventory "$INV"
          cat > "$INV/host_vars/planet/vault.yml" <<'EOF'
          ---
          riftbreaker_server_password: check-dummy
          vault_solo_basic_auth_hash: ""
          EOF
          # --tags server,website: der Container-Stack + Website. Content-/
          # Tournament-Rollen brauchen Build-Artefakte (dist/, Rust-Binary) und
          # sind hier bewusst ausgenommen.
          ansible-playbook -i "$INV" deploy/site.yml \
            --check --diff --tags server,website
