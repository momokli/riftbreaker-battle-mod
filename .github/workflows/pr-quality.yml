name: PR Quality

# Qualitaets-Gates fuer Pull Requests:
#  - semantic-title:  PR-Titel muss Conventional Commits folgen (HARD FAIL).
#  - issue-reference: PR-Titel/-Body MUSS ein Issue referenzieren (z. B. "#123");
#                     fehlt die Referenz: Kommentar am PR + HARD FAIL.
# Least privilege: contents:read (Titel/Body lesen) + pull-requests:write (Kommentar).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  semantic-title:
    name: Conventional-Commit-Titel
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Erlaubte Typen (Conventional Commits).
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
            build
            perf
            style
            revert

  issue-reference:
    name: Issue-Referenz im PR
    runs-on: ubuntu-latest
    steps:
      - name: PR-Titel/-Body auf Issue-Referenz pruefen (Hard-Fail)
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.pull_request.title || '');
            const body = (context.payload.pull_request.body || '');

            // Matcht "#123" ebenso wie "owner/repo#123"; Titel ODER Body genuegt.
            const hasRef = /#\d+/.test(title) || /#\d+/.test(body);

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            if (hasRef) {
              core.info('Issue-Referenz gefunden (Titel/Body) — kein Kommentar noetig.');
              return;
            }

            const marker = '<!-- pr-quality: issue-reference -->';
            const text = [
              marker,
              '❌ **Issue-Referenz fehlt**',
              '',
              'Dieser Pull Request referenziert in Titel und Beschreibung kein Issue.',
              'Das ist eine Pflicht: Bitte `Closes #123` (schliesst das Issue beim',
              'Merge automatisch) oder `Refs #123` ergaenzen — die Pruefung laeuft',
              'bei jeder Titel-/Body-Aenderung erneut und wird dann gruen.',
              '',
              'Details: [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).',
            ].join('\n');

            try {
              // Idempotenz: den Hinweis nur einmal setzen.
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number, per_page: 100,
              });
              if (comments.some((c) => c.body && c.body.includes(marker))) {
                core.info('Hinweiskommentar existiert bereits — uebersprungen.');
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body: text,
                });
                core.info('Hinweiskommentar zur fehlenden Issue-Referenz gesetzt.');
              }
            } catch (err) {
              // Fork-PRs haben ggf. nur Lesezugriff — der Kommentar ist Bonus,
              // der Fail unten kommt trotzdem.
              core.warning(
                'Hinweiskommentar konnte nicht gesetzt werden ' +
                '(z. B. Fork-PR ohne Schreibrechte): ' + err.message
              );
            }

            core.setFailed(
              'PR referenziert kein Issue — siehe CONTRIBUTING.md ' +
              '(Pflicht: Referenziert Issue: #N im Body/Titel).'
            );
