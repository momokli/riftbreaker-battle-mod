name: Lint

# Statische Checks (shellcheck, ruff, actionlint) als EIN Required-Check (#393).
# Konsolidiert aus drei Jobs in einen (shellcheck + python-lint + actionlint),
# damit die Branch-Protection statt drei Einzel-Checks nur noch "Lint" verlangt.
# Least privilege: nur contents:read.
#
# Lua-Lint (luacheck) ist bewusst NICHT eingebaut: die Riftbreaker-Mod-API-Globals
# (z. B. Game, EntityService, ...) sind offline nicht aufloesbar, luacheck meldet
# daher zwangslaeufig False Positives. Der Player-Mod ist bewusst green-field
# (nur HUD/Display); die Business-Logik liegt im Backend (rbbridge.dll + Rust).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Per-Ref-Concurrency (Issue #751): cancelt den ueberholten Lauf desselben PRs
# (Push-Kaskade), ohne wartende Laeufe anderer PRs zu verdraengen (#303-Starving
# tritt nicht wieder auf).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- shellcheck ---
      - name: shellcheck installieren
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          shellcheck \
            scripts/*.sh \
            tests/shell/*.sh \
            tools/headless-client/*.sh \
            tools/session-replay/*.sh
      # Dedicated-Server-Image-Scripts (Issue #241). Eigener Schritt statt
      # Einreihen in die Liste oben, um den Hunk von #254 (tests/shell) nicht
      # zu ueberlappen (parallele PRs, ein Datei-Block).
      - name: shellcheck (dedicated-server)
        run: shellcheck deploy/dedicated-server/scripts/*.sh
      # Red/Green-Beweis der Image-Tag-Retention (Issue #309): laufendes Image
      # + N Rollback-Tags bleiben, nur aeltere Tags gehen. Braucht kein Docker
      # (Fake-docker + Szenario-Dateien).
      - name: Image-Tag-Retention (Fake-Docker, planetfrei)
        run: tests/shell/image-retention.test.sh
      # Red/Green-Beweis der Host-Hygiene-Invarianten (Issue #308): prune IMMER
      # ohne -a, DRY-RUN loescht nichts, geaenderte getaggte Menge => Exit 1.
      - name: Host-Hygiene-Invarianten (Fake-Docker, planetfrei)
        run: tests/shell/host-hygiene.test.sh
      # Red/Green-Beweis der Crash-Collector-Logik (Issue #462): Marker-Erkennung
      # (CRASH:/page fault), Bundle <ts>-<uuid> + context.log/meta.json,
      # Retention + Idempotenz, graceful non-crash. Fake-Docker, planetfrei.
      - name: Crash-Collector-Logik (Fake-Docker, planetfrei)
        run: tests/shell/crash-collector.test.sh
      # Red/Green-Beweis der collector-seitigen Symbolik (Issue #480): synthetischer
      # Minidump (Streams 3/4/5/6) + Fake-llvm-symbolizer im PATH — RVA-Mathe,
      # Aufruf-Vertrag (--obj/--relative-address), Skip-/Fehlerpfade, Idempotenz
      # und Collector-Kopplung. Braucht KEIN echtes llvm-18 und keine PDB.
      - name: Crash-Symbolizer (Fake-llvm-symbolizer, planetfrei)
        run: tests/shell/crash-symbolize.test.sh
      # Red/Green-Beweis des stdlib-Minidump-Parsers (Issue #481): synthetische
      # MDMP-Fixtures (gueltig/truncated/falsche Magic/fehlender Stream/
      # Adresse ausserhalb) -> JSON-Felder exception_code/address/module/base/
      # fault_rva/thread/stack_rvas + _ok-false-Vertrag. Kein Docker, kein Netz.
      - name: Minidump-Parser-Unit (stdlib, planetfrei)
        run: tests/shell/minidump_meta.test.sh
      # Red/Green-Beweis der Mod-Versions-Identitaet (Issue #494): keine
      # hartcodierte Version im Mod, Platzhalter wird in Lua UND Manifest gebacken.
      # Planetfrei (Fake-Ref), kein Docker/Netz/Vault.
      - name: Mod-Versions-Identitaet (Fake-Ref, planetfrei)
        run: tests/shell/mod-version.test.sh
      # Red/Green-Beweis des Session-Replay-Skripts (Issue #784): Level-
      # Reihenfolge/-Range, Level-9-teilt-sich-mit-Level-8 (#658), Validierung
      # ungueltiger Optionen, fail-closed ohne COCKPIT_URL/COCKPIT_PASS, und der
      # echte HTTP-Pfad (Basic-Auth, Ziel-URL, Logic-Pfade je Level) gegen einen
      # Fake-curl im PATH. Kein Netz, kein echtes Cockpit.
      - name: Session-Replay-Skript (Fake-curl, planetfrei)
        run: tests/shell/replay-waves.test.sh

      # --- python ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Issue #746: pip-Cache fuer ruff (das Wheel ist damit je Lauf bereits
          # warm, kein Re-Download). cache-dependency-path zeigt auf dieses
          # Workflow-File selbst, damit ein Bump der gepinnten ruff-Version den
          # Cache automatisch invalidiert.
          cache: pip
          cache-dependency-path: .github/workflows/lint.yml
      # Syntax-Fallback zuerst: faengt Parse-Fehler auch dann, wenn die
      # ruff-Installation scheitert — der Schritt faellt so nie still durch.
      - name: Python-Syntax (compileall)
        run: python3 -m compileall -q scripts server tournament tools
      - name: ruff installieren (gepinnt)
        run: python3 -m pip install --disable-pip-version-check "ruff==0.6.9"
      # Kein --exit-zero: ruff verletzt den Job bei Findings (E/F, siehe ruff.toml).
      - name: ruff check
        run: ruff check .

      # --- actionlint ---
      - name: actionlint installieren (gepinnt)
        run: |
          curl -sSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      # -shellcheck= schaltet die eingebettete Shellcheck-Integration ab, damit
      # die unveraenderte ci.yml nicht durch Shell-Lints der run-Bloecke rot wird.
      - name: actionlint
        run: actionlint -shellcheck= .github/workflows/*.yml
