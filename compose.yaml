# Riftbreaker battle stack — self-contained lokal (Issue #1093).
#
#   cp .env.example .env      # einmalig anpassen
#   deploy/compose/up.sh      # = docker compose up --build -d (setzt RBB_REF/RBB_HOST_ROOT)
#
# Bringt den kompletten lokalen Stack hoch: Game-Content, config.cfg, rbtools +
# gns_probe, Mod-Rollout, Dedicated Server, Sidecars, Entry-Proxy/Lobby, Caddy,
# Observer/Control, den VS-Pfad (Queue + Provisioner) und den Hygiene-Timer
# (hygiene + ofelia, #1103).
#
# PFAD-MODELL (Issue #1112): geteilte Dirs liegen als Bind-Mounts unter EINEM
# Host-Root ${RBB_HOST_ROOT} (Default /srv/rbbattle) — damit der Provisioner
# (erzeugt Sibling-Container via `docker run`, Host-daemon loest `-v` gegen den
# Host auf) DIESELBEN Host-Pfade sieht wie der Stack. Nur Wine-/Saves-Volumes
# sind Named Volumes (pro Instanz).
name: rbbattle

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${RBB_LOG_MAX_SIZE:-10m}"
    max-file: "${RBB_LOG_MAX_FILE:-3}"

x-rbb-ref: &rbb-ref "${RBB_REF:-dev}"

services:
  # === Init: Game-Content + private PDB per HTTP (idempotent, #566/#1095) ======
  content-init:
    build:
      context: ./deploy/compose/init
    image: rbb-init:${RBB_REF:-dev}
    command: ["/usr/local/bin/content-init.sh"]
    restart: "no"
    environment:
      RBB_CONTENT_BASE: "${RBB_CONTENT_BASE}"
      RBB_CONTENT_FORCE: "${RBB_CONTENT_FORCE:-false}"
    volumes:
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/game:/game
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/downloads:/downloads
    logging: *default-logging

  # === Init: config.cfg rendern (vorher Jinja-Template der Rolle) =============
  config-init:
    build:
      context: ./deploy/compose/init
    image: rbb-init:${RBB_REF:-dev}
    command: ["/usr/local/bin/config-init.sh"]
    restart: "no"
    depends_on:
      content-init:
        condition: service_completed_successfully
    environment:
      RBB_SERVER_NAME: "${RBB_SERVER_NAME:-RBBattle}"
      RBB_SERVER_PASSWORD: "${RBB_SERVER_PASSWORD:?set in .env — cp .env.example .env}"
      RBB_SERVER_RCON_PASSWORD: "${RBB_SERVER_RCON_PASSWORD:-}"
      RBB_SERVER_MAX_PLAYERS: "${RBB_SERVER_MAX_PLAYERS:-4}"
      RBB_SERVER_BROADCAST_ENABLED: "${RBB_SERVER_BROADCAST_ENABLED:-1}"
      RBB_SERVER_PAUSE_GAME_WHEN_EMPTY: "${RBB_SERVER_PAUSE_GAME_WHEN_EMPTY:-0}"
      RBB_SERVER_CAMPAIGN: "${RBB_SERVER_CAMPAIGN:-mp_survival/mp_survival}"
      RBB_SERVER_MISSION: "${RBB_SERVER_MISSION:-survival/jungle}"
      RBB_SERVER_DIFFICULTY: "${RBB_SERVER_DIFFICULTY:-coop_normal}"
    volumes:
      - ./deploy/compose/config/config.cfg.template:/templates/config.cfg.template:ro
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/config:/config
    logging: *default-logging

  # === Init: rbtools + gns_probe bauen (aktueller Checkout) ===================
  rbtools-build:
    build:
      context: ./deploy/compose/rbtools-build
    image: rbb-rbtools-build:${RBB_REF:-dev}
    restart: "no"
    environment:
      RBB_SRC: /src
      RBB_OUT: /out
    volumes:
      - ./:/src:ro
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/rbtools:/out/rbtools
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/gns:/out/gns
    logging: *default-logging

  # === Init: Battle-Mod bauen + ausrollen (Marker/Backup/#212-Guard) =========
  mod-build:
    build:
      context: ./deploy/compose/mod-build
    image: rbb-mod-build:${RBB_REF:-dev}
    restart: "no"
    depends_on:
      content-init:
        condition: service_completed_successfully
    environment:
      RBB_REF: *rbb-ref
      RBB_GAME_DIR: /game
      RBB_BACKUP_DIR: /backups
    volumes:
      - ./:/src:ro
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/game:/game
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/backups:/backups
    logging: *default-logging

  # === Dedicated Server (RBB_MODE=solo: genau einer) ==========================
  dedicated:
    build:
      context: ./deploy/dedicated-server
    image: rb-dedicated:${RBB_REF:-dev}
    container_name: rbb-dedicated
    restart: unless-stopped
    init: true
    stdin_open: true
    depends_on:
      content-init:
        condition: service_completed_successfully
      config-init:
        condition: service_completed_successfully
      rbtools-build:
        condition: service_completed_successfully
      mod-build:
        condition: service_completed_successfully
    logging: *default-logging
    labels:
      RBB_REF: *rbb-ref
    environment:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      RBB_REF: *rbb-ref
      # Sync-Primitive AUS (Rig-Rezept): sonst Crash im Boost-Thread vor bind().
      WINEESYNC: "0"
      WINEFSYNC: "0"
      RBB_BRIDGE_BIND: "0.0.0.0"
      RBB_BRIDGE_PORT: "9001"
    ports:
      # Game: der Proxy dialt 127.0.0.1:<RBB_SERVER_PORT>. Container bindet 6321.
      - "127.0.0.1:${RBB_SERVER_PORT:-6322}:6321/udp"
      - "127.0.0.1:${RBB_SERVER_PORT:-6322}:6321/tcp"
      # Bridge (HTTP 9001 -> Named Pipe).
      - "127.0.0.1:${RBB_BRIDGE_PORT:-9001}:9001"
    volumes:
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/game:/opt/riftbreaker
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/config:/data/config
      - rb-wine:/data/.wine
      - rb-saves:/data/saves
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/rbtools:/opt/rbtools:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f DedicatedServer.exe >/dev/null && curl -fsS --max-time 4 http://127.0.0.1:9001/health >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 5

  # === Sidecars (python:3.12-slim, Skripte read-only gemountet) ===============
  session-recorder:
    build:
      context: ./deploy/session-recorder
      dockerfile: ../compose/session-recorder/Dockerfile
    image: rbb-session-recorder:${RBB_REF:-dev}
    restart: unless-stopped
    depends_on:
      dedicated:
        condition: service_healthy
    logging: *default-logging
    labels:
      RBB_REF: *rbb-ref
    environment:
      RBB_REF: *rbb-ref
    volumes:
      - rb-wine:/data/.wine:ro
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/sessions:/data/sessions
    command:
      - python3
      - -u
      - /app/session_recorder.py
      - --wine-prefix
      - /data/.wine
      - --out-dir
      - /data/sessions

  send-tailer:
    build:
      context: ./deploy/send-tailer
      dockerfile: ../compose/send-tailer/Dockerfile
    image: rbb-send-tailer:${RBB_REF:-dev}
    restart: unless-stopped
    depends_on:
      dedicated:
        condition: service_healthy
      attack-cycle:
        condition: service_healthy
    logging: *default-logging
    labels:
      RBB_REF: *rbb-ref
    environment:
      RBB_REF: *rbb-ref
    volumes:
      - rb-wine:/data/.wine:ro
    command:
      - python3
      - -u
      - /app/send_tailer.py
      - --wine-prefix
      - /data/.wine
      - --queue-url
      - "http://attack-cycle:9102/queue_send"

  match-loop:
    build:
      context: ./deploy/match-loop
      dockerfile: ../compose/match-loop/Dockerfile
    image: rbb-match-loop:${RBB_REF:-dev}
    restart: unless-stopped
    depends_on:
      dedicated:
        condition: service_healthy
    logging: *default-logging
    labels:
      RBB_REF: *rbb-ref
    environment:
      RBB_REF: *rbb-ref
    command:
      - python3
      - -u
      - /app/match_loop.py
      - --bridge-url
      - "http://dedicated:9001"
      - --restart-delay
      - "10"

  attack-cycle:
    build:
      context: ./deploy/attack-cycle
      dockerfile: ../compose/attack-cycle/Dockerfile
    image: rbb-attack-cycle:${RBB_REF:-dev}
    restart: unless-stopped
    depends_on:
      dedicated:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u;u.urlopen('http://127.0.0.1:9102/status',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    labels:
      RBB_REF: *rbb-ref
    environment:
      RBB_REF: *rbb-ref
    expose:
      - "9102"
    command:
      - python3
      - -u
      - /app/attack_cycle.py
      - --bridge-url
      - "http://dedicated:9001"
      - --interval
      - "420"
      - --difficulty-interval
      - "200"
      - --control-bind
      - 0.0.0.0
      - --control-port
      - "9102"

  # === Entry: GNS-Proxy :6321 + Lobby (:8088 via caddy) =======================
  gns-relay:
    image: rb-dedicated:${RBB_REF:-dev}
    container_name: rbb-gns-relay
    restart: unless-stopped
    network_mode: host
    depends_on:
      dedicated:
        condition: service_started
      rbtools-build:
        condition: service_completed_successfully
      capsule-flow:
        condition: service_started
      queue:
        condition: service_started
    logging: *default-logging
    labels:
      RBB_REF: *rbb-ref
    environment:
      WINEPREFIX: /data/.wine
      WINEDEBUG: "-all"
      WINEESYNC: "0"
      WINEFSYNC: "0"
      DISPLAY: ":99"
      RBB_REF: *rbb-ref
      # Kapsel-Flow: POST /solo -> POST /capsule/open (warmed capsule). Der Relay
      # laeuft im Host-Netz und erreicht die Publish-Ports auf 127.0.0.1.
      RBB_CAPSULE_URL: "http://127.0.0.1:${RBB_CAPSULE_PORT:-9211}"
      RBB_CAPSULE_TOKEN: "${RBB_CAPSULE_TOKEN:-}"
      # Queue: POST /queue -> Paarung + kalte A/B-Welten (VS).
      RBB_QUEUE_URL: "http://127.0.0.1:${RBB_QUEUE_PORT:-9221}"
      RBB_QUEUE_TOKEN: "${RBB_QUEUE_TOKEN:-}"
    volumes:
      - rb-relay-wine:/data/.wine
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/game:/opt/riftbreaker:ro
      - ./deploy/compose/relay/routes:/etc/gns-relay/routes:ro
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/gns:/opt/gns-relay:ro
    entrypoint:
      - /bin/bash
      - -c
    # Xvfb (wine braucht ein X-Display), Wine-Prefix-Ownership korrigieren, dann
    # den Probe als steamuser starten. `--hold` hält neue Clients im Loading-Screen
    # bis sie in der Lobby (:8088) einem Ziel zugewiesen werden.
    command:
      - >-
        Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 & export DISPLAY=:99;
        chown -R steamuser:steamuser /data/.wine 2>/dev/null || true;
        cd /opt/riftbreaker/bin;
        gosu steamuser wine /opt/gns-relay/gns_probe.exe
        --port ${RBB_ENTRY_PORT:-6321}
        --map-file /etc/gns-relay/routes
        --dll /opt/riftbreaker/bin/GameNetworkingSockets.dll
        --api-host 127.0.0.1
        --api-port ${RBB_RELAY_API_PORT:-9200}
        --hold
        --mode ${RBB_MODE:-solo}
        --max-players 4
        --target SOLO=127.0.0.1:${RBB_SERVER_PORT:-6322}

  # === Entry: Caddy (http-only) ==============================================
  caddy:
    image: caddy:2
    container_name: rbb-caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      gns-relay:
        condition: service_started
    logging: *default-logging
    volumes:
      - ./deploy/compose/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  # === Observer: Crash-Collector + Symbolizer (#462/#480/#481) ================
  # Beobachtet den Dedi-Container (docker.sock), sammelt Minidump+Trace+Log und
  # symbolisiert gegen DLL/PDB (letztere bleiben AUSSERHALB des Images, #480).
  crash-collector:
    build:
      context: ./deploy/crash-collector
      dockerfile: ../compose/crash-collector/Dockerfile
    image: rbb-crash-collector:${RBB_REF:-dev}
    restart: unless-stopped
    depends_on:
      dedicated:
        condition: service_healthy
    logging: *default-logging
    environment:
      RB_CRASH_CONTAINER: rbb-dedicated
      RB_CRASH_ENV: ${RBB_ENV:-dev}
      RB_CRASH_REF: *rbb-ref
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/game:/game:ro
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/rbtools:/rbtools:ro
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/crashes:/crashes

  # === Control: Server-Control-Agent (docker-Wrapper, Plane B, #424) =========
  server-control:
    build:
      context: ./deploy/server-control
      dockerfile: ../compose/server-control/Dockerfile
    image: rbb-server-control:${RBB_REF:-dev}
    restart: unless-stopped
    depends_on:
      dedicated:
        condition: service_healthy
    logging: *default-logging
    environment:
      SERVER_CONTROL_TOKEN: ${RBB_SERVER_CONTROL_TOKEN:?set in .env — cp .env.example .env}
      SERVER_CONTROL_CONTAINER: rbb-dedicated
      SERVER_CONTROL_ENV: ${RBB_ENV:-dev}
      SERVER_CONTROL_REF: *rbb-ref
      SERVER_CONTROL_CONFIG_PATH: /config/config.cfg
      RBB_SERVER_NAME: "${RBB_SERVER_NAME:-RBBattle}"
      RBB_SERVER_PASSWORD: "${RBB_SERVER_PASSWORD:?set in .env}"
      RBB_SERVER_RCON_PASSWORD: "${RBB_SERVER_RCON_PASSWORD:-}"
      RBB_SERVER_MAX_PLAYERS: "${RBB_SERVER_MAX_PLAYERS:-4}"
      RBB_SERVER_BROADCAST_ENABLED: "${RBB_SERVER_BROADCAST_ENABLED:-1}"
      RBB_SERVER_PAUSE_GAME_WHEN_EMPTY: "${RBB_SERVER_PAUSE_GAME_WHEN_EMPTY:-0}"
      RBB_SERVER_CAMPAIGN: "${RBB_SERVER_CAMPAIGN:-mp_survival/mp_survival}"
      RBB_SERVER_MISSION: "${RBB_SERVER_MISSION:-survival/jungle}"
      RBB_SERVER_DIFFICULTY: "${RBB_SERVER_DIFFICULTY:-coop_normal}"
    ports:
      - "127.0.0.1:${RBB_SERVER_CONTROL_PORT:-8092}:8092"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/config:/config
      - ./deploy/compose/config/config.cfg.j2:/etc/rbmods/server-control/config.cfg.j2:ro

  # === Control: Tournament-Server (Referee + Web-UI) =========================
  tournament-server:
    build:
      context: ./tournament
      dockerfile: ../deploy/compose/tournament-server/Dockerfile
    image: rbb-tournament:${RBB_REF:-dev}
    restart: unless-stopped
    logging: *default-logging
    environment:
      TOURNAMENT_HOST: 0.0.0.0
      TOURNAMENT_PORT: "8080"
      TOURNAMENT_TOKEN: ${RBB_TOURNAMENT_TOKEN:?set in .env — cp .env.example .env}
      TOURNAMENT_AUTO_GO: "true"
      RBBRIDGE_A_URL: "${RBBRIDGE_A_URL:-http://dedicated:9001/exec}"
      RBBRIDGE_B_URL: "${RBBRIDGE_B_URL:-}"
      TOURNAMENT_WEB_DIR: /usr/share/tournament/web
      TOURNAMENT_DB_PATH: /data/rbbattle.db
      TOURNAMENT_ENV: ${RBB_ENV:-dev}
      TOURNAMENT_REF: *rbb-ref
      RUST_LOG: info
    ports:
      - "127.0.0.1:${RBB_TOURNAMENT_PORT:-8081}:8080"
    volumes:
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/tournament:/data

  # === Control: warm capsule claim source for the static dedi (#1108) ========
  # Macht die statische Compose-Dedi zur EINEN warmen Kapsel (Parked-Vertragssubset,
  # kein Provisioner/Pool). Die Kapsel claimt hierueber.
  warm:
    build:
      context: ./deploy/compose/warm
    image: rbb-warm:${RBB_REF:-dev}
    restart: unless-stopped
    depends_on:
      dedicated:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request as u,os;r=u.Request('http://127.0.0.1:9201/health',headers={'Authorization':'Bearer '+os.environ.get('WARM_TOKEN','')});u.urlopen(r,timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    labels:
      RBB_REF: *rbb-ref
    environment:
      WARM_BIND: "0.0.0.0"
      WARM_PORT: "9201"
      WARM_BRIDGE_URL: "http://dedicated:9001"
      # GNS-UDP-Endpoint, den der RELAY dialt (Host-Seite des Dedi-Publish).
      WARM_GNS_ENDPOINT: "127.0.0.1:${RBB_SERVER_PORT:-6322}"
      WARM_INSTANCE: "solo"
      WARM_ENV: ${RBB_ENV:-local}
      WARM_TOKEN: "${RBB_WARM_TOKEN:-}"
      WARM_PARK_ON_START: "true"
    ports:
      - "127.0.0.1:${RBB_WARM_PORT:-9201}:9201"

  # === Control: Kapsel-Flow (#931) ==========================================
  capsule-flow:
    build:
      context: ./deploy/capsule
      dockerfile: ../compose/capsule-flow/Dockerfile
    image: rbb-capsule-flow:${RBB_REF:-dev}
    restart: unless-stopped
    depends_on:
      attack-cycle:
        condition: service_healthy
      warm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request as u,os;r=u.Request('http://127.0.0.1:9211/health',headers={'Authorization':'Bearer '+os.environ.get('CAPSULE_TOKEN','')});u.urlopen(r,timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    environment:
      CAPSULE_ENV: ${RBB_ENV:-dev}
      CAPSULE_TOKEN: ${RBB_CAPSULE_TOKEN:?set in .env — cp .env.example .env}
      CAPSULE_CYCLE_URL: http://attack-cycle:9102
      CAPSULE_PARKED_URL: "http://warm:9201"
      CAPSULE_PARKED_TOKEN: "${RBB_WARM_TOKEN:-}"
    ports:
      - "127.0.0.1:${RBB_CAPSULE_PORT:-9211}:9211"

  # === VS: Provisioner-HTTP-Service :8094 (#1083/#1110) ======================
  # Erzeugt Sibling-Container via `docker run` (Host-daemon -> Host-1:1-Pfade!).
  provisioner:
    build:
      context: ./deploy/provisioner
      dockerfile: ../compose/provisioner/Dockerfile
    image: rbb-provisioner:${RBB_REF:-dev}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request as u,os;r=u.Request('http://127.0.0.1:8094/health',headers={'Authorization':'Bearer '+os.environ.get('PROVISIONER_TOKEN','')});u.urlopen(r,timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    environment:
      PROVISIONER_ENV: ${RBB_ENV:-local}
      PROVISIONER_BIND: 0.0.0.0
      PROVISIONER_PORT: "8094"
      PROVISIONER_TOKEN: "${RBB_PROVISIONER_TOKEN:-}"
      # Fachkonfiguration (Pfade = Host-1:1 unter RBB_HOST_ROOT).
      PROVISIONER_IMAGE: rb-dedicated:${RBB_REF:-dev}
      PROVISIONER_BASE_DIR: ${RBB_HOST_ROOT:-/srv/rbbattle}
      PROVISIONER_GAME_SOURCE: ${RBB_HOST_ROOT:-/srv/rbbattle}/game
      PROVISIONER_CONFIG_CFG: ${RBB_HOST_ROOT:-/srv/rbbattle}/config/config.cfg
      PROVISIONER_RBTOOLS_DIR: ${RBB_HOST_ROOT:-/srv/rbbattle}/rbtools
      PROVISIONER_SESSIONS_SCRIPT: ${RBB_REPO_ROOT:-/srv/rbbattle/repo}/deploy/session-recorder/session_recorder.py
      PROVISIONER_SEND_TAILER_SCRIPT: ${RBB_REPO_ROOT:-/srv/rbbattle/repo}/deploy/send-tailer/send_tailer.py
      PROVISIONER_MATCH_LOOP_SCRIPT: ${RBB_REPO_ROOT:-/srv/rbbattle/repo}/deploy/match-loop/match_loop.py
      PROVISIONER_ATTACK_CYCLE_SCRIPT: ${RBB_REPO_ROOT:-/srv/rbbattle/repo}/deploy/attack-cycle/attack_cycle.py
      PROVISIONER_CHAT_ANNOUNCER_SCRIPT: ${RBB_REPO_ROOT:-/srv/rbbattle/repo}/deploy/chat-announcer/announcer.py
      PROVISIONER_PERSONAS_FILE: ${RBB_REPO_ROOT:-/srv/rbbattle/repo}/deploy/attack-cycle/personas.example.json
      PROVISIONER_DEPLOY_REF: *rbb-ref
      PROVISIONER_BRIDGE_PORT_BASE: "30000"
    ports:
      - "127.0.0.1:${RBB_PROVISIONER_PORT:-8094}:8094"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Host-1:1: der Daemon loest `-v` gegen den HOST auf -> gleicher Pfad innen.
      - ${RBB_HOST_ROOT:-/srv/rbbattle}:${RBB_HOST_ROOT:-/srv/rbbattle}
      - ${RBB_REPO_ROOT:-/srv/rbbattle/repo}:${RBB_REPO_ROOT:-/srv/rbbattle/repo}:ro

  # === VS: Queue :9221 (#998) ================================================
  # Paarung (1v1) + kalte A/B-Provisionierung ueber den Provisioner + Referee.
  queue:
    build:
      context: ./deploy/queue
      dockerfile: ../compose/queue/Dockerfile
    image: rbb-queue:${RBB_REF:-dev}
    restart: unless-stopped
    depends_on:
      provisioner:
        condition: service_healthy
      tournament-server:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request as u,os;r=u.Request('http://127.0.0.1:9221/health',headers={'Authorization':'Bearer '+os.environ.get('QUEUE_TOKEN','')});u.urlopen(r,timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    environment:
      QUEUE_ENV: ${RBB_ENV:-local}
      QUEUE_BIND: 0.0.0.0
      QUEUE_PORT: "9221"
      QUEUE_TOKEN: "${RBB_QUEUE_TOKEN:-}"
      QUEUE_PROVISIONER_URL: "http://provisioner:8094"
      QUEUE_PROVISIONER_TOKEN: "${RBB_PROVISIONER_TOKEN:-}"
      QUEUE_REFEREE_URL: "http://tournament-server:8080"
      QUEUE_REFEREE_TOKEN: "${RBB_TOURNAMENT_TOKEN:-}"
      QUEUE_STATE_DIR: /var/lib/rbmods/queue
    ports:
      - "127.0.0.1:${RBB_QUEUE_PORT:-9221}:9221"
    volumes:
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/queue:/var/lib/rbmods/queue

  # === Hygiene: Timer-Sidecar (Ofelia) — image-retention + host-hygiene ======
  # Containerized twin of the systemd timers rbmods-image-retention (#309) and
  # rbmods-host-hygiene (#308/#606), Issue #1103. `hygiene` idles and carries the
  # tools (Docker CLI + shell) + mounts; `ofelia` schedules the two jobs as
  # LABELS on `hygiene` and runs them INSIDE it via `docker exec` (job-exec) — so
  # the jobs inherit hygiene's env (incl. RB_PROTECTED_TAGS=rb-dedicated:${RBB_REF})
  # and mounts for free. Ofelia must start AFTER hygiene: label discovery is not
  # realtime (docs/jobs.md). Schedules use robfig/cron descriptors (@daily/@weekly)
  # to sidestep the seconds-field format of Ofelia 0.3.x.
  hygiene:
    build:
      context: ./deploy/compose/hygiene
    image: rbb-hygiene:${RBB_REF:-dev}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # image-retention (#309): Tag-Retention der Mod-Runtime-Images.
      RB_IMAGE_REPOS: "rb-dedicated rb-headless-client"
      RB_ROLLBACK_TAGS: "2"
      RB_PROTECTED_TAGS: "rb-dedicated:${RBB_REF:-dev}"
      # host-hygiene (#308/#606): dangling-Image-Prune + rbtools test-* Retention.
      RB_HYGIENE_IMAGE_REPOS: "rb-dedicated rb-headless-client"
      RB_HYGIENE_RBTOOLS_DIR: "/opt/rbmods/rbtools"
      RB_HYGIENE_RBTOOLS_RETENTION: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RBB_HOST_ROOT:-/srv/rbbattle}/rbtools:/opt/rbmods/rbtools
      - ./deploy/image-retention:/opt/rbmods/image-retention:ro
      - ./deploy/host-hygiene:/opt/rbmods/host-hygiene:ro
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.image-retention.schedule: "@daily"
      ofelia.job-exec.image-retention.command: "/opt/rbmods/image-retention/docker_image_tag_retention.sh"
      ofelia.job-exec.host-hygiene.schedule: "@weekly"
      ofelia.job-exec.host-hygiene.command: "/opt/rbmods/host-hygiene/host_hygiene.sh"

  ofelia:
    image: mcuadros/ofelia:0.3.22
    restart: unless-stopped
    depends_on:
      hygiene:
        condition: service_started
    logging: *default-logging
    environment:
      TZ: UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker

volumes:
  # Nur Wine-/Saves-Prefixe bleiben Named Volumes (pro Instanz, nicht pro Host-Root).
  rb-wine:
  rb-saves:
  rb-relay-wine:
