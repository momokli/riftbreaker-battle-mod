---
# Prod-Instanz + Satellite-Relay (Issue #328) — zweiter Dedicated-Server
# (planet, :6322) öffentlich erreichbar über den Satellite-Relay
# (satellite:6321 -> :6322). Löst das clientseitig hardgewirete Port-6321-
# Problem über eine zweite öffentliche IPv4 (den Satellite) statt eines
# zweiten Ports.
#
# Aufruf (analog deploy/test-deploy.yml, Vault nötig für Server-Passwort):
#   ansible-playbook -i deploy/inventory deploy/deploy-prod.yml \
#     -e @deploy/prod-vars.yml --vault-password-file <vault.pass>
#
# Twin-Topologie + Tag→prod: prod ist jetzt ein vollwertiger Zwilling von dev
# (site.yml) — inkl. `website`-Rolle (Landing www.rift.projectmellon.de +
# Cockpit cockpit.rift.projectmellon.de, eigener rift-caddy-prod :8788,
# Bridge :9002). Der CD-Workflow (.github/workflows/deploy.yml) fährt dieses
# Playbook bei Tag-Push (v* -> prod). Der Image-Tag wird weiterhin aus dem
# Checkout-SHA (Tag-Commit) abgeleitet.

- name: RIFT BATTLE — Prod-Instanz (planet :6322)
  hosts: planet
  become: true

  vars:
    # Dieses Play deployt (noch) KEINEN server-control-Agenten (Rolle fehlt
    # unten) => die /server/*-Route im Cockpit NICHT rendern (Issue #463).
    # Sonst zeigt sie auf 127.0.0.1:{{ server_control_port }} — auf planet den
    # DEV-Agenten — und "Restart server" im Prod-Cockpit traefe den
    # dev-Container. Kommt prod ein Agent hinzu (eigener Port/Unit/Token),
    # hier auf true setzen + server-control-Rolle aufnehmen.
    server_control_enabled: false

  pre_tasks:
    - name: Deploy-SHA für den Image-Tag ermitteln
      command: git -c safe.directory=* -C {{ playbook_dir }}/.. rev-parse --short=12 HEAD
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      register: rbbattle_prod_sha
      tags: always

    - name: Image-Tag (Deploy-SHA) als Fact setzen
      set_fact:
        deploy_image_tag: "{{ rbbattle_prod_sha.stdout | trim }}"
      tags: always

  roles:
    - role: mods-zip
    - role: dedicated-server-image
    - role: game-content
    - role: rbtools
    - role: riftbreaker-server
    - role: tournament-server
    - role: website
      tags: [website]
    # Prod-Zwilling des Crash-Collectors (Issue #481): eigene Unit + eigenes
    # Bundle-Dir (crash_collector_* in prod-vars.yml) — Crashes auf prod sind
    # damit sichtbar statt nur "keine Marker im dev-Log".
    - role: crash-collector
      tags: [crash]

- name: RIFT BATTLE — Satellite-Relay (satellite)
  hosts: satellite
  become: true

  roles:
    - role: satellite-relay
