---
# Pre-Merge-Boot-Test (CI/CD-Plan F1, Issue #275): baut die Images, bootet den
# Game-Server UND den Tournament-Server als ZWEI Container im selben Compose/Netz
# — isoliert von Prod (eigene Namen/Pfade via deploy/test-vars.yml). Die
# Test-Instanz hat BEWUSST keine Host-Ports; Verifikation läuft intern per
# `docker exec` (kein Host-curl). Es geht nur um „baut + bootet + Netz-Kanal".
# Kein website/probe (DNS egal).
# Verifikation + Teardown: .github/workflows/boot-test.yml.
#
# Reihenfolge Absicht: tournament-server (Image + Legacy-Unit weg) VOR
# riftbreaker-server (Compose up startet beide Container).
#
# Aufruf (Workflow, Dummy-Vault — kein Secret nötig):
#   ansible-playbook -i <tmp-inventory-mit-Dummy-Vault> deploy/test-deploy.yml \
#     -e @deploy/test-vars.yml

- name: RIFT BATTLE — Pre-Merge-Boot-Test (Test-Ports)
  hosts: planet
  become: true

  pre_tasks:
    - name: Test-SHA für den Image-Tag ermitteln
      command: git -c safe.directory=* -C {{ playbook_dir }}/.. rev-parse --short=12 HEAD
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      register: rbbattle_test_sha

    - name: Image-Tag (Test-SHA) als Fact setzen
      set_fact:
        deploy_image_tag: "{{ rbbattle_test_sha.stdout | trim }}"

  roles:
    - role: mods-zip
    - role: dedicated-server-image
    - role: game-content
    - role: tournament-server
    - role: riftbreaker-server
