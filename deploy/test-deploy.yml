---
# Pre-Merge-Boot-Test (CI/CD-Plan F1): baut Image + tournament-server und
# bootet EINEN Game-Server + den tournament-server — isoliert von Prod
# (je Lauf eindeutige Namen/Pfade/Ports via deploy/test-vars.yml +
# rbbattle_run_suffix, Issue #307). Es geht nur um „baut + bootet".
# Kein website/probe (DNS egal — es geht nur um „baut + bootet").
# Verifikation + Teardown: .github/workflows/boot-test.yml.
#
# Aufruf (Workflow, Dummy-Vault — kein Secret nötig):
#   ansible-playbook -i <tmp-inventory-mit-Dummy-Vault> deploy/test-deploy.yml \
#     -e @deploy/test-vars.yml \
#     -e rbbattle_run_suffix="${{ github.run_id }}" \
#     -e tournament_port="<aus run_id abgeleitet>"

- name: RIFT BATTLE — Pre-Merge-Boot-Test (Test-Ports)
  hosts: planet
  become: true

  vars:
    # Deploy-Identitaet (Issue #483, US1): DIESES Play ist test. Play-Var, damit
    # die Test-Instanz nicht den dev-Wert erbt.
    rift_env: test

  pre_tasks:
    - name: Test-SHA für den Image-Tag ermitteln
      command: git -c safe.directory=* -C {{ playbook_dir }}/.. rev-parse --short=12 HEAD
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      register: rbbattle_test_sha

    - name: Image-Tag (Test-SHA) als Fact setzen
      set_fact:
        deploy_image_tag: "{{ rbbattle_test_sha.stdout | trim }}"

    # Deploy-Identitaet (Issue #483, US1): test-Ref = Checkout-SHA.
    - name: "Deploy-Identitaet erzeugen (Issue #483)"
      include_tasks: "{{ playbook_dir }}/tasks/deploy-identity.yml"
      vars:
        rift_deploy_checkout: "{{ playbook_dir }}/.."
      tags: always

    # Fail-loud-Contract (Issue #483, US2).
    - name: "ENV-ISOLATION-GATE (Issue #483)"
      include_tasks: "{{ playbook_dir }}/tasks/env-assert.yml"
      vars:
        rift_env_isolation_root: "{{ playbook_dir }}/.."
      tags: always

    # Env-Pfad-Migration (Issue #483, Ziel B): DERSELBE Wiring-Vertrag wie in
    # site.yml/deploy-prod.yml. Fuer test ist die Paarliste leer
    # (rift_env_path_migration_map.test = []) -> der Lauf ist ein no-op (kein
    # persistenter Alt-Pfad; der Boot-Test raeumt selbst auf). Bewusst NICHT
    # ausgelassen: ein Schema fuer alle Plays.
    - name: "Env-Pfad-Migration (#483)"
      include_tasks: "{{ playbook_dir }}/tasks/env-path-migration.yml"
      tags: always

    # Disk-Space-Gate (#310) — derselbe Preflight wie in deploy/site.yml, damit
    # der Boot-Test denselben Abbruch-Pfad fährt (Schwelle via test-vars.yml
    # überschreibbar). Vor dedicated-server-image, also vor dem Image-Build.
    - name: "Disk-Gate — freien Platz VOR Image-Build/Backup prüfen (#310)"
      include_role:
        name: riftbreaker-server
        tasks_from: disk-preflight
      tags: always

  roles:
    - role: mods-zip
    - role: dedicated-server-image
    - role: game-content
    # Trainer-I/O-Tools (Issue #265): baut die 4 Windows-Binaries auf dem
    # Zielhost und staged sie nach {{ rbtools_dir }}. Seit Issue #483 (US3)
    # isoliert test-vars.yml rbtools_dir je Lauf
    # (/opt/rbmods/rbtools-test-<run>) — OHNE diese Rolle blieb der isolierte
    # Ordner leer, der Compose-Mount {{ riftbreaker_rbtools_dir }}:/opt/rbtools
    # lieferte ein leeres /opt/rbtools und die IO-Bridge kam nicht hoch
    # (Core-IO-Gate C1 Timeout, Review-F1). Reihenfolge wie in site.yml: die
    # Rolle stagt die Binaries VOR riftbreaker-server (Compose-Mount-Source),
    # damit der Container beim Boot bereits rbbridge.dll/pipe_bridge.exe sieht.
    - role: rbtools
    - role: riftbreaker-server
    - role: tournament-server
