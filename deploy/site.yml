---
# RIFT BATTLE — Deployment EINER Dedicated-Server-Instanz auf planet
# (systemd + docker, Website, Mods-Zip, Probe).
#
# Deploy NUR über die Playbooks in deploy/:
#   # eine Instanz (Default: release):
#   ansible-playbook -i deploy/inventory deploy/site.yml --ask-vault-pass
#   # explizit eine andere Instanz:
#   ansible-playbook -i deploy/inventory deploy/site.yml \
#     -e riftbreaker_instance=dev --ask-vault-pass
#   # alle Instanzen (Release + DEV) in einem Lauf:
#   ansible-playbook -i deploy/inventory deploy/fleet.yml --ask-vault-pass
#
# Multi-Instanz (Issue #290): die Instanz wird über das Profil
# `deploy/instances/<riftbreaker_instance>.yml` gewählt (Default `release`).
# Das Profil liefert alle instanz-spezifischen Rollen-Variablen (Ports, Namen,
# Pfade, Volumes, Content-Stand); host_weite Werte (Image, Website, Probe,
# Content-Cache, Vault) kommen aus deploy/inventory/host_vars/planet/vars.yml.
# Das Profil hat Vorrang vor host_vars, weil `vars_files` höher priorisiert ist.
#
# From-zero (Issue #209): das Playbook besitzt den kompletten Stack. Es baut das
# Laufzeit-Image selbst, provisioniert den Steam-Content und pinnt das Compose
# auf den Deploy-SHA — es gibt keinen manuellen „einmalig auf planet"-Schritt.
#
# Reihenfolge ist absichtlich:
#   1. mods-zip             Paketierung + md5-Parität (liefert rbbattle.zip)
#   2. dedicated-server-image baut rb-dedicated:<deploy-sha> (Laufzeit)
#   3. game-content         Steam-Content (App 4114030) nach game_dir
#   4. rbtools              Windows-x64-Trainer-I/O-Tools bauen+stagen
#      (/opt/rbmods/rbtools -> /opt/rbtools:ro im Container, Issue #265)
#   5. riftbreaker-server   Dedicated-Server (Mod-Install + Restart-Handler)
#   6. tournament-server    systemd (Rust/axum)
#   7. website              statics + Caddy (inkl. /tournament/*-Proxy)
#   8. probe-timer          systemd-Timer → status.json (listet ALLE Instanzen)
#
# Tags erlauben einen gezielten Lauf (z. B. `--tags server` im PR-Gate
# deploy-check) ohne die übrigen Rollen anzufassen.

- name: "RIFT BATTLE — planet deploy (Instanz: {{ riftbreaker_instance | default('release') }})"
  hosts: planet
  become: true

  vars_files:
    # Instanz-Profil; Default `release` = bisherige Prod-Instanz (:6321).
    - "instances/{{ riftbreaker_instance | default('release') }}.yml"

  pre_tasks:
    # Image-Tag = Deploy-SHA (kein `latest`). Läuft auch im --check
    # (check_mode: false, read-only, lokal), damit das Compose-Template dort
    # renderbar bleibt und der Gate denselben Stand sieht.
    - name: Deploy-SHA für den Image-Tag ermitteln
      # `-c safe.directory=*`: beim CD läuft ansible als root im
      # deploy-eigenen Checkout — ohne diese Option verweigert git das
      # rev-parse („dubious ownership"). Read-only.
      command: git -c safe.directory=* -C {{ playbook_dir }}/.. rev-parse --short=12 HEAD
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      register: rbbattle_deploy_sha
      tags: always

    - name: Image-Tag (Deploy-SHA) als Fact setzen
      set_fact:
        deploy_image_tag: "{{ rbbattle_deploy_sha.stdout | trim }}"
      tags: always

  roles:
    - role: mods-zip
      tags: [content]
    - role: dedicated-server-image
      tags: [server]
    - role: game-content
      tags: [content]
    - role: rbtools
      tags: [server]
    - role: riftbreaker-server
      tags: [server]
    - role: tournament-server
      tags: [tournament]
    - role: website
      tags: [website]
    - role: probe-timer
      tags: [probe]
