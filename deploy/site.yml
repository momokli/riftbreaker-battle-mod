---
# RIFT BATTLE — Deployment auf planet (systemd + docker, Website, Mods-Zip).
#
# Deploy NUR über dieses Playbook:
#   ansible-playbook -i deploy/inventory deploy/site.yml --ask-vault-pass
#
# From-zero (Issue #209): das Playbook besitzt den kompletten Stack. Es baut das
# Laufzeit-Image selbst, provisioniert den Steam-Content und pinnt das Compose
# auf den Deploy-SHA — es gibt keinen manuellen „einmalig auf planet"-Schritt.
#
# Reihenfolge ist absichtlich:
#   1. mods-zip             Paketierung + md5-Parität (liefert rbbattle.zip)
#   2. dedicated-server-image baut rb-dedicated:<deploy-sha> (Laufzeit
#      für :6321)
#   3. game-content         Steam-Content (App 4114030) nach game_dir
#   4. rbtools              Windows-x64-Server-I/O-Tools bauen+stagen
#      (/opt/rbmods/rbtools -> /opt/rbtools:ro im Container, Issue #265)
#   5. gns-relay            GNS-Entry-Relay auf UDP 6321 (terminiert + routet
#      per Spielname-Suffix auf prod/staging/dev; haelt seit #857 unentschiedene
#      Joins und routet sie per lokaler Web-UI; Issue #843/#857)
#   6. riftbreaker-server   Dev-SP-Server 6324 (Mod-Install + Restart-Handler);
#      6321 gehoert jetzt dem gns-relay -> dev zieht von 6321 auf 6324 um
#   7. tournament-server    systemd (Rust/axum)
#   8. server-control       systemd Host-Agent (docker-Wrapper: Status/Logs/
#                           Restart/Start/Stop + config.cfg; Plane B, #424)
#   9. website              eigener rift-caddy (Landing: file_server + /mod.zip,
#                           Cockpit: /contract/* + /tournament/*)
#  10. image-retention      systemd-Timer → alte Mod-Image-Tags aufräumen
#                           (Rollback-Stand + laufendes Image bleiben, #309)
#  11. host-hygiene         systemd-Timer → dangling Docker-Images aufräumen
#                           (`docker image prune`, KEIN `-a`; Issue #308)
#  12. crash-collector      systemd-Dienst → Crash-Artefakte (Minidump +
#                           Trace + Log) sichern + Retention (Issue #462)
#
# Tags erlauben einen gezielten Lauf (z. B. `--tags server` im PR-Gate
# deploy-check) ohne die übrigen Rollen anzufassen.

- name: RIFT BATTLE — planet deploy
  hosts: planet
  become: true

  vars:
    # Dieses Play deployt den server-control-Agenten (Rolle unten) => die
    # /server/*-Route im Cockpit darf gerendert werden (Issue #463). Play-Var,
    # damit die Verdrahtung eindeutig an DER Stelle steht, die die Rolle
    # enthaelt (Rollen-Defaults + host_vars sind niedriger praezedent).
    server_control_enabled: true
    # Deploy-Identitaet (Issue #483, US1): DIESES Play ist dev. Play-Var, damit
    # prod/test nicht den dev-Wert erben (dieselbe Praezedenz wie oben).
    rift_env: dev

  pre_tasks:
    # Image-Tag = Deploy-SHA (kein `latest`). Läuft auch im --check
    # (check_mode: false, read-only, lokal), damit das Compose-Template dort
    # renderbar bleibt und der Gate denselben Stand sieht.
    - name: Deploy-SHA für den Image-Tag ermitteln
      # `-c safe.directory=*`: beim CD läuft ansible als root im
      # deploy-eigenen Checkout — ohne diese Option verweigert git das
      # rev-parse („dubious ownership"). Read-only.
      command: git -c safe.directory=* -C {{ playbook_dir }}/.. rev-parse --short=12 HEAD
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      register: rbbattle_deploy_sha
      tags: always

    - name: Image-Tag (Deploy-SHA) als Fact setzen
      set_fact:
        deploy_image_tag: "{{ rbbattle_deploy_sha.stdout | trim }}"
      tags: always

    # Deploy-Identitaet (Issue #483, US1): setzt rift_deploy_ref +
    # rift_deploy_identity. `tags: always`, damit das Gate bei jedem Lauf greift.
    - name: "Deploy-Identitaet erzeugen (Issue #483)"
      include_tasks: "{{ playbook_dir }}/tasks/deploy-identity.yml"
      vars:
        rift_deploy_checkout: "{{ playbook_dir }}/.."
      tags: always

    # Fail-loud-Contract (Issue #483, US2): jede Env-Variable ist per-env oder
    # shared (begruendet) — sonst bricht der Deploy ab (ENV-ISOLATION-GATE).
    - name: "ENV-ISOLATION-GATE (Issue #483)"
      include_tasks: "{{ playbook_dir }}/tasks/env-assert.yml"
      vars:
        rift_env_isolation_root: "{{ playbook_dir }}/.."
      tags: always

    # Env-Pfad-Migration (Issue #483, Ziel B): idempotenter `mv` + Symlink-
    # Uebergang Alt->Neu MUSS VOR den Rollen laufen. Der CD ist automatisch
    # (push -> site.yml): ohne diese Einbindung deployt der naechste Lauf die
    # NEUEN Pfade OHNE migrierten Stand — /srv/rift-dev/game fehlt, game-content
    # kopiert 664MB aus dem Cache statt `mv` (#301), Alt-Pfade (/srv/rbgame,
    # /opt/rbmods/rbtools-drift, ...) bleiben verwaist. Idempotent: nach dem
    # ersten Lauf ist Alt ein Symlink -> no-op; test (Map leer) ist ein no-op.
    # `tags: always`, damit der deploy-check (`--tags server,website`) denselben
    # Vertrag sieht.
    - name: "Env-Pfad-Migration (#483)"
      include_tasks: "{{ playbook_dir }}/tasks/env-path-migration.yml"
      tags: always

    # Legacy-rbtools-Symlink-Cleanup (#606): entfernt die vier Alt-Pfad-Symlinks
    # rbtools-drift/-staging-drift (dev) und rbtools-rift/-staging-rift (prod),
    # die die #483-Migration als Rollback-Alias hinterlassen hat. Kein aktiver
    # Pfad referenziert sie mehr. Idempotent (nur Symlink, nie ein Verzeichnis).
    - name: "Legacy-rbtools-Symlink-Cleanup (#606)"
      include_tasks: "{{ playbook_dir }}/tasks/legacy-rbtools-symlink-cleanup.yml"
      tags: always

    # Disk-Space-Gate (#310): MUSS VOR `dedicated-server-image` (Image-Build)
    # und VOR dem Mod-Backup laufen — ein Deploy auf voller Platte kann sich
    # nicht mehr selbst herausdeployen (Build/Zip-Backup brauchen selbst Platz).
    # Deshalb hier in den pre_tasks (vor den Rollen) und nicht in der Rolle, die
    # erst NACH dem Image-Build dran ist. Read-only (Fact ansible_mounts) →
    # `--check`-fest. `tags: always`, damit es auch unter `--tags server,website`
    # (deploy-check) greift.
    - name: "Disk-Gate — freien Platz VOR Image-Build/Backup prüfen (#310)"
      include_role:
        name: riftbreaker-server
        tasks_from: disk-preflight
      tags: always

  roles:
    - role: mods-zip
      tags: [content]
    - role: dedicated-server-image
      tags: [server]
    - role: game-content
      tags: [content]
    - role: rbtools
      tags: [server]
    - role: gns-relay
      tags: [server]
    - role: riftbreaker-server
      tags: [server]
    - role: tournament-server
      tags: [tournament]
    - role: server-control
      tags: [server]
    # Parked-Pool-Dienst (Issue #928): Warm-Pool-Halter pro Env. env-Param
    # explizit an dieser Stelle, damit der Unit-Name (rbmods-parked-<env>)
    # an DIESEM Play haengt (wie server_control_enabled/rift_env oben).
    - role: parked-pool
      tags: [server]
      vars:
        parked_pool_env: "{{ rift_env | default('dev') }}"
    - role: website
      tags: [website]
    - role: image-retention
    - role: host-hygiene
      tags: [hygiene]
    - role: crash-collector
      tags: [crash]
