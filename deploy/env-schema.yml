---
# env-schema.yml — Env-Isolations-Schema (Issue #483, US2).
#
# Vertrag: JEDE Variable in den Env-Override-Dateien
# (deploy/prod-vars.yml, deploy/test-vars.yml) ist entweder
#   * `per_env`  -> Umgebungs-spezifisch (Pfad/Name/Port/Domain) und MUSS in
#                   JEDER gelisteten Env-Datei **explizit** stehen. Fehlt sie,
#                   erbt die Env still den dev-Wert (host_vars) — genau die
#                   Bug-Klasse aus #483. Das Gate bricht dann ab.
#   * `shared`   -> bewusst env-uebergreifend identisch, MIT Begruendung
#                   (Allowlist). Ein Eintrag ohne Begruendung ist ein Fehler.
#
# `per_env` ist ein Mapping `variable: [envs]` — die Liste nennt die Envs, die
# die Variable explizit setzen MUESSEN. So bleiben env-spezifische Features
# (z. B. Website nur prod) korrekt: sie werden fuer prod gefordert, nicht fuer
# eine Env, die die Komponente gar nicht deployt.
#
# Geprueft wird von tools/deploy-gate/check_env_isolation.py (stdlib, kein
# PyYAML); der Aufruf steht in deploy/tasks/env-assert.yml (Marker
# ENV-ISOLATION-GATE) und laeuft in den pre_tasks VOR den Rollen.
#
# `dev` hat KEINE eigene Override-Datei: dev IST die Basis
# (inventory/host_vars/planet/vars.yml). Seit der Ziel-B-Migration (#483) nutzt
# dev DENSELBEN `<env>`-Namensraum (/srv/rift-dev/... statt der frueheren
# unsuffigierten Sonderpfade /srv/rbgame etc.) — ein Schema, aus `rift_env`
# abgeleitet. Die Distinctness gegen die dev-Basis asserted env-assert.yml.

per_env:
  # --- Dedicated-Server -----------------------------------------------------
  riftbreaker_server_container: [prod, test, staging]
  riftbreaker_server_port_udp: [prod, test, staging]
  # Compose-Projekt JE Env explizit (Issue #483, Ziel B): im neuen
  # `<env>`-Schema ist der Compose-Verzeichnis-Basename ueberall "riftbreaker"
  # -> ohne expliziten Projektnamen kollidierten dev und prod. Variante (a),
  # Befund 2: der Wert bleibt der HISTORISCHE Projektname
  # (dev `riftbreaker-dedicated`, prod `riftbreaker-dedicated-prod`), damit die
  # projekt-praefixten Docker-Volumes der laufenden Instanzen weiter getroffen
  # werden; test bleibt lauf-isoliert (`rb-test-<suffix>`).
  riftbreaker_compose_project: [dev, prod, test, staging]
  riftbreaker_game_dir: [prod, test, staging]
  riftbreaker_mod_dir: [prod, test, staging]
  riftbreaker_backup_dir: [prod, test, staging]
  riftbreaker_deploy_dir: [prod, test, staging]
  riftbreaker_config_dir: [prod, staging]
  riftbreaker_wine_volume: [prod, test, staging]
  riftbreaker_saves_volume: [prod, test, staging]
  riftbreaker_bridge_port: [prod, test, staging]
  # --- Server-I/O-Tools (rbtools) -----------------------------------------
  rbtools_dir: [prod, test, staging]
  rbtools_staging_dir: [prod, test, staging]
  # --- Sidecars (Session-Recorder + Send-Tailer + Referee-Egress) ----------
  riftbreaker_sessions_container: [prod, test, staging]
  riftbreaker_sessions_dir: [prod, test, staging]
  riftbreaker_send_tailer_container: [prod, test, staging]

  # --- Crash-Collector (Prod-Zwilling, Issue #481) -------------------------
  crash_collector_unit: [prod, staging]
  crash_collector_dir: [prod, staging]
  crash_collector_container: [prod, staging]
  # --- Server-Control (Prod-Zwilling, Issue #498) --------------------------
  server_control_unit: [prod, staging]
  server_control_port: [prod, staging]
  server_control_install_dir: [prod, staging]
  server_control_env_file: [prod, staging]
  # --- Tournament-Server ----------------------------------------------------
  tournament_install_dir: [prod, test, staging]
  tournament_unit: [prod, test, staging]
  tournament_port: [prod, test, staging]
  tournament_bridge_a_url: [prod, test, staging]
  tournament_bridge_b_url: [prod, test, staging]
  # --- Website (prod + staging betreiben je eine eigene Landing/Cockpit) -----
  landing_domain: [prod, staging]
  cockpit_domain: [prod, staging]
  rift_caddy_container: [prod, staging]
  rift_caddy_port: [prod, staging]
  rift_caddy_deploy_dir: [prod, staging]
  rift_caddy_data_dir: [prod, staging]
  rift_caddy_config_dir: [prod, staging]
  # --- Website-Pfade explizit je Env (Issue #483, US3) ---------------------
  website_docroot: [prod, test, staging]
  website_mods_dir: [prod, test, staging]
  # mods_zip_dest wird nur von prod explizit gesetzt; test leitet es (ueber das
  # isolierte website_mods_dir) aus host_vars ab und bleibt dadurch distinct.
  mods_zip_dest: [prod, staging]
  # --- Boot-Test (nur test) -------------------------------------------------
  dedicated_server_context_dir: [test]

shared:
  riftbreaker_content_mode: "Content wird in allen Envs per Sync aus dem kanonischen Cache geholt — gleicher Modus, kein Env-Zustand (#483)."
  riftbreaker_content_cache_dir: "Kanonischer Steam-Content-Cache auf planet (Host-Stand, /srv/riftbreaker/data/server) — EINE Quelle fuer alle Envs."
  riftbreaker_disk_min_free_gb: "Disk-Gate-Schwelle ist ein Host-Ressourcen-Parameter, kein Env-Pfad/-Name/Stand (gleiche Schwelle ueberall)."
  cargo_home: "Rust-Toolchain-Pfad des CI-Runners — Laufzeit-/Runner-Infrastruktur, kein Env-State."
  rustup_home: "Rust-Toolchain-Pfad des CI-Runners — Laufzeit-/Runner-Infrastruktur, kein Env-State."
  rbbattle_run_suffix: "Nur die Test-Instanz traegt einen Lauf-Suffix (github.run_id) — Lauf-Parameter, kein Env-Pfad/Port/Domain."
  # --- Dev-Basis-Keys (host_vars/planet), env-uebergreifend identisch -------
  # Diese Keys stehen NUR in host_vars, nicht in prod-/test-vars. Sie sind
  # bewusst klassifiziert (nicht "still geerbt"): das Gate fordert fuer JEDEN
  # host_vars-Top-Level-Key eine Klasse. Begruendung je Key unten.
  dedicated_server_image_name: "Image-Basisname (rb-dedicated) ist ueber alle Envs gleich; der Tag kommt aus deploy_image_tag (Deploy-SHA), nicht aus der Env."
  dedicated_server_image: "Rendert den env-unabhaengigen Tag (image_name:deploy_image_tag); Env-Trennung laeuft ueber Container-Name/Pfade, nicht den Image-Namen."
  riftbreaker_server_image: "Alias auf dedicated_server_image — gleiche Begruendung (Tag = Deploy-SHA, kein Env-Praefix)."
  rift_caddy_image: "Upstream-Image caddy:2 — derselbe schlanke Caddy fuer jede Env, kein Env-Zustand."
  website_host_caddy_container: "Geteilter Host-Caddy (mellon-caddy) hostet fremde Domains — EINER pro Host, kein Env-Praefix moeglich (#322)."
  website_host_caddyfile_path: "Pfad zum geteilten Host-Caddyfile (/home/momo/Caddyfile) — Host-Konstante, kein Env-Zustand."
  website_host_caddyfile_owner: "Owner des geteilten Host-Caddyfiles (momo) — Host-Konstante, kein Env-Zustand."
  website_host_caddyfile_group: "Gruppe des geteilten Host-Caddyfiles (momo) — Host-Konstante, kein Env-Zustand."
  mods_zip_name: "Zip-Dateiname rbbattle.zip ist historisch fix (md5-Paritaet/Download-Link); Env-Trennung erfolgt ueber das abweichende mods_zip_dest."
  rift_caddy_site_root: "Docroot IM Caddy-Container (/srv/site) — container-interner Pfad, unabhaengig vom Host-Mount je Env."
  riftbreaker_server_campaign: "Bis #476 gemeinsam (Game-Settings koppeln heute dev/prod) — Kopplung ist bewusst/dokumentiert, kein stilles Erben."
  riftbreaker_server_mission: "Bis #476 gemeinsam (Game-Settings koppeln heute dev/prod) — wie campaign."
  riftbreaker_server_difficulty: "Bis #476 gemeinsam (Game-Settings koppeln heute dev/prod) — wie campaign."
