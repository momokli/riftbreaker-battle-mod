---
# deploy-check (Issue #209): rendert die Compose-Templates LOKAL nach
# RBBATTLE_RENDER_DIR — Grundlage für `docker compose config` im PR-Gate.
#
# Rein lokal, kein Host-Zugriff, kein Vault: die für das Rendern nötigen Werte
# (Server-Passwort, Solo-Hash) kommen als Dummy aus dem Play (kein Secret, nie
# produktiv genutzt) — das verschlüsselte vault.yml wird nie entschlüsselt.
- name: RIFT BATTLE — Compose-Render (deploy-check)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - inventory/host_vars/planet/vars.yml
    # Rollen-Defaults liefern die Compose-Command-Listen (keine Host-Vars).
    - roles/riftbreaker-server/defaults/main.yml
    - roles/website/defaults/main.yml
    # server-control: liefert server_control_port fuer den /server/*-Proxy im
    # rift-caddy-Caddyfile (Issue #424).
    - roles/server-control/defaults/main.yml

  vars:
    # Dummy-Werte nur fürs Rendern (kein Secret).
    deploy_image_tag: check
    riftbreaker_server_password: check-dummy
    vault_solo_basic_auth_hash: ""
    render_dir: "{{ lookup('env', 'RBBATTLE_RENDER_DIR') | default('/tmp/rbbattle-compose-render', true) }}"

  tasks:
    - name: Render-Verzeichnis sicherstellen
      file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"

    - name: riftbreaker-server Compose rendern
      template:
        src: roles/riftbreaker-server/templates/docker-compose.yml.j2
        dest: "{{ render_dir }}/riftbreaker-server.yml"
        mode: "0600"

    - name: rift-caddy Compose rendern (Issue 322)
      template:
        src: roles/website/templates/docker-compose.yml.j2
        dest: "{{ render_dir }}/rift-caddy.yml"
        mode: "0644"

    # Regression-Guard Issue #355: rift-caddy MUSS `admin off` setzen. Sonst
    # belegt der host-net-Container Caddys Default-Admin-Port 127.0.0.1:2019 und
    # kollidiert mit der Admin-API des geteilten Host-Caddys (mellon-caddy):
    # `docker exec mellon-caddy caddy reload` dialt localhost:2019 und landet
    # dann per Kernel-Load-Balancing mal beim rift-caddy (plain `caddy:2`, OHNE
    # cloudflare-DNS-Provider) → HTTP 400
    # "unknown module: dns.providers.cloudflare".
    - name: rift-caddy Caddyfile rendern (Issue 355)
      template:
        src: roles/website/templates/rift-caddy.Caddyfile.j2
        dest: "{{ render_dir }}/rift-caddy.Caddyfile"
        mode: "0644"

    - name: rift-caddy — Admin-Endpunkt MUSS aus sein (Issue 355)
      assert:
        that:
          - "'admin off' in (lookup('file', render_dir ~ '/rift-caddy.Caddyfile'))"
        fail_msg: >-
          rift-caddy.Caddyfile.j2 enthaelt kein `admin off`. Der rift-caddy
          laeuft im host-Netz und wuerde sonst den Admin-Port 127.0.0.1:2019
          belegen und mit der Admin-API des geteilten Host-Caddys kollidieren
          (Reload → HTTP 400 unknown module dns.providers.cloudflare, Issue #355).
        success_msg: "rift-caddy Admin-Port aus (admin off) — keine Kollision mit dem Host-Caddy."
