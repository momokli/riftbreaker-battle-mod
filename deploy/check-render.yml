---
# deploy-check (Issue #209): rendert die Compose-Templates LOKAL nach
# RBBATTLE_RENDER_DIR — Grundlage für `docker compose config` im PR-Gate.
#
# Rein lokal, kein Host-Zugriff, kein Vault: die für das Rendern nötigen Werte
# (Server-Passwort, Solo-Hash) kommen als Dummy aus dem Play (kein Secret, nie
# produktiv genutzt) — das verschlüsselte vault.yml wird nie entschlüsselt.
- name: RIFT BATTLE — Compose-Render (deploy-check)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - inventory/host_vars/planet/vars.yml
    # Rollen-Defaults liefern die Compose-Command-Listen (keine Host-Vars).
    - roles/riftbreaker-server/defaults/main.yml
    - roles/website/defaults/main.yml
    # server-control: liefert server_control_port fuer den /server/*-Proxy im
    # rift-caddy-Caddyfile (Issue #424).
    - roles/server-control/defaults/main.yml

  vars:
    # Dummy-Werte nur fürs Rendern (kein Secret).
    deploy_image_tag: check
    riftbreaker_server_password: check-dummy
    vault_solo_basic_auth_hash: ""
    # Server-Control-Bearer (Issue #424/#454): die website-Rolle rendert ihn in
    # die /server/*-Route. Dummy — das echte Vault wird hier nie entschlüsselt.
    vault_server_control_token: check-dummy-token
    render_dir: "{{ lookup('env', 'RBBATTLE_RENDER_DIR') | default('/tmp/rbbattle-compose-render', true) }}"

  tasks:
    # Issue #463: check-render emuliert das dev-Play (site.yml) — dev deployt den
    # server-control-Agenten, also darf die /server/*-Route im Cockpit gerendert
    # werden. Als set_fact, weil die hier als vars_files geladenen
    # Rollen-Defaults (website/defaults: server_control_enabled: false) die
    # Praezedenz von Play-Vars ueberschreiben; set_fact gewinnt dagegen.
    - name: "Dev-Kontext: server-control-Route aktivieren (Issue #463)"
      set_fact:
        server_control_enabled: true

    # Deploy-Identitaet im dev-Kontext (Issue #483, US4): set_fact, weil die hier
    # als vars_files geladenen Rollen-Defaults (website/defaults:
    # rift_env/rift_deploy_ref) die Praezedenz von Play-Vars ueberschreiben.
    - name: "Dev-Kontext: Deploy-Identitaet setzen (Issue #483)"
      set_fact:
        rift_env: dev
        rift_deploy_ref: "{{ deploy_image_tag }}"

    # Eigener Task: Werte eines einzelnen set_fact werden gegen den VORHERIGEN
    # Variablenstand gerendert — rift_deploy_identity wuerde sonst die
    # Rollen-Defaults ("unknown · unknown") sehen.
    - name: "Dev-Kontext: rift_deploy_identity ableiten (Issue #483)"
      set_fact:
        rift_deploy_identity: "{{ rift_env }} · {{ rift_deploy_ref }}"

    - name: Render-Verzeichnis sicherstellen
      file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"

    - name: riftbreaker-server Compose rendern
      template:
        src: roles/riftbreaker-server/templates/docker-compose.yml.j2
        dest: "{{ render_dir }}/riftbreaker-server.yml"
        mode: "0600"

    - name: rift-caddy Compose rendern (Issue 322)
      template:
        src: roles/website/templates/docker-compose.yml.j2
        dest: "{{ render_dir }}/rift-caddy.yml"
        mode: "0644"

    # Deploy-Identitaet sichtbar (Issue #483, US4): die Landing-HTML wird aus
    # dem echten Rollen-Template gerendert; meta rb-env/rb-ref + Badge muessen
    # den dev-Kontext tragen. Rein lokal (hermetischer Render-Test).
    - name: Landing-HTML rendern (Issue 483)
      template:
        src: roles/website/templates/index.html.j2
        dest: "{{ render_dir }}/index.html"
        mode: "0644"

    - name: Landing-HTML traegt env/ref (Issue 483)
      vars:
        landing: "{{ lookup('file', render_dir ~ '/index.html') }}"
      assert:
        that:
          - "'<meta name=\"rb-env\" content=\"dev\">' in landing"
          - "('<meta name=\"rb-ref\" content=\"' ~ rift_deploy_ref ~ '\">') in landing"
          - "'rb-identity' in landing"
          - "('dev · ' ~ rift_deploy_ref) in landing"
        fail_msg: >-
          Die gerenderte Landing-HTML traegt die Deploy-Identitaet nicht
          (meta rb-env/rb-ref + Badge, Issue #483).
        success_msg: "Landing-HTML traegt env/ref (Issue #483)."

    # Regression-Guard Issue #355: rift-caddy MUSS `admin off` setzen. Sonst
    # belegt der host-net-Container Caddys Default-Admin-Port 127.0.0.1:2019 und
    # kollidiert mit der Admin-API des geteilten Host-Caddys (mellon-caddy):
    # `docker exec mellon-caddy caddy reload` dialt localhost:2019 und landet
    # dann per Kernel-Load-Balancing mal beim rift-caddy (plain `caddy:2`, OHNE
    # cloudflare-DNS-Provider) → HTTP 400
    # "unknown module: dns.providers.cloudflare".
    - name: rift-caddy Caddyfile rendern (Issue 355)
      template:
        src: roles/website/templates/rift-caddy.Caddyfile.j2
        dest: "{{ render_dir }}/rift-caddy.Caddyfile"
        mode: "0644"

    - name: rift-caddy — Admin-Endpunkt MUSS aus sein (Issue 355)
      assert:
        that:
          - "'admin off' in (lookup('file', render_dir ~ '/rift-caddy.Caddyfile'))"
        fail_msg: >-
          rift-caddy.Caddyfile.j2 enthaelt kein `admin off`. Der rift-caddy
          laeuft im host-Netz und wuerde sonst den Admin-Port 127.0.0.1:2019
          belegen und mit der Admin-API des geteilten Host-Caddys kollidieren
          (Reload → HTTP 400 unknown module dns.providers.cloudflare, Issue #355).
        success_msg: "rift-caddy Admin-Port aus (admin off) — keine Kollision mit dem Host-Caddy."

    # Issue #454: Das Template setzt `header_up` NUR, wenn ein Token da ist
    # (`{% if server_control_token %}`) — ein leeres `Bearer ` wuerde der Agent
    # ablehnen. Deshalb wird ZUSAETZLICH mit leerem Token gerendert: ohne Token
    # darf KEIN `header_up` entstehen (fail-closed), die Basic-Auth bleibt.
    - name: rift-caddy Caddyfile mit LEEREM Server-Control-Token rendern (Issue 454)
      template:
        src: roles/website/templates/rift-caddy.Caddyfile.j2
        dest: "{{ render_dir }}/rift-caddy-empty-token.Caddyfile"
        mode: "0644"
      vars:
        server_control_token: ""

    # Regression-Guard Issue #454: die /server/*-Route ist im Browser erreichbar
    # (Operator-Basic-Auth wie der Cockpit-Root) UND der Agent-Bearer wird von
    # Caddy injiziert — sonst kann der Browser den Token gar nicht senden und
    # jedes Panel-Request endet im 401 des Agenten. Der Token darf NIE im
    # gerenderten Caddyfile fehlen (leer = Panel kaputt) und NIE im Browser/JS
    # landen (deshalb liegt er hier nur serverseitig im Proxy-Block).
    - name: rift-caddy — /server/* MUSS basic_auth + injizierten Bearer tragen (Issue 454)
      vars:
        # Nur der ROUTEN-BODY, ohne die Kommentar-Bloecke (die nennen
        # `basic_auth`/`handle /*` ebenfalls und wuerden die Pruefung aufweichen).
        server_route: >-
          {{ (lookup('file', render_dir ~ '/rift-caddy.Caddyfile')
              | split('handle /server/*'))[1] | split('handle /*') | first }}
        tournament_route: >-
          {{ (lookup('file', render_dir ~ '/rift-caddy.Caddyfile')
              | split('handle_path /tournament/*'))[1] | split('# Server-Control') | first }}
        empty_token_route: >-
          {{ (lookup('file', render_dir ~ '/rift-caddy-empty-token.Caddyfile')
              | split('handle /server/*'))[1] | split('handle /*') | first }}
      assert:
        that:
          # 401 vom Caddy (Challenge), nicht vom Agenten: Basic-Auth liegt hier.
          - "'basic_auth' in server_route"
          # Der Credential-Hash ist DERSELBE wie im Cockpit-Root-Block
          # (gleicher Realm → der Browser schickt die Credentials auch hierhin).
          - "contract_basic_auth_hash in server_route"
          # Bearer wird von Caddy gesetzt — kein Token im Browser/JS.
          - '(''Authorization "Bearer '' ~ server_control_token ~ ''"'') in server_route'
          - "server_control_token | length > 0"
          - "(('reverse_proxy 127.0.0.1:' ~ server_control_port) in server_route)"
          # Leerer Token (main-Template: `{% if server_control_token %}`): dann
          # KEIN header_up, aber die Basic-Auth bleibt (fail-closed).
          - "'header_up' not in empty_token_route"
          - "'basic_auth' in empty_token_route"
          # Abgrenzung (Issue #298): /tournament/* bleibt unangetastet.
          - "'basic_auth' not in tournament_route"
        fail_msg: >-
          rift-caddy.Caddyfile.j2 ist fuer /server/* falsch verdrahtet (Issue
          #454). Erwartet: `basic_auth { operator <hash> }` (wie der
          Cockpit-Root) UND `header_up Authorization "Bearer <token>"` im
          reverse_proxy. Ohne Basic-Auth kommt der Browser nicht am Caddy
          vorbei (401 vom Agenten); ohne injizierten Bearer erreicht Caddy den
          Agenten nicht (401). Bei LEEREM Token muss der header_up dagegen
          FEHLEN (Jinja-`if` auf server_control_token) — ein literales `Bearer `
          lehnt der Agent ab. /tournament/* darf dabei KEIN basic_auth
          bekommen (eigene Haertung, #298).
        success_msg: >-
          /server/* hinter der Operator-Basic-Auth, Bearer wird von Caddy
          injiziert (kein Token im Browser), leeres Token = kein header_up —
          /tournament/* unveraendert.

    # Regression-Guard Issue #463: im dev-Render (server_control_enabled=true)
    # MUSS die /server/*-Route da sein — sonst sieht check-render etwas anderes
    # als das echte dev-Play. (Die prod-Abwesenheit + die Port-Zuordnung deckt
    # deploy/tests/server-control-route/run.sh hermetisch ab.)
    - name: rift-caddy — /server/*-Route im dev-Render vorhanden (Issue 463)
      assert:
        that:
          - "'handle /server/*' in (lookup('file', render_dir ~ '/rift-caddy.Caddyfile'))"
        fail_msg: >-
          Der dev-Render des Cockpit-Caddyfiles enthaelt keine /server/*-Route.
          dev deployt den server-control-Agenten (site.yml) — die Route muss
          gerendert sein (Issue #463).
        success_msg: "/server/*-Route im dev-Render vorhanden."
