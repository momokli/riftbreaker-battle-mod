---
# Rolle: dedicated-server-image (Issue #241) — baut rb-dedicated:<deploy-sha>
# auf dem Zielhost. Das Image ist die Wine-Laufzeit für :6321.
#
# Idempotenz: Der Tag ist der Deploy-SHA. Existiert das Image bereits, kein
# Build; sonst greift der Docker-Layer-Cache. Vor dem Containerstart wird hart
# geprüft, dass das Image existiert.

- name: Build-Kontext-Verzeichnis sicherstellen
  file:
    path: "{{ dedicated_server_context_dir }}"
    state: directory
    mode: "0755"

- name: Build-Kontext synchronisieren (tools/dedicated-server)
  copy:
    src: "{{ playbook_dir }}/../tools/dedicated-server/"
    dest: "{{ dedicated_server_context_dir }}/"
    mode: preserve
    directory_mode: "0755"
  register: dedicated_server_context

# Read-only-Abfrage, läuft auch im --check (check_mode: false).
- name: Image-Existenz prüfen (rb-dedicated:{{ deploy_image_tag }})
  command: docker image inspect "{{ dedicated_server_image }}"
  register: dedicated_server_image_info
  changed_when: false
  failed_when: false
  check_mode: false

- name: Dedicated-Server-Image bauen (nur bei fehlendem Tag)
  command: >-
    docker build --tag {{ dedicated_server_image }} {{ dedicated_server_context_dir }}
  when: dedicated_server_image_info.rc != 0
  register: dedicated_server_build
  changed_when: dedicated_server_build.rc == 0
  failed_when: dedicated_server_build.rc != 0

- name: Image garantiert vorhanden, bevor Container starten
  assert:
    that:
      - dedicated_server_image_info.rc == 0
        or (dedicated_server_build.rc | default(1)) == 0
    fail_msg: >-
      Image {{ dedicated_server_image }} fehlt und wurde nicht erfolgreich
      gebaut — Containerstart wird abgebrochen. Kontext:
      {{ dedicated_server_context_dir }}
  when: not ansible_check_mode
