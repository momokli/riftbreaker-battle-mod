---
# Handler der Rolle website.
#
# `restart rift-caddy`: entfällt — der eigene Rift-Caddy wird direkt im Task
# "Rift-Caddy starten" recreated (bei geänderter Config `--force-recreate`),
# damit `caddy validate`/Health im selben Durchlauf die NEUE Instanz prüfen
# (Review #326, Finding 1) und nicht erst ein Handler am Play-Ende.
#
# `validate`/`reload host caddy`: der Host-Caddy hostet viele fremde Domains —
# deshalb erst validieren, dann reload. Ein `caddy reload` ist atomar: schlägt
# er fehl, läuft die alte Config weiter. Reihenfolge = Reihenfolge in dieser
# Datei (Ansible führt benachrichtigte Handler in Definitionsreihenfolge aus).

- name: validate host caddy
  command: docker exec {{ website_host_caddy_container }} caddy validate --config /etc/caddy/Caddyfile
  changed_when: false

- name: reload host caddy
  command: docker exec {{ website_host_caddy_container }} caddy reload --config /etc/caddy/Caddyfile
  changed_when: false
