---
# Rolle: website — eigener Rift-Caddy-Container (Landing: file_server +
# /mod.zip; Cockpit: /contract/* + /tournament/*) + ZWEI Einträge im geteilten
# Host-Caddy. Idempotent. Die Rolle ist per-Environment als "Twin"
# parametriert: {{ landing_domain }}, {{ cockpit_domain }},
# {{ rift_caddy_container }} und {{ rift_caddy_port }} kommen aus den Env-Vars
# (dev und prod je eigener Container/Port/Domain).
#
# Architektur (Issue #322):
#   {{ landing_domain }} → Host-Caddy (mellon-caddy)
#                           └─ reverse_proxy 127.0.0.1:{{ rift_caddy_port }}
#                                 └─ rift-caddy (eigener Container, plain HTTP)
#                                      └─ file_server {{ rift_caddy_site_root }} (Landing + /mod.zip)
#   {{ cockpit_domain }} → Host-Caddy (mellon-caddy)
#                           └─ reverse_proxy 127.0.0.1:{{ rift_caddy_port }}
#                                 └─ rift-caddy (eigener Container, plain HTTP)
#                                      ├─ handle_path /tournament/* → 127.0.0.1:{{ tournament_port }}
#                                      └─ handle_path /contract/*  → 127.0.0.1:{{ riftbreaker_bridge_port }}
#
# Der geteilte Host-Caddy bekommt GENAU ZWEI (idempotente) Einträge — je
# Domain einen (per-Domain-Marker, damit dev und prod nicht kollidieren) — kein
# Caddyfile.d-Mount, keine Import-Zeile mehr. Die frühere, manuell gepflegte
# Rift-Block- und Import-Zeile sowie verwaiste operator.*-Einträge werden
# entfernt, damit Caddyfile und Rolle übereinstimmen (kein Parallel-Block).

- name: Docroot sicherstellen
  file:
    path: "{{ website_docroot }}"
    state: directory
    mode: "0755"

- name: Mods-Verzeichnis sicherstellen
  file:
    path: "{{ website_mods_dir }}"
    state: directory
    mode: "0755"

- name: Statische Landing deployen (site/*)
  copy:
    src: "{{ playbook_dir }}/../site/"
    dest: "{{ website_docroot }}"
    mode: "0644"

# ---------------------------------------------------------------------------
# Eigener Rift-Caddy (Issue #322): Container + Config im Rift-Stack. Zuert
# aufbauen und validieren, danach erst den Host-Caddy umbiegen — so gibt es
# kein Fenster, in dem der Host-Eintrag auf einen toten Port zeigt.
# ---------------------------------------------------------------------------
- name: Rift-Caddy Deploy-Verzeichnis sicherstellen
  file:
    path: "{{ rift_caddy_deploy_dir }}"
    state: directory
    mode: "0755"

- name: Rift-Caddy Daten-/Config-Verzeichnis sicherstellen
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ rift_caddy_data_dir }}"
    - "{{ rift_caddy_config_dir }}"

- name: Rift-Caddy Caddyfile rendern
  template:
    src: rift-caddy.Caddyfile.j2
    dest: "{{ rift_caddy_deploy_dir }}/Caddyfile"
    mode: "0644"
  register: rift_caddy_caddyfile

- name: Rift-Caddy docker-compose.yml rendern
  template:
    src: docker-compose.yml.j2
    dest: "{{ rift_caddy_deploy_dir }}/docker-compose.yml"
    mode: "0644"
  register: rift_caddy_compose

# Re-Deploy-Fall (Review #326, Finding 1): `docker compose up -d` recreated einen
# laufenden Container bei reiner Config-Änderung NICHT — der Bind-Mount zeigt die
# neue Datei, der laufende Caddy lädt sie aber erst beim Recreate. Ohne Recreate
# prüften `caddy validate`/Health die ALTE Instanz. Deshalb hier — VOR
# Validate/Health — bei geänderter Config `--force-recreate` fahren; der
# Erst-Deploy wird ohnehin neu erstellt. Bei unveränderter Config bleibt es beim
# idempotenten `up -d` (kein unnötiger Neustart).
- name: Rift-Caddy starten (Recreate nur bei geänderter Config)
  command: >-
    docker compose -f {{ rift_caddy_deploy_dir }}/docker-compose.yml
    up -d --remove-orphans
    {{ '--force-recreate' if (rift_caddy_caddyfile.changed or rift_caddy_compose.changed) else '' }}
  changed_when: false
  when: not ansible_check_mode

- name: Rift-Caddy Konfiguration validieren (caddy validate)
  command: docker exec {{ rift_caddy_container }} caddy validate --config /etc/caddy/Caddyfile
  changed_when: false
  when: not ansible_check_mode

- name: Rift-Caddy erreichbar? (lokaler Health über 127.0.0.1)
  uri:
    url: "http://127.0.0.1:{{ rift_caddy_port }}/tournament/health"
    headers:
      Host: "{{ cockpit_domain }}"
    status_code: 200
  register: rift_caddy_health
  retries: 5
  delay: 2
  until: rift_caddy_health.status == 200
  changed_when: false
  when: not ansible_check_mode

# ---------------------------------------------------------------------------
# Geteilter Host-Caddy: genau ZWEI Einträge (Landing + Cockpit). Alte manuelle
# Rift-Definition, verwaiste operator.*-Einträge und die Snippet-Import-Zeile
# zuerst entfernen (sonst kollidiert die Domain bzw. schlägt der Glob-Import
# ins leere Verzeichnis fehl).
#
# Reload deterministisch + fehlersichtbar (Issue #355): Der Reload hing zuvor
# NUR als Handler am `changed` der Datei-Tasks. Ein beim ersten Deploy
# fehlgeschlagener Reload wurde dadurch bei jedem weiteren (idempotenten) Lauf
# nie erneut versucht — der Deploy meldete still `ok`, während die live-Config
# veraltet blieb (#322: /tournament/health 404 trotz korrektem Caddyfile auf
# Disk). Deshalb prueft jetzt JEDER Lauf die LIVE-Config ueber die Admin-API und
# reloadet, sobald der Domain-Eintrag dort fehlt; validate/reload und der
# Post-Check brechen den Deploy bei Fehlschlag ab (kein stilles `ok`).
#
# Der Reload dialt `localhost:2019`; damit er den RICHTIGEN Prozess trifft,
# darf kein zweiter host-net-Container diesen Port belegen — deshalb bekommt der
# rift-caddy in seinem Caddyfile `admin off` (siehe rift-caddy.Caddyfile.j2).
# ---------------------------------------------------------------------------
- name: Alten manuell gepflegten Rift-Block aus dem Host-Caddyfile entfernen
  replace:
    path: "{{ website_host_caddyfile_path }}"
    regexp: '(?ms)^# BEGIN RIFT PROJECTMELLON MODS.*?^# END RIFT PROJECTMELLON MODS\n?'
    replace: ""
  register: host_caddy_old_block

- name: Verwaiste Snippet-Import-Zeile aus dem Host-Caddyfile entfernen
  lineinfile:
    path: "{{ website_host_caddyfile_path }}"
    line: "import /etc/caddy/Caddyfile.d/*"
    state: absent
  register: host_caddy_import

# Zwei HTTP-Domain-Einträge ({{ landing_domain }} + {{ cockpit_domain }})
# werden hier geroutet. Der Game-Server-Host läuft ausschliesslich über UDP
# (riftbreaker_server_port_udp, dev 6321 / prod 6322) und bekommt KEINEN
# Caddy-/HTTP-Eintrag — der Host-Caddy reicht nur Landing und Operator-Cockpit
# (/contract, /tournament) durch.
#
# Verwaiste operator.*-Einträge aus der vorherigen Cockpit-only-Verdrahtung
# entfernen (einmalige Migration; idempotent, wenn bereits weg).
- name: Alten operator.*-Host-Caddy-Eintrag entfernen (vor Umbenennung)
  replace:
    path: "{{ website_host_caddyfile_path }}"
    regexp: '(?ms)^# BEGIN RIFT operator\.(?:drift|rift)\.projectmellon\.de \(managed by deploy/roles/website\).*?^# END RIFT operator\.(?:drift|rift)\.projectmellon\.de \(managed by deploy/roles/website\)\n?'
    replace: ""
  register: host_caddy_operator_cleanup

- name: Host-Caddy-Eintrag sicherstellen (Landing)
  blockinfile:
    path: "{{ website_host_caddyfile_path }}"
    marker: "# {mark} RIFT {{ landing_domain }} (managed by deploy/roles/website)"
    owner: "{{ website_host_caddyfile_owner }}"
    group: "{{ website_host_caddyfile_group }}"
    mode: "0644"
    block: |
      {{ landing_domain }} {
          reverse_proxy 127.0.0.1:{{ rift_caddy_port }}
      }
  register: host_caddy_landing_block

- name: Host-Caddy-Eintrag sicherstellen (Cockpit)
  blockinfile:
    path: "{{ website_host_caddyfile_path }}"
    marker: "# {mark} RIFT {{ cockpit_domain }} (managed by deploy/roles/website)"
    owner: "{{ website_host_caddyfile_owner }}"
    group: "{{ website_host_caddyfile_group }}"
    mode: "0644"
    block: |
      {{ cockpit_domain }} {
          reverse_proxy 127.0.0.1:{{ rift_caddy_port }}
      }
  register: host_caddy_cockpit_block

# LIVE-Config des Host-Caddys ueber die Admin-API lesen (nur 127.0.0.1 im
# Container). Grundlage fuer die Reload-Entscheidung unten.
- name: Host-Caddy — LIVE-Config ueber die Admin-API lesen
  command: docker exec {{ website_host_caddy_container }} wget -qO- http://localhost:2019/config/
  register: host_caddy_live
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# Reload nur, wenn noetig: Datei geaendert ODER die LIVE-Config fuehrt den
# Domain-Eintrag (noch) nicht — Letzteres faengt einen frueher fehlgeschlagenen
# Reload ab, ohne die idempotenten Folge-Deploys mit einem Blind-Reload zu
# belasten.
- name: Host-Caddy — Reload erforderlich? (Datei geaendert ODER Eintrag fehlt live)
  set_fact:
    host_caddy_needs_reload: >-
      {{ (host_caddy_old_block is changed)
         or (host_caddy_import is changed)
         or (host_caddy_operator_cleanup is changed)
         or (host_caddy_landing_block is changed)
         or (host_caddy_cockpit_block is changed)
         or ((host_caddy_live.rc | default(1) | int) != 0)
         or (landing_domain not in (host_caddy_live.stdout | default('')))
         or (cockpit_domain not in (host_caddy_live.stdout | default(''))) }}
  when: not ansible_check_mode

- name: Host-Caddy — Config validieren (vor dem Reload)
  command: docker exec {{ website_host_caddy_container }} caddy validate --config /etc/caddy/Caddyfile
  changed_when: false
  when: not ansible_check_mode and (host_caddy_needs_reload | default(false) | bool)

# Bewusst KEIN `failed_when: false`/`ignore_errors`: ein non-zero rc bricht den
# Deploy ab (kein stilles `ok`).
- name: Host-Caddy — reload (rc != 0 bricht den Deploy ab)
  command: docker exec {{ website_host_caddy_container }} caddy reload --config /etc/caddy/Caddyfile
  changed_when: true
  when: not ansible_check_mode and (host_caddy_needs_reload | default(false) | bool)

# Post-Check: nach dem Reload MUSS der Eintrag live sein. Fehlt er (oder war die
# Admin-API nicht lesbar), schlaegt der Deploy hier sichtbar fehl.
- name: Host-Caddy — Reload wirksam? (Domains müssen JETZT live sein)
  command: docker exec {{ website_host_caddy_container }} wget -qO- http://localhost:2019/config/
  register: host_caddy_live_after
  changed_when: false
  failed_when: >-
    (host_caddy_live_after.rc | default(1) | int) != 0
    or (landing_domain not in (host_caddy_live_after.stdout | default('')))
    or (cockpit_domain not in (host_caddy_live_after.stdout | default('')))
  when: not ansible_check_mode and (host_caddy_needs_reload | default(false) | bool)
