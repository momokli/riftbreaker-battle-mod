---
# Defaults der Rolle website (eigener rift-caddy + ZWEI Host-Eintraege: Landing + Cockpit).
#
# Issue #322: Der Riftbreaker-Stack hat einen EIGENEN Caddy-Container
# (`rift-caddy`, plain HTTP, reines Durchreichen) für die statische Landing
# (+ /mod.zip) und die /tournament/*-/contract/*-Proxies. Der geteilte
# Host-Caddy (`mellon-caddy`) bekommt genau ZWEI Eintraege
# (`landing_domain` + `cockpit_domain` → reverse_proxy 127.0.0.1:<port>) —
# kein `Caddyfile.d`-Mount, keine Snippet-Import-Zeile mehr.
#
# Die planet-spezifischen Werte (Domains, Pfade, Ports, Container-Namen) stehen
# in deploy/inventory/host_vars/planet/vars.yml; diese Defaults liefern nur
# generische Fallbacks, damit Templates auch ohne Host-Vars renderbar sind.

landing_domain: www.rift.projectmellon.de
cockpit_domain: cockpit.rift.projectmellon.de
website_docroot: /srv/rbmods-site
website_mods_dir: "{{ website_docroot }}/mods"

# Eigener Rift-Caddy.
rift_caddy_container: rift-caddy
rift_caddy_image: caddy:2
rift_caddy_port: 8787
rift_caddy_deploy_dir: /opt/rbmods/compose/rift-caddy
rift_caddy_data_dir: "{{ rift_caddy_deploy_dir }}/data"
rift_caddy_config_dir: "{{ rift_caddy_deploy_dir }}/config"
rift_caddy_site_root: /srv/site

# /contract (Bridge-Kontrollpanel): basic_auth-Schutz (operator). bcrypt-Hash
# von "zukka"; als Default unkritisch, kein Vault nötig.
contract_basic_auth_hash: "$2a$14$TSQCK7adF/aDuDzaRGY8wum3034v2huWYk9g9JPRCggLDugyHyZVm"

# Server-Control-Bearer (Issue #454, Token-Quelle #451): Der rift-caddy proxyt
# /server/* an den Host-Agenten und muss dessen Bearer-Token selbst setzen —
# ein Browser kann ihn nicht senden. Quelle ist ausschliesslich der Vault
# (`vault_server_control_token`, siehe Rolle server-control); leer = KEIN
# `header_up` im Caddyfile (der Agent lehnt ein leeres `Bearer ` ab).
server_control_token: "{{ vault_server_control_token | default('') }}"

# Geteilter Host-Caddy.
website_host_caddy_container: mellon-caddy
website_host_caddyfile_path: /home/momo/Caddyfile
website_host_caddyfile_owner: momo
website_host_caddyfile_group: momo
