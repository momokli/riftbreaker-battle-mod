---
# Defaults der Rolle website (eigener rift-caddy + Host-Eintraege: Landing +
# Cockpit + GNS-Lobby).
#
# Issue #322: Der Riftbreaker-Stack hat einen EIGENEN Caddy-Container
# (`rift-caddy`, plain HTTP, reines Durchreichen) für die statische Landing
# (+ /mod.zip) und die /tournament/*-/contract/*-Proxies. Der geteilte
# Host-Caddy (`mellon-caddy`) bekommt genau ZWEI Eintraege
# `landing_domain` + `cockpit_domain` → reverse_proxy 127.0.0.1:<port>) —
# kein `Caddyfile.d`-Mount, keine Snippet-Import-Zeile mehr. Dazu (Issue #857)
# ein DRITTER, env-unabhaengiger Eintrag `proxy_domain` (GNS-Lobby) direkt auf
# die Relay-API.
#
# Die planet-spezifischen Werte (Domains, Pfade, Ports, Container-Namen) stehen
# in deploy/inventory/host_vars/planet/vars.yml; diese Defaults liefern nur
# generische Fallbacks, damit Templates auch ohne Host-Vars renderbar sind.

landing_domain: www.rift.projectmellon.de
cockpit_domain: cockpit.rift.projectmellon.de

# GNS-Lobby (Issue #857): die Operator-Web-UI des GNS-Entry-Relays auf planet.
# Der Relay ist ein SINGLETON (ein Prozess besitzt den client-hardgewireten
# Einstiegsport 6321) — daher EINE feste Domain, identisch in dev/prod/staging,
# mit identischem Host-Caddy-Block (idempotent, kein Env-Twin). Der Block zeigt
# DIREKT auf die Relay-API ({{ proxy_upstream }}, 127.0.0.1), NICHT ueber einen
# per-Env rift-caddy: die Lobby gehoert dem Relay, nicht einem Environment.
# Trotzdem geschuetzt (basic_auth), weil der Relay hinter dem Entry-Port sitzt
# und die API selbst keine Auth hat.
proxy_domain: proxy.rift.projectmellon.de
proxy_upstream: "127.0.0.1:9200"
# Eigener, host-konstanter Vault-Wert (Issue #535): die Lobby gehoert dem
# Relay-Singleton (ein Block, ein Marker) und wird von KEINEM Env-Play
# ueberschrieben. Frueher leitete sie den Hash vom per-Env gewordenen
# contract_basic_auth_hash ab -> dev/prod haetten denselben Marker mit
# verschiedenen Hashes geschrieben (Host-Caddyfile-Flap, nicht idempotent).
# Fallback = Legacy-Hash, damit die Host-Caddyfile zunaechst byte-identisch
# bleibt; Rotation laeuft ausschliesslich ueber den Vault-Wert.
proxy_basic_auth_hash: "{{ vault_proxy_basic_auth_hash | default(contract_basic_auth_hash_legacy_shared) }}"
website_docroot: /srv/rbmods-site
website_mods_dir: "{{ website_docroot }}/mods"

# Deploy-Identitaet (Issue #483, US4): Fallbacks fuer Renderer/Tests, die ohne
# die Plays laufen (check-render, Hermetik-Tests). Die echten Plays setzen
# rift_env als Play-Var; rift_deploy_ref/rift_deploy_identity kommen aus
# deploy/tasks/deploy-identity.yml (set_fact schlaegt diese Defaults).
rift_env: unknown
rift_deploy_ref: unknown
rift_deploy_identity: "{{ rift_env }} · {{ rift_deploy_ref }}"

# Eigener Rift-Caddy.
rift_caddy_container: rift-caddy
rift_caddy_image: caddy:2
# Container-Log-Limit (Issue #301): json-file-Rotation, damit die
# Container-Logs (/var/lib/docker/containers/*/*-json.log) nicht unbegrenzt
# wachsen. Konfigurierbar per host_vars / `-e`.
rift_caddy_log_max_size: "10m"
rift_caddy_log_max_file: "3"
rift_caddy_port: 8787
rift_caddy_deploy_dir: "/opt/rbmods/compose/rift-{{ rift_env }}/caddy"
rift_caddy_data_dir: "{{ rift_caddy_deploy_dir }}/data"
rift_caddy_config_dir: "{{ rift_caddy_deploy_dir }}/config"
rift_caddy_site_root: /srv/site

# Server-Control-Route im Cockpit (/server/*): nur rendern, wenn dieses Play
# den server-control-Agenten wirklich deployt (Issue #463). Default false =
# fail-safe: ohne Agent zeigt die Route sonst auf 127.0.0.1:<server_control_port>
# und traefe dort einen FREMDEN Agenten (auf planet den dev-Agenten).
# Gesetzt wird das Flag im jeweiligen PLAY (site.yml true, deploy-prod.yml
# true, Issue #498) — Play-Vars schlagen diese Defaults, waehrend die host_vars
# fuer dev UND prod gelten und deshalb hier nicht taugen.
server_control_enabled: false

# /contract (Bridge-Kontrollpanel): basic_auth-Schutz (operator).
#
# Issue #535: Der Operator-Hash ist je Env getrennt. Die Plays deploy-prod.yml
# (vault_contract_basic_auth_hash_prod) und deploy-staging.yml
# (vault_contract_basic_auth_hash_staging) setzen `contract_basic_auth_hash`
# per Play-Var OHNE Fallback (fehlt die Vault-Var -> undefiniert -> Render
# bricht laut ab, fail-closed). dev/test/local setzen keinen Play-Var und
# bekommen daher byte-identisch den Legacy-Hash (bcrypt "zukka") — dieselben
# Render-Pfade wie zuvor bleiben gruen.
#
# Der Legacy-Hash ist NUR noch benannte Konstante (Vergleichsbasis fuer den
# Distinctness-Assert in tasks/main.yml) und Fallback — kein zweites Literal
# im Rollen-/Play-Pfad.
contract_basic_auth_hash_legacy_shared: "$2a$14$TSQCK7adF/aDuDzaRGY8wum3034v2huWYk9g9JPRCggLDugyHyZVm"
contract_basic_auth_hash: "{{ vault_contract_basic_auth_hash | default(contract_basic_auth_hash_legacy_shared) }}"

# Server-Control-Bearer (Issue #454, Token-Quelle #451): Der rift-caddy proxyt
# /server/* an den Host-Agenten und muss dessen Bearer-Token selbst setzen —
# ein Browser kann ihn nicht senden. Quelle ist ausschliesslich der Vault
# (`vault_server_control_token` fuer dev; prod setzt den Wert per Play-Var auf
# `vault_server_control_prod_token`, siehe deploy-prod.yml); leer = KEIN
# `header_up` im Caddyfile (der Agent lehnt ein leeres `Bearer ` ab).
server_control_token: "{{ vault_server_control_token | default('') }}"

# Tournament-Bearer (Issue #298, Token-Quelle #298): Der rift-caddy proxyt die
# SCHREIBENDEN /tournament/*-Pfade und muss den Bearer der Tournament-API selbst
# setzen — ein Browser kann ihn nicht senden. Quelle ist ausschliesslich der
# Vault (`vault_tournament_token`, dieselbe Quelle wie Rust + Queue); leer =
# KEIN `header_up` im Caddyfile (kein literales `Bearer `).
tournament_token: "{{ vault_tournament_token | default('') }}"

# Geteilter Host-Caddy.
website_host_caddy_container: mellon-caddy
website_host_caddyfile_path: /home/momo/Caddyfile
website_host_caddyfile_owner: momo
website_host_caddyfile_group: momo
