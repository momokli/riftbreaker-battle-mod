---
# Rolle: vanilla-server — zweite Instanz ohne Mods (6322). Nutzt dasselbe
# headless-client-Image wie :6321 (einmal bauen reicht).

- name: Game-Verzeichnis sicherstellen
  file:
    path: "{{ vanilla_game_dir }}"
    state: directory
    mode: "0755"

- name: Deploy-Verzeichnis für Compose anlegen
  file:
    path: "{{ vanilla_deploy_dir }}"
    state: directory
    mode: "0755"

# Fehlerklasse „Container-Name belegt" — siehe riftbreaker-server (Issue #209).
- name: Bestehenden Container mit unserem Namen prüfen (Fremd-Belegung?)
  # `docker container inspect` — nur Container (nicht gleichnamige Images).
  command: >-
    docker container inspect --format '{% raw %}{{ index .Config.Labels "com.docker.compose.project" }}{% endraw %}'
    {{ vanilla_container }}
  register: vanilla_container_owner
  changed_when: false
  failed_when: false
  check_mode: false

- name: Container-Name gehört uns (oder ist frei)
  assert:
    that:
      - "(vanilla_container_owner.rc != 0) or ((vanilla_container_owner.stdout | trim) in ['', vanilla_compose_project])"
    fail_msg: >-
      Container-Name '{{ vanilla_container }}' ist von einem fremden Projekt
      belegt (Label com.docker.compose.project='{{ vanilla_container_owner.stdout | trim }}').
      Vor dem Deploy entfernen (docker rm -f {{ vanilla_container }}).

- name: docker-compose.yml rendern
  template:
    src: docker-compose.yml.j2
    dest: "{{ vanilla_deploy_dir }}/docker-compose.yml"
    mode: "0600"
  register: vanilla_compose

- name: Container sicherstellen (docker compose up -d, idempotent)
  command: docker compose -f {{ vanilla_deploy_dir }}/docker-compose.yml up -d --remove-orphans
  register: vanilla_up
  changed_when: >-
    ('Recreated' in vanilla_up.stdout)
    or ('Created' in vanilla_up.stdout)
    or ('Started' in vanilla_up.stdout)
