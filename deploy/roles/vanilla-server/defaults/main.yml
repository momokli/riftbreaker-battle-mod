---
# Defaults der Rolle vanilla-server (kein Mod, schnelle Test-Joins).
vanilla_deploy_dir: /opt/rbmods/compose/rb-winetest

# Compose-Projektname = Verzeichnisname (kein explizites `name:` im Compose).
vanilla_compose_project: "{{ vanilla_deploy_dir | basename }}"

# Vanilla-Server-Kommando — kein Mod, kein Content-Version-Check-Override.
# Passwort kommt aus dem Vault (riftbreaker_server_password).
vanilla_server_command:
  - "{{ vanilla_server_exe }}"
  - "headless_mode=1"
  - "cli=1"
  - "app_mode=server"
  - "campaign={{ vanilla_server_campaign }}"
  - "mission={{ vanilla_server_mission }}"
  - "difficulty={{ vanilla_server_difficulty }}"
  - "disable_steam=1"
  - "password={{ riftbreaker_server_password }}"
vanilla_server_extra_args: []
