---
# Defaults der Rolle satellite-relay (Issue #328).
#
# UDP-"IP-Lender"-Relay auf dem Satellite: reicht inbound UDP auf
# satellite_relay_port per DNAT an satellite_relay_target_host:target_port
# weiter. Löst das clientseitig effektiv hardgewirete Port-6321-Problem
# (vgl. #290/#328): der Client wählt weiter 6321 an, die Port-Übersetzung
# passiert hier auf Netz-Ebene, wo das Spiel sie nicht mitbekommt.
#
# Nur Core-Module (kein community.general-Dependency) — konsistent mit dem
# Rest von deploy/.
#
# EINZIGE QUELLE der satellite_relay_*-Werte (Issue #328, Review #329): bewusst
# KEINE host_vars/satellite/, sonst würde host_vars die Defaults still
# überschreiben (Precedence). Die Rolle lief ursprünglich nur gegen den Host
# `satellite`; sie dient jetzt ZUSÄTZLICH dem Host `sync` als zweites UDP-
# Relay (sync:6321 -> planet:6323) — dort wird `satellite_relay_target_port`
# auf Play-Ebene (deploy/deploy-staging.yml, Play 2) auf 6323 gesetzt,
# während `satellite_relay_target_host` (65.21.27.234) und
# `satellite_relay_interface` (eth0) die Rollen-Defaults bleiben (für sync
# ebenfalls korrekt). Der Default `satellite_relay_target_port: 6322` bleibt
# der satellite/prod-Wert. Falls host-spezifische Abweichungen nötig werden,
# hier ändern.
#
# Bewusste Design-Grenzen (nicht-blockierende Review-Hinweise #329):
#   * Das Relay-Script fügt Regeln idempotent HINZU, entfernt aber keine
#     veralteten: bei Port-/Ziel-Wechsel können alte PREROUTING/POSTROUTING-
#     Regeln stehen bleiben. Für einen dedizierten „IP-Lender“ bewusst so.
#   * DNAT-PREROUTING ist nicht auf Ingress-Interface/Source eingeschränkt und
#     MASQUERADE nicht auf -o {{ satellite_relay_interface }} begrenzt — der Host
#     ist ausschließlich Relay, daher bewusst ohne Einschränkung.
#
# Inbound-UDP-Port auf dem Satellite (der Port, den der Client anwählt).
satellite_relay_port: 6321

# Ziel: Host + Port der weiterzureichenden Instanz (planet prod = :6322).
satellite_relay_target_host: 65.21.27.234
satellite_relay_target_port: 6322

# Egress-Interface (für `ufw route` + MASQUERADE-Rückweg).
satellite_relay_interface: eth0
