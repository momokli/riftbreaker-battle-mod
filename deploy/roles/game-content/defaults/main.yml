---
# Defaults der Rolle game-content (Issue #209).
#
# Provisioniert den Dedicated-Server-Content (Steam-App 4114030) deklarativ und
# idempotent in riftbreaker_game_dir. Primär: SteamCMD anonym. Alternativen:
# idempotenter Sync aus einem kanonischen Cache (riftbreaker_content_mode=sync)
# oder ein vorbereitetes HTTP-Bundle inkl. privater PDB (mode=http, Issue #566).

# steamcmd | sync | http
riftbreaker_content_mode: steamcmd

# Steam-App-ID des Dedicated-Servers (Steam-Layout: Binary in bin/).
riftbreaker_app_id: "4114030"

# Binary, an dem der Content als "vorhanden" erkannt wird (Steam-Layout).
riftbreaker_server_bin: bin/DedicatedServer.exe

# SteamCMD-Installation (Self-Bootstrap; auf Ubuntu 24.04 kein Distro-Paket).
steamcmd_dir: /opt/steamcmd
steamcmd_url: https://media.steampowered.com/client/installer/steamcmd_linux.tar.gz

# Kanonischer Cache für den Sync-Fallback (nur bei mode=sync genutzt): ein
# vollständiger Steam-Stand der App, z. B. der frühere Community-Checkout.
riftbreaker_content_cache_dir: /srv/riftbreaker/data/server

# --- HTTP-Bundle (nur bei mode=http) ----------------------------------------
# Vorbereitetes Content-Bundle + die volle PRIVATE PDB (fürs Crash-Symbolik-
# Modul, Issue #480/#566) von planet — Alternative zu SteamCMD ohne
# distro-spezifische 32-bit-Abhängigkeiten. Struktur des Archivs geprüft
# (2026-09-16, Checksum verifiziert): Top-Level `./bin/DedicatedServer.exe`
# passt 1:1 zu riftbreaker_server_bin; `./bin/riftbreaker_dll_win_release.dll`
# ist enthalten, die PDB NICHT (kommt separat, s. u.).
riftbreaker_content_http_base: https://www.drift.projectmellon.de/downloads
riftbreaker_content_http_archive: riftbreaker-game-content.tar.gz
riftbreaker_content_http_pdb: riftbreaker_dll_win_release.pdb
riftbreaker_content_http_checksums: SHA256SUMS
# Download-Staging (get_url ist selbst idempotent: kein Re-Download, wenn die
# Datei am Ziel schon mit der Checksumme übereinstimmt).
riftbreaker_content_http_download_dir: /opt/rbmods/content-downloads

# Mit `-e riftbreaker_content_force=true` erzwingt ein app_update auch bei
# vorhandenem Content (z. B. Patch). Default false = nur installieren, wenn fehlt.
riftbreaker_content_force: false
