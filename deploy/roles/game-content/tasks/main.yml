---
# Rolle: game-content (Issue #209) — Dedicated-Server-Content bereitstellen.
#
# Deklarativ + idempotent: fehlt das Server-Binary, wird der Content gezogen;
# ist er da, ist der Lauf ein billiger No-Op. Konvergiert nach `rm -rf` des
# Game-Dirs (Binary weg -> Neubeschaffung).
#
# Fail loud: schlägt SteamCMD fehl oder fehlt das Binary danach, bricht der
# Deploy ab — kein stiller Skip. Fallback (Sync aus kanonischem Cache) ist
# dokumentiert und über riftbreaker_content_mode=sync aktivierbar.

# --- SteamCMD (nur im Modus steamcmd) ---------------------------------------
# 32-bit-Laufzeitabhängigkeit von steamcmd.sh — der Mechanismus ist
# distro-abhängig (Debian: dpkg-Multiarch + apt; RedHat-Familie: dnf-Multilib
# direkt über das .i686-Suffix, kein separater "Architektur freischalten"-
# Schritt nötig). Issue #566: Solo-Dev-Rechner sind nicht zwangsläufig
# Debian/Ubuntu (planet ist es; das lokale Setup soll auch auf Fedora/RHEL
# laufen).

# --- Debian/Ubuntu -----------------------------------------------------
- name: Fremd-Architekturen prüfen (32-bit-libs für SteamCMD, Debian)
  command: dpkg --print-foreign-architectures
  register: rbbattle_foreign_arch
  changed_when: false
  check_mode: false
  when:
    - riftbreaker_content_mode == 'steamcmd'
    - ansible_os_family == 'Debian'

- name: i386-Architektur freischalten (SteamCMD braucht lib32gcc-s1, Debian)
  command: dpkg --add-architecture i386
  when:
    - riftbreaker_content_mode == 'steamcmd'
    - ansible_os_family == 'Debian'
    - "'i386' not in (rbbattle_foreign_arch.stdout_lines | default([]))"
  changed_when: true

- name: apt-Cache aktualisieren (nach Architektur-Änderung, Debian)
  apt:
    update_cache: true
  when:
    - riftbreaker_content_mode == 'steamcmd'
    - ansible_os_family == 'Debian'
    - "'i386' not in (rbbattle_foreign_arch.stdout_lines | default([]))"

- name: SteamCMD-Laufzeitabhängigkeit installieren (lib32gcc-s1, Debian)
  apt:
    name: lib32gcc-s1
    state: present
  when:
    - riftbreaker_content_mode == 'steamcmd'
    - ansible_os_family == 'Debian'

# --- Fedora/RHEL (dnf-Multilib, kein Architektur-Enable-Schritt nötig) --
- name: SteamCMD-Laufzeitabhängigkeiten installieren (glibc.i686/libstdc++.i686, RedHat)
  dnf:
    name:
      - glibc.i686
      - libstdc++.i686
    state: present
  when:
    - riftbreaker_content_mode == 'steamcmd'
    - ansible_os_family == 'RedHat'

- name: SteamCMD-Verzeichnis sicherstellen
  file:
    path: "{{ steamcmd_dir }}"
    state: directory
    mode: "0755"
  when: riftbreaker_content_mode == 'steamcmd'

- name: SteamCMD-Installation prüfen
  stat:
    path: "{{ steamcmd_dir }}/steamcmd.sh"
  register: rbbattle_steamcmd
  when: riftbreaker_content_mode == 'steamcmd'

- name: SteamCMD herunterladen
  get_url:
    url: "{{ steamcmd_url }}"
    dest: "{{ steamcmd_dir }}/steamcmd_linux.tar.gz"
    mode: "0644"
  when:
    - riftbreaker_content_mode == 'steamcmd'
    - not (rbbattle_steamcmd.stat.exists | default(false))

- name: SteamCMD entpacken
  unarchive:
    src: "{{ steamcmd_dir }}/steamcmd_linux.tar.gz"
    dest: "{{ steamcmd_dir }}"
    remote_src: true
  when:
    - riftbreaker_content_mode == 'steamcmd'
    - not (rbbattle_steamcmd.stat.exists | default(false))

- name: SteamCMD initialisieren (Selbst-Update, einmalig nach Installation)
  command: "{{ steamcmd_dir }}/steamcmd.sh +quit"
  register: rbbattle_steamcmd_boot
  changed_when: false
  when:
    - riftbreaker_content_mode == 'steamcmd'
    - not ansible_check_mode
    - not (rbbattle_steamcmd.stat.exists | default(false))

# --- Game-Verzeichnis + Content-Status --------------------------------------
- name: Game-Verzeichnis sicherstellen
  file:
    path: "{{ riftbreaker_game_dir }}"
    state: directory
    mode: "0755"

- name: Content-Status prüfen (Server-Binary)
  stat:
    path: "{{ riftbreaker_game_dir }}/{{ riftbreaker_server_bin }}"
  register: rbbattle_content_bin

- name: Dedicated-Server-Content installieren (SteamCMD, anonym, App {{ riftbreaker_app_id }})
  command: >-
    {{ steamcmd_dir }}/steamcmd.sh
    +force_install_dir {{ riftbreaker_game_dir }}
    +login anonymous
    +app_update {{ riftbreaker_app_id }} validate
    +quit
  register: rbbattle_steamcmd_update
  changed_when: "'Success! App' in (rbbattle_steamcmd_update.stdout | default(''))"
  failed_when: (rbbattle_steamcmd_update.rc | default(0)) != 0
  when:
    - riftbreaker_content_mode == 'steamcmd'
    - (riftbreaker_content_force | bool) or not rbbattle_content_bin.stat.exists

- name: Content aus kanonischem Cache spiegeln (Fallback, idempotent)
  command: >-
    rsync -a --exclude=/mods {{ riftbreaker_content_cache_dir }}/
    {{ riftbreaker_game_dir }}/
  register: rbbattle_content_sync
  changed_when: false
  when:
    - riftbreaker_content_mode == 'sync'
    - (riftbreaker_content_force | bool) or not rbbattle_content_bin.stat.exists

# --- HTTP-Bundle (Modus http, Issue #566) -----------------------------------
# Alternative zu SteamCMD: vorbereitetes Bundle + private PDB von planet,
# ohne distro-spezifische 32-bit-Abhängigkeiten. Checksum-Verifikation über
# `get_url`s eingebauten "sha256:<URL>"-Mechanismus (lädt SHA256SUMS selbst
# und sucht die passende Zeile) -- kein manuelles Parsen.
- name: HTTP-Download-Verzeichnis sicherstellen (http)
  file:
    path: "{{ riftbreaker_content_http_download_dir }}"
    state: directory
    mode: "0755"
  when: riftbreaker_content_mode == 'http'

- name: Game-Content-Bundle herunterladen (http, checksum-verifiziert)
  get_url:
    url: "{{ riftbreaker_content_http_base }}/{{ riftbreaker_content_http_archive }}"
    dest: "{{ riftbreaker_content_http_download_dir }}/{{ riftbreaker_content_http_archive }}"
    checksum: "sha256:{{ riftbreaker_content_http_base }}/{{ riftbreaker_content_http_checksums }}"
    mode: "0644"
  when: riftbreaker_content_mode == 'http'

- name: Game-Content-Bundle entpacken (http, idempotent)
  unarchive:
    src: "{{ riftbreaker_content_http_download_dir }}/{{ riftbreaker_content_http_archive }}"
    dest: "{{ riftbreaker_game_dir }}"
    remote_src: true
  when:
    - riftbreaker_content_mode == 'http'
    - (riftbreaker_content_force | bool) or not rbbattle_content_bin.stat.exists

# Best effort: die PDB ist NUR fuers Crash-Symbolik-Modul (Issue #480) --
# ein Netzwerk-Hakler hier darf das eigentliche Hochfahren des Servers nicht
# blockieren (deshalb ignore_errors statt Teil des Fail-loud-Contracts unten).
- name: Private PDB fuer Crash-Symbolik herunterladen (http, checksum-verifiziert, best effort)
  get_url:
    url: "{{ riftbreaker_content_http_base }}/{{ riftbreaker_content_http_pdb }}"
    dest: "{{ riftbreaker_game_dir }}/bin/{{ riftbreaker_content_http_pdb }}"
    checksum: "sha256:{{ riftbreaker_content_http_base }}/{{ riftbreaker_content_http_checksums }}"
    mode: "0644"
  register: rbbattle_content_http_pdb
  ignore_errors: true
  when: riftbreaker_content_mode == 'http'

- name: Hinweis, falls PDB-Download fehlschlug (http, Crash-Symbolik bleibt aus)
  debug:
    msg: >-
      PDB-Download fehlgeschlagen ({{ rbbattle_content_http_pdb.msg | default('unbekannter Fehler') }}) --
      Server laeuft trotzdem, aber Crash-Symbolik (crash_collector_symbolize)
      haette keine private PDB zum Aufloesen der Adressen.
  when:
    - riftbreaker_content_mode == 'http'
    - rbbattle_content_http_pdb is failed

- name: Content-Verifikation (Binary vorhanden?)
  stat:
    path: "{{ riftbreaker_game_dir }}/{{ riftbreaker_server_bin }}"
  register: rbbattle_content_after
  when: not ansible_check_mode

# Fail loud statt stiller Deploy ohne Spieldateien.
- name: Deploy abbrechen, wenn der Server-Content fehlt
  fail:
    msg: >-
      Dedicated-Server-Content fehlt: {{ riftbreaker_game_dir }}/{{ riftbreaker_server_bin }}
      existiert nach dem Lauf nicht. Modus {{ riftbreaker_content_mode }} hat den
      Content nicht bereitgestellt. Alternativen:
      `-e riftbreaker_content_mode=sync -e riftbreaker_content_cache_dir=/srv/riftbreaker/data/server`
      (setzt einen vollständigen Steam-Stand im Cache voraus) oder
      `-e riftbreaker_content_mode=http` (vorbereitetes Bundle von planet,
      s. riftbreaker_content_http_base).
  when:
    - not ansible_check_mode
    - not rbbattle_content_after.stat.exists
