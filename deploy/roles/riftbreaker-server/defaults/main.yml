---
# Defaults der Rolle riftbreaker-server.
# Planet-spezifische Werte (Pfade, Ports, Passwort) stehen in
# deploy/inventory/host_vars/planet/ — diese Defaults liefern nur Fallbacks.

riftbreaker_deploy_dir: "/opt/rbmods/compose/rift-{{ rift_env }}/riftbreaker"
riftbreaker_compose_project: "{{ riftbreaker_deploy_dir | basename }}"

# --- Dedicated-Server (Community-Rezept, Issue #241) ------------------------
# Das Image rb-dedicated:<sha> kommt aus der Rolle dedicated-server-image.
# Der Server startet mit `cli=1 config=config.cfg` — die Config wird hier aus
# config.cfg.j2 gerendert (Datei-Rechte 0644, steamuser-lesbar; Passwort aus dem Vault).
riftbreaker_server_container: riftbreaker-dedicated
riftbreaker_server_port_udp: 6321

riftbreaker_server_name: RBBattle
riftbreaker_server_max_players: 4
riftbreaker_server_broadcast_enabled: 1
# 0 = die Lua-Welt laeuft headless weiter (Live-Beleg 2026-09-12, #265): mit "1"
# friert das Lua-Log nach dem Laden ein und `rb_wave 3` erreicht den Mod
# (exec_result ok:true), erzeugt aber KEIN event=wave. Der Exec-/Wellen-
# Kontrollkanal (Ingress, #265) und der Referee (#269) brauchen eine laufende
# Lua-Welt; ohne Spieler liefe sonst keine Welle.
riftbreaker_server_pause_game_when_empty: 0
riftbreaker_server_rcon_password: "{{ vault_server_rcon_password | default('') }}"

# Schwierigkeits-Preset des Dedicated Servers. Bestimmt u. a. die "wave_strength"
# und damit, ob der Vanilla-`dom_mananger` Naturwellen startet (Issue #476):
#   * "sandbox"  -> wave_strength "sandbox": Naturwellen AUS, mission_infinite=1,
#                    kein Sieg/Niederlage-Zwang -> "blank slate"/Free Play.
#                    Beleg: scripts/difficulty/difficulties.difficulty (DifficultyDef
#                    "sandbox": wave_strength "sandbox", mission_infinite 1,
#                    mission_duration 0) + dom_manager.lua:149/156
#                    (pauseAttacks = AreWavesDisabled() bzw. waveStrength=="sandbox").
#   * "coop_normal" (Vanilla-Survival): Naturwellen AN.
# Werte muessen zum Preset in difficulties.difficulty passen (coop_* fuer
# mp_survival, sandbox/easy/normal/hard/brutal fuer SP/Open).
riftbreaker_server_difficulty: coop_normal

# Config-Zielpfad (wird als /data/config/config.cfg:ro in den Container gemountet).
riftbreaker_config_dir: "{{ riftbreaker_deploy_dir }}/config"

# Persistente Named Volumes für Wine-Prefix + Saves (Community-Rezept).
riftbreaker_wine_volume: rb-wine
riftbreaker_saves_volume: rb-saves

# --- Mods & Backups (Guard gegen Fremd-Mods in mods/) ------------------------
riftbreaker_mods_dir: "{{ riftbreaker_game_dir }}/mods"
riftbreaker_backup_dir: "{{ riftbreaker_game_dir }}-backups"
riftbreaker_mods_guard_autofix: true

# Quelle für den Post-Deploy-Runtime-Log-Check (best effort; genau eine
# mod_load-Zeile, erwartete Version, keine handler_errors). NICHT der harte
# Gate — der ist der Artefakt-Check in tasks/main.yml (Manifest- + RBB.version
# im deployten Stand == erwartete Version), der auch ohne Map-Load/Spieler
# funktioniert (Issue #226/#245).
#
# Community-Rezept (Issue #241): der Wine-Prefix liegt im benannten Volume
# {{ riftbreaker_wine_volume }}, nicht auf dem Host — der Lua-Log ist daher nur
# über den Container erreichbar. `deploy/dedicated-server/scripts/entrypoint.sh`
# (follow_server_logs) tailt exor_logs.txt selbst nach stdout, daher reicht
# hier `docker logs` (anders als beim alten Wine-Client-Image, wo `docker logs`
# nur die run-server.sh-Wrapper-Zeilen zeigte und `docker exec ... cat
# exor_logs.txt` nötig war).
riftbreaker_mod_log_cmd: "docker logs {{ riftbreaker_server_container }}"

# --- Server-I/O-Bridge (Issue #265) -----------------------------------------
# Die Rolle rbtools stagt die Windows-Tools (injector.exe/rbbridge.dll/
# pipe_bridge.exe) nach {{ rbtools_dir }}; von dort read-only nach /opt/rbtools
# im Container. Die Bridge (Wine-x64) nimmt HTTP auf 9001 an und uebersetzt
# POST /exec in exec-Zeilen auf \\.\pipe\rbbattle (erfuellt den bereits
# konfigurierten tournament_bridge_a_url=http://127.0.0.1:9001/exec).
# Nur an 127.0.0.1 des Hosts publiziert (nicht ins LAN/Internet).
# ACHTUNG: riftbreaker_bridge_port ist mit tournament_bridge_a_url gekoppelt
# (host_vars: http://127.0.0.1:9001/exec) — Aenderungen an BEIDEN Stellen.
riftbreaker_rbtools_dir: "{{ rbtools_dir | default('/opt/rbmods/rbtools') }}"
riftbreaker_bridge_port: 9001
# Container-seitiger Bridge-Port (pipe_bridge.exe). Bleibt IMMER 9001; nur der
# Host-Port (riftbreaker_bridge_port) variiert je Instanz. Getrennt, damit
# Test-Vars den Host-Port isolieren koennen, ohne die Bridge im Container auf
# einen anderen Port zu zwingen (Issue #289: genau dieser Mismatch machte die
# Test-Bridge unreachable).
riftbreaker_bridge_container_port: 9001

# --- Session-Mitschnitt (Issue #280) -----------------------------------------
# Tailt den Lua-Log im Wine-Volume (read-only) und schreibt pro Session JSONL auf
# den Host-Bind-Mount. Kein Netzzugriff, keine Spiel-Aenderung. Die Session-ID
# vergibt der Recorder (commence/match_end als Grenzen).
riftbreaker_sessions_container: riftbreaker-sessions
# Standard-Python-Image (stdlib-only Recorder) — kein eigenes Image-Build noetig.
riftbreaker_sessions_image: "python:3.12-slim"
# Host-Verzeichnis der JSONL-Protokolle (bind-mount -> /data/sessions im Sidecar).
riftbreaker_sessions_dir: "/srv/rift-{{ rift_env }}/sessions"
# Recorder-Script auf dem Host (bind-mount ro in den Sidecar).
riftbreaker_sessions_script: "{{ riftbreaker_deploy_dir }}/session_recorder.py"
riftbreaker_sessions_script_src: "{{ playbook_dir }}/session-recorder/session_recorder.py"

# --- Send-Tailer (Issue #713) ------------------------------------------------
# Env-agnostischer Sidecar (analog session-recorder): tailt exor_logs.txt und
# POSTet Mod-Chat-Send-Orders (-send waveN) an die Bridge (POST /order).
# Kein Netz nach aussen, nur zur Bridge im selben Compose-Netz.
# container_name ist global -> prod/staging/test muessen ihn ueberschreiben
# (prod-vars/staging-vars/test-vars.yml), sonst Kollision (analog sessions).
riftbreaker_send_tailer_container: riftbreaker-send-tailer
riftbreaker_send_tailer_image: "python:3.12-slim"
# Bridge-/order-Endpoint im Compose-Netz (Server-Container + Container-Port).
riftbreaker_send_tailer_bridge_url: "http://{{ riftbreaker_server_container }}:{{ riftbreaker_bridge_container_port }}/order"
# Script auf dem Host (bind-mount ro in den Sidecar).
riftbreaker_send_tailer_script: "{{ riftbreaker_deploy_dir }}/send_tailer.py"
riftbreaker_send_tailer_script_src: "{{ playbook_dir }}/send-tailer/send_tailer.py"

# --- Match-Loop (Issue #730) -------------------------------------------------
# Env-agnostischer Sidecar (analog send-tailer): pollt POST /get_state und
# schliesst den Solo-Round-Loop (HQ zerstoert -> end_game(lose) -> 10 s ->
# restart_map). Kein Wine-Volume noetig, nur HTTP zur Bridge im Compose-Netz.
# container_name ist global -> prod/staging/test muessen ihn ueberschreiben.
riftbreaker_match_loop_container: riftbreaker-match-loop
riftbreaker_match_loop_image: "python:3.12-slim"
# Bridge-Basis-URL im Compose-Netz (ohne Pfad; der Loop haengt /get_state etc. an).
riftbreaker_match_loop_bridge_url: "http://{{ riftbreaker_server_container }}:{{ riftbreaker_bridge_container_port }}"
# Script auf dem Host (bind-mount ro in den Sidecar).
riftbreaker_match_loop_script: "{{ riftbreaker_deploy_dir }}/match_loop.py"
riftbreaker_match_loop_script_src: "{{ playbook_dir }}/match-loop/match_loop.py"

# --- Sessions ---------------------------------------------------------------

# --- Disk-Space-Gate (Issue #310) --------------------------------------------
# Mindest-freier Platz auf {{ riftbreaker_disk_mount }} VOR Image-Build und
# Mod-Backup-Tarball. Der Preflight (tasks/disk-preflight.yml) wird aus den
# pre_tasks von site.yml/test-deploy.yml aufgerufen — also VOR den Rollen, damit
# der Abbruch vor dedicated-server-image greift. Schwelle konfigurierbar.
riftbreaker_disk_mount: "/"
riftbreaker_disk_min_free_gb: 10
# Echter Notausgang (Issue #586, Review-Blocker 1): wenn WEDER ansible_mounts
# NOCH `df` eine Zahl liefern, faellt das Gate normalerweise hart ab (siehe
# disk-preflight.yml) -- absichtlich, kein stiller "genug Platz"-Fallback.
# Mit riftbreaker_disk_skip_unknown=true (z. B. `-e`) wird dieser Hart-Abbruch
# statt eines Fails zu einer lauten Warnung + der Groessen-Check wird
# ausgelassen (es gibt ja keine Zahl zum Vergleichen). Default false.
riftbreaker_disk_skip_unknown: false

# Deploy-Identitaet (Issue #483, US4): Fallback fuer die Compose-Vorlage, damit
# sie auch ohne die Plays renderbar bleibt (check-render, Hermetik-Tests). Die
# Plays setzen rift_env als Play-Var; rift_deploy_ref kommt aus
# deploy/tasks/deploy-identity.yml (set_fact schlaegt diese Defaults).
rift_env: unknown
rift_deploy_ref: unknown
