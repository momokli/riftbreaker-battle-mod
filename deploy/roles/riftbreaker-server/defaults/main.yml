---
# Defaults der Rolle riftbreaker-server.
# Planet-spezifische Werte (Pfade, Ports, Passwort) stehen in
# deploy/inventory/host_vars/planet/ — diese Defaults liefern nur Fallbacks.

riftbreaker_deploy_dir: /opt/rbmods/compose/riftbreaker-dedicated
riftbreaker_compose_project: "{{ riftbreaker_deploy_dir | basename }}"

# --- Dedicated-Server (Community-Rezept, Issue #241) ------------------------
# Das Image rb-dedicated:<sha> kommt aus der Rolle dedicated-server-image.
# Der Server startet mit `cli=1 config=config.cfg` — die Config wird hier aus
# config.cfg.j2 gerendert (Datei-Rechte 0644, steamuser-lesbar; Passwort aus dem Vault).
riftbreaker_server_container: riftbreaker-dedicated
riftbreaker_server_port_udp: 6321

riftbreaker_server_name: RBBattle
riftbreaker_server_max_players: 4
riftbreaker_server_broadcast_enabled: 1
# 0 = die Lua-Welt laeuft headless weiter (Live-Beleg 2026-09-12, #265): mit "1"
# friert das Lua-Log nach dem Laden ein und `rb_wave 3` erreicht den Mod
# (exec_result ok:true), erzeugt aber KEIN event=wave. Der Exec-/Wellen-
# Kontrollkanal (Ingress, #265) und der Referee (#269) brauchen eine laufende
# Lua-Welt; ohne Spieler liefe sonst keine Welle.
riftbreaker_server_pause_game_when_empty: 0
riftbreaker_server_rcon_password: "{{ vault_server_rcon_password | default('') }}"

# Config-Zielpfad (wird als /data/config/config.cfg:ro in den Container gemountet).
riftbreaker_config_dir: "{{ riftbreaker_deploy_dir }}/config"

# Persistente Named Volumes für Wine-Prefix + Saves (Community-Rezept).
riftbreaker_wine_volume: rb-wine
riftbreaker_saves_volume: rb-saves

# --- Mods & Backups (Guard gegen Fremd-Mods in mods/) ------------------------
riftbreaker_mods_dir: "{{ riftbreaker_game_dir }}/mods"
riftbreaker_backup_dir: "{{ riftbreaker_game_dir }}-backups"
riftbreaker_mods_guard_autofix: true

# Quelle für den Post-Deploy-Runtime-Log-Check (best effort; genau eine
# mod_load-Zeile, erwartete Version, keine handler_errors). NICHT der harte
# Gate — der ist der Artefakt-Check in tasks/main.yml (Manifest- + RBB.version
# im deployten Stand == erwartete Version), der auch ohne Map-Load/Spieler
# funktioniert (Issue #226/#245).
#
# Community-Rezept (Issue #241): der Wine-Prefix liegt im benannten Volume
# {{ riftbreaker_wine_volume }}, nicht auf dem Host — der Lua-Log ist daher nur
# über den Container erreichbar. `tools/dedicated-server/scripts/entrypoint.sh`
# (follow_server_logs) tailt exor_logs.txt selbst nach stdout, daher reicht
# hier `docker logs` (anders als beim alten Wine-Client-Image, wo `docker logs`
# nur die run-server.sh-Wrapper-Zeilen zeigte und `docker exec ... cat
# exor_logs.txt` nötig war).
riftbreaker_mod_log_cmd: "docker logs {{ riftbreaker_server_container }}"

# --- Trainer-I/O-Bridge (Issue #265) -----------------------------------------
# Die Rolle rbtools stagt die Windows-Tools (injector.exe/rbbridge.dll/
# pipe_bridge.exe) nach {{ rbtools_dir }}; von dort read-only nach /opt/rbtools
# im Container. Die Bridge (Wine-x64) nimmt HTTP auf 9001 an und uebersetzt
# POST /exec in exec-Zeilen auf \\.\pipe\rbbattle (erfuellt den bereits
# konfigurierten tournament_bridge_a_url=http://127.0.0.1:9001/exec).
# Nur an 127.0.0.1 des Hosts publiziert (nicht ins LAN/Internet).
# ACHTUNG: riftbreaker_bridge_port ist der HOST-Port und mit
# tournament_bridge_a_url gekoppelt (Profil: http://127.0.0.1:<port>/exec) —
# Aenderungen an BEIDEN Stellen. Der Container-Port ist fuer ALLE Instanzen
# konstant (riftbreaker_bridge_container_port = 9001); nur das Host-Mapping
# (riftbreaker_bridge_port) variiert je Instanz (Issue #290).
riftbreaker_rbtools_dir: "{{ rbtools_dir | default('/opt/rbmods/rbtools') }}"
riftbreaker_bridge_port: 9001
riftbreaker_bridge_container_port: 9001
