---
# Defaults der Rolle riftbreaker-server.
# Planet-spezifische Werte (Pfade, Ports, Passwort) stehen in
# deploy/inventory/host_vars/planet/ — diese Defaults liefern nur Fallbacks.

riftbreaker_deploy_dir: /opt/rbmods/compose/riftbreaker-dedicated
riftbreaker_compose_project: "{{ riftbreaker_deploy_dir | basename }}"

# --- Dedicated-Server (Community-Rezept, Issue #241) ------------------------
# Das Image rb-dedicated:<sha> kommt aus der Rolle dedicated-server-image.
# Der Server startet mit `cli=1 config=config.cfg` — die Config wird hier aus
# config.cfg.j2 gerendert (Datei-Rechte 0644, steamuser-lesbar; Passwort aus dem Vault).
riftbreaker_server_container: riftbreaker-dedicated
riftbreaker_server_port_udp: 6321
# Game-Ports (6321/udp+tcp) auf den Host publizieren? Prod: true (öffentlich).
# Test: false — die Test-Instanz hat KEINE Host-Ports (Issue #275, Design D5).
riftbreaker_server_publish_ports: true

riftbreaker_server_name: RBBattle
riftbreaker_server_max_players: 4
riftbreaker_server_broadcast_enabled: 1
# 0 = die Lua-Welt laeuft headless weiter (Live-Beleg 2026-09-12, #265): mit "1"
# friert das Lua-Log nach dem Laden ein und `rb_wave 3` erreicht den Mod
# (exec_result ok:true), erzeugt aber KEIN event=wave. Der Exec-/Wellen-
# Kontrollkanal (Ingress, #265) und der Referee (#269) brauchen eine laufende
# Lua-Welt; ohne Spieler liefe sonst keine Welle.
riftbreaker_server_pause_game_when_empty: 0
riftbreaker_server_rcon_password: "{{ vault_server_rcon_password | default('') }}"

# Config-Zielpfad (wird als /data/config/config.cfg:ro in den Container gemountet).
riftbreaker_config_dir: "{{ riftbreaker_deploy_dir }}/config"

# Persistente Named Volumes für Wine-Prefix + Saves (Community-Rezept).
riftbreaker_wine_volume: rb-wine
riftbreaker_saves_volume: rb-saves

# --- Mods & Backups (Guard gegen Fremd-Mods in mods/) ------------------------
riftbreaker_mods_dir: "{{ riftbreaker_game_dir }}/mods"
riftbreaker_backup_dir: "{{ riftbreaker_game_dir }}-backups"
riftbreaker_mods_guard_autofix: true

# --- Trainer-I/O-Bridge (Issue #265, Port-Entkopplung #275) -------------------
# Die Rolle rbtools stagt die Windows-Tools (injector.exe/rbbridge.dll/
# pipe_bridge.exe) nach {{ rbtools_dir }}; von dort read-only nach /opt/rbtools
# im Container. Die Bridge (Wine-x64) nimmt HTTP an und uebersetzt POST /exec in
# exec-Zeilen auf \\.\pipe\rbbattle.

# INNERER Bridge-Port: fix 9001 (Design D4). Der Tournament-Container spricht die
# Bridge ueber Docker-DNS auf genau diesem Port an (tournament_bridge_a_url).
# Kopplung ist damit konstruktiv: es gibt keinen separaten Aussen-Port mehr.
# ACHTUNG: RBB_BRIDGE_BIND MUSS 0.0.0.0 bleiben, sonst ist die Bridge aus dem
# Tournament-Container nicht erreichbar (Risiko R4).
riftbreaker_bridge_port_internal: 9001
# Host-Publish der Bridge (String im Format <host>:<hostport>:<containerport>
# oder leer = kein Publish). Prod: Loopback-only (Operator-curl/Doku). Test:
# leer. Das Publish-ZIEL ist IMMER riftbreaker_bridge_port_internal.
riftbreaker_bridge_publish_host: "127.0.0.1:9001:9001"
riftbreaker_rbtools_dir: "{{ rbtools_dir | default('/opt/rbmods/rbtools') }}"

# --- Tournament-Server (Issue #275, Design D2/D3) ----------------------------
# Zweiter Service im SELBEN Compose (gleiche Datei = gleiches default-Netz):
# der Tournament-Container erreicht die Bridge im Dedi-Container über Docker-DNS.
# Das Image rb-tournament:<deploy-sha> baut die Rolle tournament-server; die
# Reihenfolge in site.yml/test-deploy.yml ist tournament-server VOR dieser Rolle.
tournament_image: "rb-tournament:{{ deploy_image_tag }}"
# Eindeutig pro Instanz abgeleitet (Prod: ...-tournament, Test: ...-test-tournament).
tournament_container: "{{ riftbreaker_server_container }}-tournament"
tournament_port: 8081
# Prod: nur Loopback publizieren (Caddy-Proxy /tournament/* hängt daran).
# Test: leer (kein Host-Port; Verifikation per docker exec, Design D5/D6).
tournament_publish_host: "127.0.0.1:8081:8081"
tournament_auto_go: "true"
# Bridge-Endpoint Welt A = Docker-DNS des Dedi-Service, NICHT 127.0.0.1 (D3).
tournament_bridge_a_url: "http://{{ riftbreaker_server_container }}:{{ riftbreaker_bridge_port_internal }}/exec"
# v1 hat keine Welt-B-Bridge: leer = kein toter Push-Endpoint (Design D3b).
tournament_bridge_b_url: ""
