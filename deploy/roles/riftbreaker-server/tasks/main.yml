---
# Rolle: riftbreaker-server — Dev-SP-Server 6321 (1v1 "vs sich selbst"),
# docker/wine. Voraussetzungen: mods-zip hat rbbattle.zip nach
# {{ mods_zip_dest }} gepackt (md5-Parität bereits geprüft), game-content hat
# den Steam-Content nach {{ riftbreaker_game_dir }} gelegt und
# headless-client-image hat das Laufzeit-Image (Tag = Deploy-SHA) gebaut.

- name: Game-Verzeichnis sicherstellen
  file:
    path: "{{ riftbreaker_game_dir }}"
    state: directory
    mode: "0755"

- name: Deploy-Verzeichnis für Compose anlegen
  file:
    path: "{{ riftbreaker_deploy_dir }}"
    state: directory
    mode: "0755"

# Fehlerklasse „Container-Name belegt" (Issue #209): ein fremder Container mit
# unserem Namen (z. B. ein alter Community-Stack) lässt `docker compose up -d`
# mit Namenskonflikt scheitern. Docker liefert das Compose-Projekt-Label; den
# Namen darf nur unser eigenes Projekt tragen. Läuft auch im --check.
- name: Bestehenden Container mit unserem Namen prüfen (Fremd-Belegung?)
  # `docker container inspect` (nicht `docker inspect`): nur Container, sonst
  # matcht Docker auch ein gleichnamiges Image (z. B. der alte Community-Stack
  # `riftbreaker-dedicated:latest`).
  command: >-
    docker container inspect --format '{% raw %}{{ index .Config.Labels "com.docker.compose.project" }}{% endraw %}'
    {{ riftbreaker_server_container }}
  register: rbbattle_container_owner
  changed_when: false
  failed_when: false
  check_mode: false

- name: Container-Name gehört uns (oder ist frei)
  assert:
    that:
      - "(rbbattle_container_owner.rc != 0) or ((rbbattle_container_owner.stdout | trim) in ['', riftbreaker_compose_project])"
    fail_msg: >-
      Container-Name '{{ riftbreaker_server_container }}' ist von einem fremden
      Projekt belegt (Label com.docker.compose.project='{{ rbbattle_container_owner.stdout | trim }}').
      Vor dem Deploy entfernen (docker rm -f {{ riftbreaker_server_container }}),
      sonst scheitert `docker compose up -d` am Namenskonflikt.

- name: docker-compose.yml rendern
  template:
    src: docker-compose.yml.j2
    dest: "{{ riftbreaker_deploy_dir }}/docker-compose.yml"
    mode: "0600"
  register: riftbreaker_compose

- name: Mod-Zip md5 (planet) lesen
  stat:
    path: "{{ mods_zip_dest }}"
    checksum_algorithm: md5
  register: rbbattle_zip_stat

- name: Installierten Mod-Stand lesen (Marker)
  slurp:
    src: "{{ riftbreaker_deploy_dir }}/rbbattle.md5"
  register: mod_marker
  failed_when: false

- name: rbbattle-Mod installieren (nur bei Änderung)
  when: (mod_marker.content | default('')) != (rbbattle_zip_stat.stat.checksum | b64encode)
  block:
    - name: Alten Mod-Ordner entfernen
      file:
        path: "{{ riftbreaker_mod_dir }}"
        state: absent
    - name: Mod-Ordner anlegen
      file:
        path: "{{ riftbreaker_mod_dir }}"
        state: directory
        mode: "0755"
    - name: Mod-Zip entpacken (Content-Root = mod/)
      unarchive:
        src: "{{ mods_zip_dest }}"
        dest: "{{ riftbreaker_mod_dir }}"
        remote_src: true
    # Der Marker ist die Änderungs-Erkennung; sein Schreiben notifyt den
    # Restart-Handler (Mod-Änderung -> Container wirklich neu starten).
    - name: Deploy-Marker schreiben
      copy:
        content: "{{ rbbattle_zip_stat.stat.checksum }}"
        dest: "{{ riftbreaker_deploy_dir }}/rbbattle.md5"
        mode: "0644"
      notify: restart riftbreaker-server

- name: Container sicherstellen (docker compose up -d, idempotent)
  command: docker compose -f {{ riftbreaker_deploy_dir }}/docker-compose.yml up -d --remove-orphans
  register: riftbreaker_up
  changed_when: >-
    ('Recreated' in riftbreaker_up.stdout)
    or ('Created' in riftbreaker_up.stdout)
    or ('Started' in riftbreaker_up.stdout)
