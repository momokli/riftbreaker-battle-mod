---
# Rolle: riftbreaker-server — Dev-SP-Server 6321 (1v1 "vs sich selbst").
# Community-Rezept (Issue #241): baut auf dedicated-server-image auf und startet
# DedicatedServer.exe cli=1 config=config.cfg. Voraussetzungen: game-content hat
# den Content nach {{ riftbreaker_game_dir }} gelegt, mods-zip liefert
# {{ mods_zip_dest }}.
#
# Vereinfacht für Issue #241: Guard/Post-Deploy-Verifikation/Rollback aus dem
# alten Client-Image-Ansatz sind bewusst zurückgestellt — der Community-Entrypoint
# liefert Healthcheck (pgrep DedicatedServer.exe) + Port-/Startup-Watch.

- name: Game-Verzeichnis sicherstellen
  file:
    path: "{{ riftbreaker_game_dir }}"
    state: directory
    mode: "0755"

- name: Mods-Verzeichnis sicherstellen
  file:
    path: "{{ riftbreaker_mods_dir }}"
    state: directory
    mode: "0755"

- name: Config-Verzeichnis sicherstellen
  file:
    path: "{{ riftbreaker_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy-Verzeichnis für Compose anlegen
  file:
    path: "{{ riftbreaker_deploy_dir }}"
    state: directory
    mode: "0755"

- name: "Session-Verzeichnis sicherstellen (Issue #280)"
  file:
    path: "{{ riftbreaker_sessions_dir }}"
    state: directory
    mode: "0755"

- name: "Session-Recorder-Script bereitstellen (Issue #280)"
  copy:
    src: "{{ riftbreaker_sessions_script_src }}"
    dest: "{{ riftbreaker_sessions_script }}"
    remote_src: true
    mode: "0644"
  notify: restart riftbreaker-server

- name: config.cfg rendern (Passwort aus Vault, 0644 fuer steamuser-lesbar)
  template:
    src: config.cfg.j2
    dest: "{{ riftbreaker_config_dir }}/config.cfg"
    mode: "0644"
  notify: restart riftbreaker-server

- name: docker-compose.yml rendern
  template:
    src: docker-compose.yml.j2
    dest: "{{ riftbreaker_deploy_dir }}/docker-compose.yml"
    mode: "0600"
  notify: restart riftbreaker-server

- name: Mod ausrollen (rbbattle.zip -> mods/rbbattle, idempotent)
  unarchive:
    src: "{{ mods_zip_dest }}"
    dest: "{{ riftbreaker_mod_dir }}"
    remote_src: true
    creates: "{{ riftbreaker_mod_dir }}"
  notify: restart riftbreaker-server

- name: Container sicherstellen (up -d, remove-orphans)
  command: docker compose -f {{ riftbreaker_deploy_dir }}/docker-compose.yml up -d --remove-orphans
  register: riftbreaker_up
  changed_when: riftbreaker_up.rc == 0

- name: Handlers flushen (Restart, falls Config/Compose/Mod geändert)
  meta: flush_handlers
