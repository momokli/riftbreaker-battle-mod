---
# Rolle: riftbreaker-server — Dev-SP-Server 6321 (1v1 "vs sich selbst").
# Community-Rezept (Issue #241): baut auf dedicated-server-image auf und startet
# DedicatedServer.exe cli=1 config=config.cfg. Voraussetzungen: game-content hat
# den Content nach {{ riftbreaker_game_dir }} gelegt, mods-zip liefert
# {{ mods_zip_dest }}.
#
# WICHTIG — Mod-Backups liegen NIE innerhalb von {{ riftbreaker_mods_dir }}:
# Der Dedicated Server lädt JEDEN Unterordner mit einer *.manifest in mods/ als
# eigene External-Content-Mod. Ein Backup-Ordner mit gleicher Content-ID
# (z. B. rbbattle.bak-<ts>/) wird ZUSÄTZLICH geladen → die Versionskonstante
# wird überschrieben und beide Kopien registrieren ihre Handler doppelt
# (`handler_errors`/`event_unreadable`, Befund planet 2026-09-10). Backups
# daher immer NACH {{ riftbreaker_backup_dir }} (als .tar.gz, ausserhalb mods/).
#
# Issue #245: die #244-Vereinfachung hatte den Mod-Rollout auf ein einzelnes
# `unarchive ... creates: {{ riftbreaker_mod_dir }}` reduziert — sobald der
# Ordner einmal existiert, überspringt Ansible das Entpacken auf JEDEM
# folgenden Deploy, egal ob sich `mod/lua/*` geändert hat. Iteration
# (ändern -> mergen -> live) war damit kaputt. Diese Datei stellt die
# md5-Marker-Änderungserkennung + Backup/Rollback aus #212 wieder her,
# angepasst an das aktuelle Rezept: {{ riftbreaker_game_dir }} (und damit
# {{ riftbreaker_mods_dir }}) ist ein Host-Bind-Mount (kein `docker exec`
# nötig für Datei-Operationen); nur der Runtime-Log-Check braucht `docker
# logs`, weil der Wine-Prefix in einem benannten Volume liegt.

- name: Game-Verzeichnis sicherstellen
  file:
    path: "{{ riftbreaker_game_dir }}"
    state: directory
    mode: "0755"

- name: Mods-Verzeichnis sicherstellen
  file:
    path: "{{ riftbreaker_mods_dir }}"
    state: directory
    mode: "0755"

- name: Backup-Verzeichnis AUSSERHALB von mods/ sicherstellen
  file:
    path: "{{ riftbreaker_backup_dir }}"
    state: directory
    mode: "0755"

- name: Config-Verzeichnis sicherstellen
  file:
    path: "{{ riftbreaker_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy-Verzeichnis für Compose anlegen
  file:
    path: "{{ riftbreaker_deploy_dir }}"
    state: directory
    mode: "0755"

- name: config.cfg rendern (Passwort aus Vault, 0644 fuer steamuser-lesbar)
  template:
    src: config.cfg.j2
    dest: "{{ riftbreaker_config_dir }}/config.cfg"
    mode: "0644"
  notify: restart riftbreaker-server

- name: docker-compose.yml rendern
  template:
    src: docker-compose.yml.j2
    dest: "{{ riftbreaker_deploy_dir }}/docker-compose.yml"
    mode: "0600"
  notify: restart riftbreaker-server

# ---------------------------------------------------------------------------
# Guard: in mods/ darf nur der Ziel-Mod-Ordner liegen. Fremd-Ordner mit
# *.manifest (Backups/Fremd-Mods) würden sonst ZUSÄTZLICH geladen (#212).
# ---------------------------------------------------------------------------
- name: Guard — Ordner mit *.manifest in mods/ aufspüren
  find:
    paths: "{{ riftbreaker_mods_dir }}"
    patterns: "*.manifest"
    file_type: file
    recurse: true
  register: riftbreaker_manifest_scan

- name: Guard — Fremd-Mod-Ordner ermitteln (alles ausser dem Ziel-Mod)
  set_fact:
    riftbreaker_stray_mod_dirs: >-
      {{ riftbreaker_manifest_scan.files
         | map(attribute='path')
         | map('dirname')
         | unique
         | reject('eq', riftbreaker_mod_dir)
         | list }}

- name: Guard — Ziel für weggeschobene Fremd-Mods (Zeitstempel je Lauf)
  set_fact:
    riftbreaker_stray_target: "{{ riftbreaker_backup_dir }}/stray-{{ ansible_date_time.iso8601_basic_short }}"
  when: riftbreaker_stray_mod_dirs | length > 0

- name: Guard — Ziel-Verzeichnis für weggeschobene Fremd-Mods anlegen
  file:
    path: "{{ riftbreaker_stray_target }}"
    state: directory
    mode: "0755"
  when: riftbreaker_stray_mod_dirs | length > 0

- name: Guard — Fremd-Mod-Ordner aus mods/ wegschieben (idempotent)
  command:
    cmd: 'mv -- "{{ item }}" "{{ riftbreaker_stray_target }}/"'
    removes: "{{ item }}"
  loop: "{{ riftbreaker_stray_mod_dirs }}"
  when: riftbreaker_mods_guard_autofix | bool
  register: riftbreaker_stray_moved

- name: Guard — mods/ erneut prüfen (nach Wegschieben)
  find:
    paths: "{{ riftbreaker_mods_dir }}"
    patterns: "*.manifest"
    file_type: file
    recurse: true
  register: riftbreaker_manifest_scan_after

# Im PR-Gate (--check) ist der `mv` oben geskippt → die Fremd-Ordner liegen noch
# da. Deshalb dort nur warnen; der echte Deploy bricht hart ab. Der
# Required-Check „deploy-check" bleibt so stabil.
- name: Guard — kein Fremd-Ordner mit Manifest mehr in mods/ (sonst Abbruch)
  assert:
    that:
      - >-
        (riftbreaker_manifest_scan_after.files
         | map(attribute='path')
         | map('dirname')
         | unique
         | reject('eq', riftbreaker_mod_dir)
         | list | length) == 0
    fail_msg: >-
      GUARD: In {{ riftbreaker_mods_dir }} liegt ausser {{ riftbreaker_mod_dir }}
      mindestens ein weiterer Ordner mit *.manifest. Der Dedicated Server lädt
      ihn zusätzlich (Versionskonflikt + doppelte Handler → handler_errors).
      Backups NIE in mods/ ablegen — nach {{ riftbreaker_backup_dir }}/ oder als
      .tar.gz ausserhalb. Deploy abgebrochen.
    success_msg: >-
      Guard OK: nur {{ riftbreaker_mod_dir }} trägt eine *.manifest in
      {{ riftbreaker_mods_dir }}.
  when: not ansible_check_mode

- name: "WARNUNG: Fremd-Ordner mit *.manifest in mods/ (nur im --check)"
  debug:
    msg: >-
      WARNUNG: In {{ riftbreaker_mods_dir }} liegt ausser {{ riftbreaker_mod_dir }}
      mindestens ein weiterer Ordner mit *.manifest ({{ riftbreaker_stray_mod_dirs }}).
      Ein echter Deploy würde ihn wegschieben bzw. abbrechen.
  when:
    - ansible_check_mode
    - riftbreaker_stray_mod_dirs | length > 0

- name: Guard — hat eingegriffen? (Fact)
  set_fact:
    riftbreaker_guard_moved: "{{ riftbreaker_stray_mod_dirs | length > 0 }}"

# ---------------------------------------------------------------------------
# Mod-Stand prüfen und — nur bei Änderung — sichern und ausrollen (Issue #245:
# Kern der wiederhergestellten Iteration, statt des #244-`creates:`-Kurzschlusses).
# ---------------------------------------------------------------------------
- name: Mod-Zip md5 (planet) lesen
  stat:
    path: "{{ mods_zip_dest }}"
    checksum_algorithm: md5
  register: rbbattle_zip_stat

- name: Installierten Mod-Stand lesen (Marker)
  slurp:
    src: "{{ riftbreaker_deploy_dir }}/rbbattle.md5"
  register: mod_marker
  failed_when: false

- name: Vorhandenen Mod-Ordner prüfen
  stat:
    path: "{{ riftbreaker_mod_dir }}"
  register: riftbreaker_mod_dir_stat

- name: Mod-Update nötig? (Marker != Zip-md5, oder Ordner fehlt/ist leer)
  set_fact:
    riftbreaker_mod_update_needed: >-
      {{ (mod_marker.content | default('') | b64decode) != rbbattle_zip_stat.stat.checksum
         or not (riftbreaker_mod_dir_stat.stat.isdir | default(false)) }}

- name: Erwartete Mod-Version bestimmen (Fact aus Rolle mods-zip)
  set_fact:
    riftbreaker_expected_version: "{{ mod_version | default('') | trim }}"

- name: Backup-Zielpfad je Lauf festlegen (AUSSERHALB von mods/)
  set_fact:
    riftbreaker_mod_backup_path: "{{ riftbreaker_backup_dir }}/rbbattle-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
  when: riftbreaker_mod_update_needed

- name: Alten Mod-Stand sichern (tar.gz, AUSSERHALB von mods/)
  command:
    argv:
      - tar
      - -czf
      - "{{ riftbreaker_mod_backup_path }}"
      - -C
      - "{{ riftbreaker_mods_dir }}"
      - "{{ riftbreaker_mod_dir | basename }}"
  when:
    - riftbreaker_mod_update_needed
    - riftbreaker_mod_dir_stat.stat.isdir | default(false)
  register: riftbreaker_mod_backup
  changed_when: true

- name: Mod ausrollen, Container starten und verifizieren (Rollback aus Backup)
  when: riftbreaker_mod_update_needed or riftbreaker_guard_moved
  block:
    - name: Alten Mod-Ordner entfernen
      file:
        path: "{{ riftbreaker_mod_dir }}"
        state: absent
      when: riftbreaker_mod_update_needed

    - name: Mod-Ordner anlegen
      file:
        path: "{{ riftbreaker_mod_dir }}"
        state: directory
        mode: "0755"
      when: riftbreaker_mod_update_needed

    - name: Mod-Zip entpacken (Content-Root = mod/)
      unarchive:
        src: "{{ mods_zip_dest }}"
        dest: "{{ riftbreaker_mod_dir }}"
        remote_src: true
      when: riftbreaker_mod_update_needed

    # Der Marker ist die Änderungs-Erkennung; sein Schreiben notifyt den
    # Restart-Handler (Mod-Änderung -> Container wirklich neu starten). Der
    # Handler wird unten VOR der Verifikation geflusht, damit der neue Stand im
    # Log steht.
    - name: Deploy-Marker schreiben
      copy:
        content: "{{ rbbattle_zip_stat.stat.checksum }}"
        dest: "{{ riftbreaker_deploy_dir }}/rbbattle.md5"
        mode: "0644"
      when: riftbreaker_mod_update_needed
      notify: restart riftbreaker-server

    - name: Container neu starten, damit die Verifikation den neuen Stand sieht
      meta: flush_handlers

    # Nur-Guard-Fall (Mod unverändert, aber Fremd-Ordner weggeschoben): der
    # Handler wurde nicht notifyt, der Server muss trotzdem neu laden.
    - name: Container neu laden (nur Guard-Eingriff, Mod unverändert)
      command: >-
        docker compose -f {{ riftbreaker_deploy_dir }}/docker-compose.yml
        up -d --force-recreate --remove-orphans
      when: not riftbreaker_mod_update_needed
      changed_when: true

    # -----------------------------------------------------------------------
    # Post-Deploy-Verifikation — zwei Stufen (Muster #226/#227):
    #   A) Artefakt-Check (IMMER, idle-sicher): Manifest- UND Lua-Version im
    #      deployten Stand müssen der erwarteten Version entsprechen.
    #      {{ riftbreaker_mod_dir }} ist ein Host-Bind-Mount — direkt lesbar,
    #      kein docker exec nötig.
    #   B) Runtime-Log-Check (best effort): der Wine-Prefix liegt in einem
    #      benannten Volume (nicht auf dem Host), der Lua-Log ist daher nur
    #      über den Container erreichbar. Das aktuelle Rezept (Issue #241,
    #      tools/dedicated-server/scripts/entrypoint.sh: follow_server_logs)
    #      tailt exor_logs.txt selbst nach stdout — `docker logs` enthält die
    #      `[RBBATTLE] event=...`-Zeilen also wieder (anders als beim alten
    #      Wine-Client-Image, das nur die run-server.sh-Wrapper-Zeilen zeigte).
    #      Existiert kein Log (z. B. Welt noch nicht hochgefahren), ist das
    #      KEIN Fehler — A ist der harte Gate.
    # -----------------------------------------------------------------------
    - name: "Verifikation — Manifest-Version im deployten Stand lesen"
      # `--include`: nur die Mod-Manifeste lesen, sonst würden README/Docs mit
      # `version "…"`-Zeilen mitgelesen. Ein einzelner Befehl, keine Pipe.
      command:
        cmd: "grep -rhoE --include='*.manifest' '^[[:space:]]*version[[:space:]]*\"[^\"]+\"' {{ riftbreaker_mod_dir }}"
      register: rbbattle_deploy_manifest_version_raw
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: "Verifikation — RBB.version im deployten Lua lesen"
      command:
        cmd: "grep -rhoE --include='*.lua' 'RBB[.]version[[:space:]]*=[[:space:]]*\"[^\"]+\"' {{ riftbreaker_mod_dir }}"
      register: rbbattle_deploy_lua_version_raw
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: "Verifikation — deployte Versionen ableiten"
      # `| first | default(...)`: leere Trefferliste → kein Task-Arg-Crash.
      set_fact:
        riftbreaker_deployed_manifest_version: >-
          {{ (rbbattle_deploy_manifest_version_raw.stdout | default('')
              | regex_findall('version\s*"([^"]+)"')) | first | default('') }}
        riftbreaker_deployed_lua_version: >-
          {{ (rbbattle_deploy_lua_version_raw.stdout | default('')
              | regex_findall('RBB[.]version\s*=\s*"([^"]+)"')) | first | default('') }}
      when: not ansible_check_mode

    - name: "Verifikation — deploytes Artefakt entspricht der erwarteten Version (idle-sicher)"
      assert:
        that:
          - riftbreaker_deployed_manifest_version | length > 0
          - riftbreaker_deployed_lua_version | length > 0
          - >-
            (riftbreaker_expected_version | length == 0)
            or (riftbreaker_deployed_manifest_version == riftbreaker_expected_version)
          - >-
            (riftbreaker_expected_version | length == 0)
            or (riftbreaker_deployed_lua_version == riftbreaker_expected_version)
        fail_msg: >-
          DEPLOY-VERIFIKATION FEHLGESCHLAGEN (Artefakt): der deployte Mod unter
          {{ riftbreaker_mod_dir }} hat Manifest-Version
          '{{ riftbreaker_deployed_manifest_version | default('(fehlt)') }}' und
          Lua-Version '{{ riftbreaker_deployed_lua_version | default('(fehlt)') }}',
          erwartet war '{{ riftbreaker_expected_version | default('?') }}'.
          Deploy wird aus dem Backup zurückgerollt.
        success_msg: >-
          Artefakt OK: Manifest- und Lua-Version =
          {{ riftbreaker_deployed_lua_version | default('?') }}.
      when: not ansible_check_mode

    - name: "Verifikation — Runtime-Lua-Log lesen (best effort)"
      command:
        cmd: "{{ riftbreaker_mod_log_cmd }}"
      register: riftbreaker_server_logs
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: "Verifikation — mod_load-Zeilen im Runtime-Log ermitteln"
      set_fact:
        riftbreaker_mod_load_lines: >-
          {{ riftbreaker_server_logs.stdout | default('') | regex_findall('event=mod_load[^\n]*') }}
        riftbreaker_runtime_log_present: >-
          {{ (riftbreaker_server_logs.rc | default(1)) == 0
             and (riftbreaker_server_logs.stdout | default('') | length) > 0 }}
      when: not ansible_check_mode

    - name: "Verifikation — Runtime-Log prüfen (nur wenn vorhanden)"
      assert:
        that:
          - riftbreaker_mod_load_lines | length == 1
          - "'handler_errors' not in (riftbreaker_server_logs.stdout | default(''))"
          - "'event_unreadable' not in (riftbreaker_server_logs.stdout | default(''))"
          - >-
            (riftbreaker_expected_version | length == 0)
            or (('version=' ~ riftbreaker_expected_version)
                in (riftbreaker_mod_load_lines | first | default('')))
          - >-
            (riftbreaker_expected_version | length == 0)
            or ('status=ok' in (riftbreaker_mod_load_lines | first | default('')))
        fail_msg: >-
          DEPLOY-VERIFIKATION FEHLGESCHLAGEN (Runtime-Log):
          `{{ riftbreaker_mod_log_cmd }}` lieferte
          {{ riftbreaker_mod_load_lines | length }} mod_load-Zeile(n), erwartet
          genau eine mit version={{ riftbreaker_expected_version | default('?') }}
          und status=ok, ohne handler_errors/event_unreadable. Deploy wird aus
          dem Backup zurückgerollt.
        # `| first | default(...)`: der success_msg wird von Ansible auch dann
        # ausgewertet, wenn die Bedingung fehlschlägt. Bei leerer
        # mod_load-Liste würde `| first` sonst mit "No first item, sequence was
        # empty" als Task-Arg-Fehler crashen — die eigentliche fail_msg käme nie
        # an und der rescue (Rollback) liefe ohne Erklärung (Issue #224).
        success_msg: "Runtime-Log OK: {{ riftbreaker_mod_load_lines | first | default('(keine mod_load-Zeile)') }}"
      when: "not ansible_check_mode and (riftbreaker_runtime_log_present | default(false) | bool)"

    - name: "Verifikation — Hinweis: kein Runtime-Log (Artefakt-Check maßgeblich)"
      debug:
        msg: >-
          Kein Runtime-Lua-Log über `{{ riftbreaker_mod_log_cmd }}` (Welt evtl.
          noch nicht hochgefahren, oder Log noch nicht geflusht). Maßgeblich
          ist der Artefakt-Check (Manifest-/Lua-Version
          {{ riftbreaker_deployed_lua_version | default('?') }}).
      when: "not ansible_check_mode and not (riftbreaker_runtime_log_present | default(false) | bool)"
  rescue:
    - name: Rollback — neuen Mod-Ordner verwerfen
      file:
        path: "{{ riftbreaker_mod_dir }}"
        state: absent
      when: riftbreaker_mod_backup is defined and (riftbreaker_mod_backup.changed | default(false))

    - name: Rollback — Backup nach mods/ einspielen
      command:
        argv:
          - tar
          - -xzf
          - "{{ riftbreaker_mod_backup_path }}"
          - -C
          - "{{ riftbreaker_mods_dir }}"
      when: riftbreaker_mod_backup is defined and (riftbreaker_mod_backup.changed | default(false))

    - name: Rollback — Container neu starten (alten Stand laden)
      command: >-
        docker compose -f {{ riftbreaker_deploy_dir }}/docker-compose.yml
        up -d --force-recreate --remove-orphans
      when: riftbreaker_mod_backup is defined and (riftbreaker_mod_backup.changed | default(false))

    - name: Deploy als fehlgeschlagen werten (Guard/Verifikation)
      fail:
        msg: >-
          riftbreaker-server-Deploy fehlgeschlagen — Guard bzw. Artefakt-/
          Runtime-Log-Verifikation nicht erfüllt.
          {{ ('Aus Backup zurückgerollt (' ~ riftbreaker_mod_backup_path ~ ').')
             if (riftbreaker_mod_backup is defined and (riftbreaker_mod_backup.changed | default(false)))
             else 'Kein Backup vorhanden (Erst-Deploy) — nichts zurückgerollt.' }}

- name: Container sicherstellen (ohne Mod-Änderung/Guard-Eingriff)
  when: not (riftbreaker_mod_update_needed or riftbreaker_guard_moved)
  command: docker compose -f {{ riftbreaker_deploy_dir }}/docker-compose.yml up -d --remove-orphans
  register: riftbreaker_up_idle
  changed_when: >-
    ('Recreated' in riftbreaker_up_idle.stdout)
    or ('Created' in riftbreaker_up_idle.stdout)
    or ('Started' in riftbreaker_up_idle.stdout)

- name: Handlers flushen (falls Config/Compose ohne Mod-Änderung geändert wurden)
  meta: flush_handlers
