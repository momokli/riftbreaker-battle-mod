---
# Disk-Space-Gate (Issue #310) — bricht den Deploy ab, BEVOR Image-Build und
# Backup-Tarball Platz verbrauchen. Ein halbfertiger Deploy auf einer vollen
# Platte ist der schlimmste Zustand: planet baut/sichert/deployt auf derselben
# Platte, die der Stack vollschreibt — dann kann man sich nicht mehr
# herausdeployen.
#
# Aufruf: NICHT aus der Rolle selbst (die läuft erst NACH
# dedicated-server-image), sondern als Preflight aus den Playbooks, die vor den
# Rollen laufen (deploy/site.yml, deploy/test-deploy.yml):
#   include_role: {name: riftbreaker-server, tasks_from: disk-preflight}
#
# Read-only → läuft im --check unverändert und ändert nichts. Schwelle
# konfigurierbar über riftbreaker_disk_min_free_gb (Default 10) und
# riftbreaker_disk_mount (Default "/"), siehe defaults/main.yml.
#
# Fallback (Issue #586, Live-Befund WSL2): der `ansible_mounts`-Fact kommt auf
# manchen Systemen (beobachtet unter WSL2/Ubuntu) leer zurück — kein Fehler,
# einfach ein leeres Ergebnis. Ohne Fallback fiel das Gate dadurch still auf
# "0 Bytes frei" zurück und blockierte den Deploy dauerhaft, UNABHÄNGIG vom
# echten Speicherstand (0.0 GB blieb exakt gleich, egal wie viel frei gemacht
# wurde) — "konnte nicht gemessen werden" sah aus wie "Platte voll". Deshalb
# hier: erst ansible_mounts versuchen, bei leerem Treffer auf `df` zurückfallen
# (portabel, jedes Linux/WSL2 hat coreutils), und nur wenn WIRKLICH beides
# nichts liefert, laut mit einer eigenen Fehlermeldung abbrechen statt still 0
# anzunehmen. Der `df`-Aufruf selbst darf dabei nicht hart scheitern (z. B.
# --output auf busybox/Alpine nicht unterstuetzt, oder der Mount existiert
# nicht) — sonst killt ein roher Modul-Fehler den Lauf, BEVOR die eigene
# Fail-Meldung greifen kann (Review-Blocker #586). Echter Notausgang fuer den
# "beides liefert nichts"-Fall: riftbreaker_disk_skip_unknown=true (Default
# false) — NICHT riftbreaker_disk_min_free_gb=0, das wirkt hier nicht, weil
# dieser Fail unabhaengig von der Schwelle ausgeloest wird.

- name: "Disk-Gate — freien Platz aus ansible_mounts lesen ({{ riftbreaker_disk_mount }}, #310)"
  vars:
    riftbreaker_disk_mount_match: >-
      {{ (ansible_mounts | default([]))
         | selectattr('mount', 'equalto', riftbreaker_disk_mount)
         | list }}
  set_fact:
    riftbreaker_disk_avail_bytes: "{{ riftbreaker_disk_mount_match[0].size_available | int }}"
  when: riftbreaker_disk_mount_match | length > 0

- name: "Disk-Gate — Fallback ueber df, wenn ansible_mounts nichts liefert ({{ riftbreaker_disk_mount }}, #310/#586)"
  command: "df --output=avail -B1 {{ riftbreaker_disk_mount }}"
  register: riftbreaker_disk_df_fallback
  changed_when: false
  check_mode: false
  # Review-Blocker 2 (#586): OHNE failed_when:false killt ein df-Fehlschlag
  # (z. B. --output auf busybox/Alpine nicht unterstuetzt, oder
  # riftbreaker_disk_mount existiert nicht) den Lauf mit einem rohen
  # Modul-Fehler und umgeht damit die eigene, ehrliche Fail-Meldung unten.
  # Der rc wird stattdessen explizit im naechsten Task geprueft.
  failed_when: false
  when: riftbreaker_disk_avail_bytes is not defined

- name: "Disk-Gate — df-Ausgabe als Bytes uebernehmen (#310/#586)"
  set_fact:
    riftbreaker_disk_avail_bytes: "{{ riftbreaker_disk_df_fallback.stdout_lines[1] | trim | int }}"
  when:
    - riftbreaker_disk_avail_bytes is not defined
    - riftbreaker_disk_df_fallback is not skipped
    - riftbreaker_disk_df_fallback.rc | default(1) == 0
    - (riftbreaker_disk_df_fallback.stdout_lines | default([])) | length > 1

- name: "Disk-Gate — Speicherplatz nicht ermittelbar, aber explizit erlaubt (#310/#586, riftbreaker_disk_skip_unknown)"
  debug:
    msg: >-
      WARNUNG: Speicherplatz auf {{ riftbreaker_disk_mount }} ({{ inventory_hostname }})
      konnte weder über ansible_mounts noch über `df` ermittelt werden (rc=
      {{ riftbreaker_disk_df_fallback.rc | default('n/a') }}). Der Groessen-Check wird
      wegen riftbreaker_disk_skip_unknown=true ÜBERSPRUNGEN — der Deploy läuft auf
      eigenes Risiko weiter, ohne dass irgendjemand geprüft hat, ob genug Platz frei ist.
  when:
    - riftbreaker_disk_avail_bytes is not defined
    - riftbreaker_disk_skip_unknown | bool

- name: "Disk-Gate — Speicherplatz konnte nicht ermittelt werden (#310/#586)"
  fail:
    msg: >-
      Speicherplatz auf {{ riftbreaker_disk_mount }} ({{ inventory_hostname }}) konnte
      weder über ansible_mounts noch über `df` ermittelt werden (rc=
      {{ riftbreaker_disk_df_fallback.rc | default('n/a') }}) — das Gate kann so nicht
      sicher prüfen, ob genug Platz frei ist. Kein stiller Fallback auf "genug Platz"
      (siehe Issue #586). Prüf von Hand (`df -h {{ riftbreaker_disk_mount }}`) und
      überschreib bei Bedarf mit `-e riftbreaker_disk_skip_unknown=true`, wenn du
      weißt, dass genug frei ist (Achtung: das setzt den GRÖSSEN-CHECK komplett aus,
      nicht nur die Schwelle — `riftbreaker_disk_min_free_gb=0` bewirkt HIER nichts,
      weil dieser Fail unabhängig von der Schwelle ausgelöst wird).
  when:
    - riftbreaker_disk_avail_bytes is not defined
    - not (riftbreaker_disk_skip_unknown | bool)

- name: "Disk-Gate — freien Platz auf {{ riftbreaker_disk_mount }} prüfen (vor Image-Build/Backup, #310)"
  vars:
    riftbreaker_disk_threshold_bytes: "{{ (riftbreaker_disk_min_free_gb | float) * 1073741824 }}"
  assert:
    that:
      - riftbreaker_disk_avail_bytes | float >= riftbreaker_disk_threshold_bytes | float
    fail_msg: >-
      PLATZ-GATE: nur {{ (riftbreaker_disk_avail_bytes | float / 1073741824) | round(1) }} GB
      frei auf {{ riftbreaker_disk_mount }} ({{ inventory_hostname }}) — gefordert sind
      {{ riftbreaker_disk_min_free_gb }} GB. Deploy abgebrochen, BEVOR Image-Build und
      Backup-Tarball Platz verbrauchen (der halbfertige Deploy auf voller Platte ist der
      schlimmste Zustand). Naechster Schritt: erst aufraeumen (Docker-Images/Logs/Backups,
      siehe Issue #301), dann erneut deployen.
    success_msg: >-
      Platz-Gate OK: {{ (riftbreaker_disk_avail_bytes | float / 1073741824) | round(1) }} GB
      frei auf {{ riftbreaker_disk_mount }} (>= {{ riftbreaker_disk_min_free_gb }} GB).
  when: riftbreaker_disk_avail_bytes is defined
