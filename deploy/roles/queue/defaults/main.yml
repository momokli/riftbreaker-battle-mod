---
# Defaults der Rolle queue (Queue-Dienst pro Env, Issue #998).
#
# Der Dienst paart Spieler (casual, aktiv 1v1, FIFO), provisioniert bei einer
# Paarung KALT zwei frische VS-Welten (A/B), registriert beide Spieler im
# Referee (`POST /lobby`) und fuehrt den Match-Record. Kein Warm-Pool, kein MMR.
# Er ist ein kleiner Python-Dienst (Standardbibliothek) und spricht Provisioner
# + Referee ausschliesslich per HTTP an — bewusst KEIN Docker-Code hier.
#
# Haertung wie capsule-flow/parked-pool (#424): Bind nur 127.0.0.1, Bearer-Token
# PFLICHT (fail-closed) — deshalb bricht die Rolle ohne gesetztes
# `vault_queue_token` ab (siehe tasks/main.yml).

# Env-Namensraum. Das deployende Play setzt ihn explizit (dev/staging/prod);
# so haengen Unit-/Install-/Env-Datei-Namen am jeweiligen Play.
queue_env: "{{ rift_env | default('dev') }}"

# systemd-Unit + Installationsort + Entry-Point (env-parametrisiert).
queue_unit: "rbmods-queue-{{ queue_env }}"
queue_install_dir: "/opt/rbmods/queue-{{ queue_env }}"
queue_bin: "{{ queue_install_dir }}/queue_service.py"
queue_python: /usr/bin/python3

# Der Queue-Dienst startet selbst keinen Container (er spricht Provisioner/
# Referee per HTTP) — deshalb KEINE harte docker.service-Abhaengigkeit.
queue_require_docker_service: false

# Netz: ausschliesslich localhost (der Relay ruft dorthin).
queue_bind: 127.0.0.1
# Eigener Port (frei neben Parked 9201 / Kapsel 9211).
queue_port: 9221

# Nachbarn (HTTP). Provisioner-Port (Default 8094), Referee = tournament-server
# (dev-Port 8081, docs/VS_MATCH.md) — Default spiegelt den dev-Wert wie die
# Nachbar-Defaults im gns-relay (capsule/queue).
queue_provisioner_url: "http://127.0.0.1:8094"
queue_provisioner_timeout: 30
queue_referee_url: "http://127.0.0.1:8081"
queue_timeout: 5
queue_log_level: INFO

# Match-Modell (generisch gebaut, aktiv nur 1v1).
queue_team_size: 1
queue_allow_teams: false

# Zustandsverzeichnis (Match-Record, JSON-Datei — uebersteht einen Restart).
queue_state_dir: "/var/lib/rbmods/queue-{{ queue_env }}"

# Token-Quellen: NUR der Vault. Die Werte landen nie im Repo, nie im Log — die
# Unit liest sie aus einer 0600-Datei (EnvironmentFile), nicht aus `Environment=`.
queue_token: "{{ vault_queue_token | default('') }}"
queue_provisioner_token: "{{ vault_provisioner_token | default('') }}"
queue_referee_token: "{{ vault_referee_token | default('') }}"

queue_env_file: "/etc/rbmods/queue-{{ queue_env }}.env"

# Quell-Skripte im Repo (aus dem Deploy-Checkout).
queue_service_src: "{{ playbook_dir }}/queue/queue_service.py"
queue_flow_src: "{{ playbook_dir }}/queue/queue_flow.py"
queue_core_src: "{{ playbook_dir }}/queue/queue_core.py"
queue_identity_src: "{{ playbook_dir }}/queue/identity.py"
