---
# Rolle: queue — Queue-Dienst pro Env (Issue #998). Muster: capsule-flow (#931).
#
# Der Dienst laeuft als lokaler HTTP-Dienst (er spricht Provisioner + Referee
# nur per HTTP an — kein Docker-Socket-Zugriff). Er bindet nur 127.0.0.1 und
# verlangt fuer JEDEN Request einen Bearer-Token (fail-closed, wenn
# `queue_token` gesetzt ist — die Rolle setzt ihn aus dem Vault).

- name: "Vorbedingung: Bearer-Token gesetzt (kein offener Queue-Endpunkt)"
  assert:
    that:
      - queue_token | length > 0
    fail_msg: >-
      Das Bearer-Token (queue_token) ist leer. Der Queue-Dienst hat einen
      Bearer-Token PFLICHT (#998, Haertung wie #424) und wuerde ohne ihn gar
      nicht starten. Token im Vault (host_vars/planet/vault.yml) setzen:
      `ansible-vault edit deploy/inventory/host_vars/planet/vault.yml`.
    success_msg: "Queue-Token vorhanden (Wert wird nie geloggt)."
  when: not ansible_check_mode

- name: Installationsverzeichnis anlegen
  file:
    path: "{{ queue_install_dir }}"
    state: directory
    mode: "0755"

- name: Umgebungsverzeichnis anlegen
  file:
    path: "{{ queue_env_file | dirname }}"
    state: directory
    mode: "0755"

- name: Zustandsverzeichnis anlegen (Match-Record, #998/US5)
  file:
    path: "{{ queue_state_dir }}"
    state: directory
    mode: "0750"

- name: Dienst-Skript installieren
  copy:
    src: "{{ queue_service_src }}"
    dest: "{{ queue_bin }}"
    mode: "0755"
    owner: root
    group: root
  notify: restart queue

- name: Queue-Flow-Bibliothek installieren (queue_flow.py, #998)
  copy:
    src: "{{ queue_flow_src }}"
    dest: "{{ queue_install_dir }}/queue_flow.py"
    mode: "0644"
    owner: root
    group: root
  notify: restart queue

- name: Queue-Kern-Bibliothek installieren (queue_core.py, #998)
  copy:
    src: "{{ queue_core_src }}"
    dest: "{{ queue_install_dir }}/queue_core.py"
    mode: "0644"
    owner: root
    group: root
  notify: restart queue

- name: Identitaets-Bibliothek installieren (identity.py, #998)
  copy:
    src: "{{ queue_identity_src }}"
    dest: "{{ queue_install_dir }}/identity.py"
    mode: "0644"
    owner: root
    group: root
  notify: restart queue

- name: Umgebungsdatei rendern (Token, 0600 — nie world-readable)
  template:
    src: rbmods-queue.env.j2
    dest: "{{ queue_env_file }}"
    mode: "0600"
    owner: root
    group: root
  notify: restart queue

- name: systemd-Unit rendern
  template:
    src: rbmods-queue.service.j2
    dest: "/etc/systemd/system/{{ queue_unit }}.service"
    mode: "0644"
  notify: restart queue

- name: Unit aktivieren und starten
  systemd:
    name: "{{ queue_unit }}"
    state: started
    enabled: true
    daemon_reload: true
  register: queue_systemd
  # Erster Deploy im PR-Gate (`--check`): der Check-Modus schreibt die Unit-Datei
  # NICHT, deshalb kennt systemd den Service noch nicht („Could not find the
  # requested service"). Nur genau diesen einen Fall tolerieren.
  failed_when: >-
    queue_systemd is failed and not
    (ansible_check_mode | bool and
     'Could not find the requested service' in (queue_systemd.msg | default('')))