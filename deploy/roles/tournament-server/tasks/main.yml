---
# Rolle: tournament-server — systemd-Unit (Rust/axum aus tournament/).
#
# Binary-Quelle: wird auf dem Control-Node (planet) aus dem Repo-Checkout
# gebaut. Die Rolle stellt die Rust-Toolchain (rustup) idempotent bereit und
# baut `cargo build --release` selbst — kein implizites Fremd-Bauen, kein
# CI-Artefakt-Pull. Die Web-UI kommt direkt aus dem Repo-Checkout.

- name: Cargo-Home anlegen
  file:
    path: "{{ cargo_home }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Rust-Toolchain prüfen (cargo auf dem Control-Node)
  command: "{{ cargo_bin }} --version"
  delegate_to: localhost
  become: false
  register: cargo_version
  changed_when: false
  failed_when: false

- name: rustup-init herunterladen (nur wenn cargo fehlt)
  get_url:
    url: "{{ rustup_init_url }}"
    dest: "{{ cargo_home }}/rustup-init.sh"
    mode: "0755"
    force: true
  delegate_to: localhost
  become: false
  when: cargo_version.rc != 0

- name: Rust-Toolchain installieren (rustup, idempotent)
  command: >-
    {{ cargo_home }}/rustup-init.sh -y --default-toolchain stable
    --profile minimal --no-modify-path
  delegate_to: localhost
  become: false
  environment:
    RUSTUP_HOME: "{{ rustup_home }}"
    CARGO_HOME: "{{ cargo_home }}"
  when: cargo_version.rc != 0

- name: tournament-server bauen (cargo build --release)
  command: "{{ cargo_bin }} build --release"
  args:
    chdir: "{{ playbook_dir }}/../tournament"
  delegate_to: localhost
  become: false
  environment:
    RUSTUP_HOME: "{{ rustup_home }}"
    CARGO_HOME: "{{ cargo_home }}"
  register: tourney_build
  changed_when: "'Compiling' in (tourney_build.stdout ~ tourney_build.stderr)"

- name: Build-Ergebnis prüfen (Binary muss existieren)
  stat:
    path: "{{ tournament_binary_src }}"
  delegate_to: localhost
  become: false
  register: tourney_bin_src

- name: Build-Anforderung bei fehlendem Binary
  fail:
    msg: >-
      tournament-server Build fehlgeschlagen oder Binary fehlt unter
      {{ tournament_binary_src }}. Build-Log oben prüfen.
  when: not tourney_bin_src.stat.exists

- name: Installationsverzeichnis anlegen
  file:
    path: "{{ tournament_install_dir }}"
    state: directory
    mode: "0755"

- name: Binary deployen
  copy:
    src: "{{ tournament_binary_src }}"
    dest: "{{ tournament_install_dir }}/tournament-server"
    mode: "0755"
    owner: root
    group: root
  notify: restart tournament-server

- name: Web-UI deployen
  copy:
    src: "{{ playbook_dir }}/../tournament/web"
    dest: "{{ tournament_install_dir }}"
    mode: "0644"

- name: systemd-Unit rendern
  template:
    src: tournament-server.service.j2
    dest: "/etc/systemd/system/{{ tournament_unit }}.service"
    mode: "0644"
  notify: restart tournament-server

- name: Unit aktivieren und starten
  systemd:
    name: "{{ tournament_unit }}"
    state: started
    enabled: true
    daemon_reload: true
