---
# Rolle: tournament-server (Issue #275) — baut rb-tournament:<deploy-sha> auf dem
# Zielhost aus tournament/ (Multi-Stage-Dockerfile). Kein rustup/cargo mehr auf
# dem Control-Node, kein Binary-Copy, keine systemd-Unit.
#
# WICHTIG (Reihenfolge, Design R5): diese Rolle läuft in site.yml/test-deploy.yml
# VOR riftbreaker-server. Das Compose dort publiziert (Prod) 127.0.0.1:8081 und
# startet den Tournament-Container; die frühere systemd-Unit muss vorher weg sein,
# sonst Bind-Konflikt auf 8081.
#
# Idempotenz: Der Tag ist der Deploy-SHA. Existiert das Image bereits → kein
# Build; sonst Docker-Layer-Cache. Vor dem Compose-Up wird hart geprüft, dass das
# Image existiert.

- name: Build-Kontext-Verzeichnis sicherstellen
  file:
    path: "{{ tournament_build_context_dir }}"
    state: directory
    mode: "0755"

- name: Build-Kontext synchronisieren (tournament/)
  copy:
    src: "{{ playbook_dir }}/../tournament/"
    dest: "{{ tournament_build_context_dir }}/"
    mode: preserve
    directory_mode: "0755"
  register: tournament_build_context

# Read-only-Abfrage, läuft auch im --check (check_mode: false).
- name: Image-Existenz prüfen ({{ tournament_image }})
  command: docker image inspect "{{ tournament_image }}"
  register: tournament_image_info
  changed_when: false
  failed_when: false
  check_mode: false

- name: Tournament-Image bauen (nur bei fehlendem Tag)
  command: >-
    docker build --tag {{ tournament_image }} {{ tournament_build_context_dir }}
  when:
    - not ansible_check_mode
    - tournament_image_info.rc != 0
  register: tournament_image_build
  changed_when: tournament_image_build.rc == 0
  failed_when: tournament_image_build.rc != 0

- name: Image garantiert vorhanden, bevor das Compose startet
  assert:
    that:
      - tournament_image_info.rc == 0
        or (tournament_image_build.rc | default(1)) == 0
    fail_msg: >-
      Image {{ tournament_image }} fehlt und wurde nicht erfolgreich gebaut —
      Compose-Start wird abgebrochen. Kontext: {{ tournament_build_context_dir }}
  when: not ansible_check_mode

- name: Hinweis im --check (kein Build, kein Containerstart)
  debug:
    msg: >-
      --check: Build von {{ tournament_image }} übersprungen
      (Image {{ 'vorhanden' if tournament_image_info.rc == 0 else 'fehlt' }}).
  when: ansible_check_mode

# --- Legacy-systemd entfernen (Issue #275, Design D7/ US4) -------------------
# Die frühere systemd-Unit (Host-Prozess auf Port 8081) wird idempotent entfernt.
# Der Installationspfad/Binary bleibt absichtlich liegen (Rollback-Sicherheit) —
# nur die Unit verschwindet. Läuft auch, wenn keine Unit existiert (stat-guarded).

- name: Legacy-Unit prüfen ({{ tournament_legacy_unit }})
  stat:
    path: "/etc/systemd/system/{{ tournament_legacy_unit }}.service"
  register: tournament_legacy_unit_stat
  check_mode: false

- name: Legacy-Unit stoppen + deaktivieren (nur wenn vorhanden)
  systemd:
    name: "{{ tournament_legacy_unit }}"
    state: stopped
    enabled: false
  when: tournament_legacy_unit_stat.stat.exists

- name: Legacy-Unit-Datei entfernen
  file:
    path: "/etc/systemd/system/{{ tournament_legacy_unit }}.service"
    state: absent
  when: tournament_legacy_unit_stat.stat.exists

- name: systemd-Manager neu laden (Unit-Entfernung sichtbar machen)
  systemd:
    daemon_reload: true
  when: tournament_legacy_unit_stat.stat.exists
