---
# Defaults der Rolle tournament-server (Issue #275) — baut rb-tournament:<deploy-sha>
# auf dem Zielhost aus dem Image-Rezept tournament/Dockerfile.
#
# Das Image ist die Laufzeit des Tournament-Servers (Rust/axum). Es läuft als
# zweiter Service im Compose der Rolle riftbreaker-server (gleiches default-Netz
# → der Tournament-Container erreicht die Dedi-Bridge per Docker-DNS). Kein
# Host-Build (rustup/cargo) und keine systemd-Unit mehr.
#
# Idempotenz: Tag = Deploy-SHA (kein `latest`). Existiert das Image, kein Build;
# sonst greift der Docker-Layer-Cache. Das Compose pinnt exakt diesen Tag.
tournament_build_context_dir: /opt/rbmods/tournament-build
tournament_image_name: rb-tournament
tournament_image: "{{ tournament_image_name }}:{{ deploy_image_tag }}"
# Legacy-systemd-Unit, die dieser Deploy ablöst (idempotent entfernt).
tournament_legacy_unit: tournament-server
