---
# Defaults der Rolle tournament-server (systemd, Rust/axum).
#
# Das Binary wird auf dem Control-Node (planet) aus dem Repo-Checkout gebaut
# (`cd tournament && cargo build --release`). Die Rust-Toolchain (rustup) liegt
# unter /opt/rbbattle-deploy — im Datenverzeichnis des deploy-Users, damit alles
# Deploy-Zubehör an einem Ort bleibt. Die Rolle stellt die
# Toolchain idempotent bereit (installiert nur, wenn cargo fehlt).
tournament_binary_src: "{{ playbook_dir }}/../tournament/target/release/tournament-server"
rustup_home: /opt/rbbattle-deploy/rustup
cargo_home: /opt/rbbattle-deploy/cargo
cargo_bin: "{{ cargo_home }}/bin/cargo"
rustup_init_url: https://sh.rustup.rs

# Netz (Issue #298): Loopback-Bind ist der Default — der rift-caddy laeuft mit
# network_mode host und proxyt /tournament/* dorthin. Direkte Sprecher auf
# planet (Queue-systemd) sind host-lokal. Bewusst per `-e tournament_host=...`
# ueberschreibbar (dann aber gewollt offen).
tournament_host: 127.0.0.1

# Token-Quelle (Issue #298): ausschliesslich der Vault. Der Wert landet nie im
# Repo, nie im Log — die Unit liest ihn aus einer 0600-Datei (EnvironmentFile),
# nicht aus dem world-readable `Environment=`. Leer = fail-closed: die Rolle
# bricht ab (tasks/main.yml). EINE Quelle fuer Rust + Caddy + Queue
# (`vault_tournament_token`).
tournament_token: "{{ vault_tournament_token | default('') }}"
# EnvironmentFile (0600) mit Token + uebrigen Laufzeitwerten. Pro Unit (env-
# parametrisiert), damit dev/prod auf planet nicht kollidieren.
tournament_env_file: "/etc/rbmods/{{ tournament_unit }}.env"

# Deploy-Identitaet (Issue #483, US4): Fallback, damit die systemd-Vorlage auch
# ohne die Plays renderbar bleibt. Die Plays setzen rift_env als Play-Var;
# rift_deploy_ref/rift_deploy_identity kommen aus deploy/tasks/deploy-identity.yml
# (set_fact schlaegt diese Defaults).
rift_env: unknown
rift_deploy_ref: unknown
