---
# Defaults der Rolle crash-collector (systemd-Dauerdienst, Issue #462).
#
# Kleiner Host-Collector: beobachtet `docker logs -f` des Dedicated-Servers auf
# Crash-Marker und sichert die Crash-Artefakte (Minidump + Trace + Log) aus dem
# Wine-Volume persistiert nach {{ crash_collector_dir }} — inkl. Kontext,
# Meta und Retention. Muster: host-hygiene (Skript + Unit), hier als
# Dauer-Service (Type=simple) statt Timer.

# systemd-Unit + installiertes Skript.
crash_collector_unit: rbmods-crash-collector
crash_collector_bin: /usr/local/bin/rbmods-crash-collector.sh
crash_collector_script_src: "{{ playbook_dir }}/crash-collector/crash_collector.sh"

# Minidump-Parser (Issue #481): eigenstaendiger stdlib-Helper, den der Collector
# per RB_CRASH_MINIDUMP_PY aufruft. Liegt bewusst NICHT als Geschwister des
# Collector-Binaries (dieses heisst rbmods-crash-collector.sh) -> expliziter Pfad.
crash_collector_helper: /usr/local/bin/rbmods-minidump-meta.py
crash_collector_helper_src: "{{ playbook_dir }}/crash-collector/minidump_meta.py"

# Zielverzeichnis der Bundles (Issue #605): <env>/<ref>/<ts>-<uuid>).
crash_collector_dir: /opt/rbmods/crashes

# Environment-Name fuer den Bundle-Pfad (Issue #605): <env>/<ref>/<ts>-<uuid>.
# Kommt aus der Deploy-Identitaet (rift_env, Play-Var in site.yml/deploy-prod.yml/
# test-deploy.yml) und landet als RB_CRASH_ENV in der systemd-Unit.
crash_collector_env: "{{ rift_env }}"

# Build-Ref fuer den Bundle-Pfad + meta.json (Issue #607): DERSELBE ref wie in
# die Binaries gebacken (scripts/build_ref.sh -> RBB_BUILD_REF). Kommt aus
# deploy/tasks/deploy-identity.yml (rift_build_ref, set_fact) und landet als
# RB_CRASH_REF in der systemd-Unit. Leer (z. B. local-deploy ohne deploy-identity)
# -> der Collector faellt auf den Image-Tag (git_sha) zurueck.
crash_collector_ref: "{{ rift_build_ref | default('') }}"

# Beobachteter Container (derselbe wie server-control/riftbreaker-server —
# kein zweiter Name, der auseinanderlaufen kann).
crash_collector_container: "{{ riftbreaker_server_container }}"

# crash_info-Pfad IM Container (Wine-Prefix im benannten Volume rb-wine).
crash_collector_crashinfo: "/data/.wine/drive_c/users/steamuser/Documents/The Riftbreaker/crash_info"

# context.log: letzte N Container-Zeilen zum Crash-Zeitpunkt.
crash_collector_context_lines: 200

# Retention: so viele Bundles bleiben liegen; aeltere crash_info-Dateien im
# Wine-Volume werden ebenfalls auf diese Anzahl gekuerzt (#462: unbegrenztes
# Wachstum, Befund 39 Dateien).
crash_collector_retention: 20

# Wartezeit auf die Dump-Datei nach dem Marker / Reconnect-Pause des Streams.
crash_collector_wait_secs: 30
crash_collector_retry_sleep: 5

# 1 = crash_info im Container auf die Retention kuerzen.
crash_collector_prune_wine: 1

# Python fuer das meta.json-Rendering + den Minidump-Parser (auf planet vorhanden).
crash_collector_python: /usr/bin/python3

# --- Symbolik (Issue #480) ---------------------------------------------------
# Collector-seitig: die PDB (252 MB) bleibt AUSSERHALB des Images (kein
# Groessen-/Startzeit-Regress). llvm-symbolizer loest die Minidump-Adressen
# gegen die bereits auf dem Host liegende DLL/PDB auf.
# Diese Rolle rollt ausdruecklich NUR die Skripte aus — keine PDB/DLL.
# Hintergrund/Entscheidung: docs/crash-symbolication.md (Issue #480).
crash_collector_symbolize: true
crash_collector_symbolize_bin: /usr/local/bin/rbmods-crash-symbolize.sh
crash_collector_symbolize_script_src: "{{ playbook_dir }}/crash-collector/crash_symbolize.sh"
crash_collector_symbolize_tool_dir: /usr/local/lib/rbmods/crash
crash_collector_symbolize_tool_src: "{{ playbook_dir }}/crash-collector/symbolize.py"
crash_collector_symbolize_tool: "{{ crash_collector_symbolize_tool_dir }}/symbolize.py"
# DLL/PDB des Laufzeit-Images. Pfad-Schema `<env>` (Issue #483, Ziel B):
# aus dem je Env gesetzten {{ riftbreaker_game_dir }} abgeleitet (vorher fest
# /srv/rbgame = dev-Pfad — prod haette nach dem Rename die dev-Symbole gelesen).
crash_collector_dll: "{{ riftbreaker_game_dir | default('/srv/rift-dev/game') }}/bin/riftbreaker_dll_win_release.dll"
crash_collector_pdb: "{{ riftbreaker_game_dir | default('/srv/rift-dev/game') }}/bin/riftbreaker_dll_win_release.pdb"
crash_collector_llvm_symbolizer: /usr/lib/llvm-18/bin/llvm-symbolizer
crash_collector_symbolize_timeout: 60
# Zweites Modul (Issue #559): die injizierte DLL rbbridge.dll (mingw -g).
# Liegt gestaged auf dem Host; optional — fehlt sie, symbolisiert der Collector
# weiterhin nur die Game-DLL (graceful, kein Hard-Fail). Pfad-Schema `<env>`
# (Issue #483): aus dem je Env gesetzten {{ rbtools_dir }} abgeleitet (vorher
# fest top-level /opt/rbmods/rbtools — Issue #601 kopierte so die falsche DLL).
crash_collector_rbbridge_dll: "{{ rbtools_dir }}/rbbridge.dll"
