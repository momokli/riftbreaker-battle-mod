---
# Defaults der Rolle mods-zip (Paketierung + md5-Parität).
# Paketierung läuft auf dem Control-Node (scripts/package.sh),
# das Zip wird nach planet kopiert und die md5-Parität hart geprüft.

# Deploy-Identitaet (Issue #483, US4): ZUSÄTZLICHES, env-getaggtes Zip.
# `mods_zip_name` (rbbattle.zip) + die md5-Parität bleiben UNVERÄNDERT — der
# env-getaggte Name ist rein additiv (Nachvollziehbarkeit je Deploy).
rift_env: unknown
rift_deploy_ref: unknown
mods_zip_env_name: "rbbattle-{{ rift_env }}-{{ rift_deploy_ref }}.zip"
mods_zip_env_dest: "{{ website_mods_dir }}/{{ mods_zip_env_name }}"
