---
# Rolle: headless-client-image (Issue #209) — baut rb-headless-client:<deploy-sha>
# auf dem Zielhost. Das Image ist die Wine-Laufzeit für :6321.
#
# Idempotenz:
#   * Der Tag ist der Deploy-SHA. Ändert sich nichts, existiert das Image
#     bereits -> kein Build, kein `changed`.
#   * Ändert sich der Stand, greift der Docker-Layer-Cache (Dockerfile-/
#     Kontext-Hash) -> der Rebuild ist billig, kein erneuter Layer-Download.
# Vor dem Containerstart wird hart geprüft, dass das Image existiert.

- name: Build-Kontext-Verzeichnis sicherstellen
  file:
    path: "{{ headless_client_context_dir }}"
    state: directory
    mode: "0755"

- name: Build-Kontext synchronisieren (tools/headless-client)
  copy:
    src: "{{ playbook_dir }}/../tools/headless-client/"
    dest: "{{ headless_client_context_dir }}/"
    mode: preserve
    directory_mode: "0755"
  register: headless_client_context

# Read-only-Abfrage, läuft auch im --check (check_mode: false), damit der
# PR-Gate denselben Zustand sieht wie der echte Deploy.
- name: Image-Existenz prüfen (rb-headless-client:{{ deploy_image_tag }})
  command: docker image inspect "{{ headless_client_image }}"
  register: headless_client_image_info
  changed_when: false
  failed_when: false
  check_mode: false

- name: Headless-Client-Image bauen (nur bei fehlendem Tag)
  command: >-
    docker build --tag {{ headless_client_image }} {{ headless_client_context_dir }}
  when: headless_client_image_info.rc != 0
  register: headless_client_build
  changed_when: headless_client_build.rc == 0
  failed_when: headless_client_build.rc != 0

# Kein stiller Weiterlauf in einen `pull access denied`-Fehler von Compose:
# fehlt das Image nach dem Build-Schritt, bricht der Deploy hier ab.
- name: Image garantiert vorhanden, bevor Container starten
  assert:
    that:
      - headless_client_image_info.rc == 0
        or (headless_client_build.rc | default(1)) == 0
    fail_msg: >-
      Image {{ headless_client_image }} fehlt und wurde nicht erfolgreich
      gebaut — Containerstart wird abgebrochen. Kontext:
      {{ headless_client_context_dir }}
  when: not ansible_check_mode
