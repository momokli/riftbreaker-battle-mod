---
# Defaults der Rolle headless-client-image (Issue #209).
#
# Das Headless-Client-Image (Wine + Xvfb + Mesa-llvmpipe) ist die Laufzeit
# für den Dev-SP-Server (:6321). Es wird IM Playbook auf planet gebaut —
# es gibt kein vorgebautes Image und keinen
# CI-Push nach GHCR. Der Tag enthält den Deploy-SHA, damit das gerenderte
# docker-compose.yml exakt diesen Stand pinnt (kein `latest`).

# Staging-Verzeichnis für den Build-Kontext auf dem Zielhost. Der Kontext wird
# aus dem Repo-Checkout (tools/headless-client) dorthin synchronisiert, damit
# ein from-zero-Lauf auch dann funktioniert, wenn der Control-Node nicht der
# Zielhost ist (beim CD ist beides planet).
headless_client_context_dir: /opt/rbmods/headless-client
