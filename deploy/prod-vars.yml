---
# Prod-Instanz-Overrides (Issue #328) — zweiter Dedicated-Server auf planet,
# öffentlich erreichbar über den Satellite-Relay (satellite:6321 -> planet:6322).
#
# Analog deploy/test-vars.yml (Boot-Test-Instanz). Wird nur von
# deploy/deploy-prod.yml via -e @deploy/prod-vars.yml benutzt.
#
# Prod läuft KOEXISTIEREND mit dev (main, :6321): eigene Container-/Port-/
# Pfad-/Volume-Namen, kein Clash. Das Einfrieren auf einen Git-Tag
# (Tag-Deployment) ist Follow-up — hier wird der Image-Tag wie dev aus dem
# Checkout-SHA abgeleitet.

# Eigene Container-/Port-Namen (dev = 6321 bleibt unberührt).
riftbreaker_server_container: riftbreaker-dedicated-prod
riftbreaker_server_port_udp: 6322
# Compose-Projekt EXPLIZIT (Issue #483, Ziel B): der Verzeichnis-Basename ist im
# neuen Schema ueberall "riftbreaker" — ohne diesen Wert kollidierten dev und
# prod im Compose-Projektnamen/Netz.
#
# Variante (a), Befund 2: HISTORISCHER Projektname BEIBEHALTEN
# (`riftbreaker-dedicated-prod` = Basename des ALTEN prod-Deploy-Verzeichnisses).
# Compose praefixt unbenannte Volumes mit dem Projektnamen; live heisst das
# prod-Volume `riftbreaker-dedicated-prod_rb-wine-prod` (+ `..._rb-saves-prod`).
# Eine Umbenennung auf `rift-prod` erzeugte neue leere Volumes und verwaiste den
# Wine-Prefix/die Saves der laufenden Instanz.
riftbreaker_compose_project: "riftbreaker-dedicated-prod"

# Eigener Game-Stand + Mod (wird im Tag-Workflow, Follow-up, eingefroren).
# Pfad-Schema `<env>` (Issue #483, Ziel B): /srv/rift-<env>/game|backups.
riftbreaker_game_dir: "/srv/rift-{{ rift_env }}/game"
riftbreaker_mod_dir: "{{ riftbreaker_game_dir }}/mods/rbbattle"
riftbreaker_backup_dir: "/srv/rift-{{ rift_env }}/backups"
# /opt/rbmods/compose/rift-<env>/riftbreaker (Ziel B; vorher riftbreaker-dedicated-prod).
riftbreaker_deploy_dir: "/opt/rbmods/compose/rift-{{ rift_env }}/riftbreaker"
riftbreaker_config_dir: "{{ riftbreaker_deploy_dir }}/config"

# Eigene persistente Volumes (Wine-Prefix + Saves).
riftbreaker_wine_volume: rb-wine-prod
riftbreaker_saves_volume: rb-saves-prod

# IO-Bridge isoliert von dev (9001) — sonst Kollision auf 127.0.0.1.
riftbreaker_bridge_port: 9002

# Bridge-Binaries (rbtools) isoliert von dev — Pfad-Schema `<env>` (Issue #483,
# Ziel B: /opt/rbmods/rbtools/<env>) statt der frueheren rbtools-rift/
# rbtools-staging-rift (Root cause #409: prod lief nach dem Refactor
# auf neuen Binaries statt auf dem eingefrorenen Tag-Stand).
rbtools_dir: "/opt/rbmods/rbtools/{{ rift_env }}"
rbtools_staging_dir: "/opt/rbmods/rbtools/{{ rift_env }}/.staging"

# Sidecars (Session-Recorder + Referee-Egress) isoliert von dev — die festen
# container_name-Werte (riftbreaker-sessions/-egress) würden sonst mit dem
# dev-Stack kollidieren. Eigener Sessions-Dir, damit die JSONL getrennt bleiben.
riftbreaker_sessions_container: riftbreaker-sessions-prod
riftbreaker_send_tailer_container: riftbreaker-send-tailer-prod
riftbreaker_sessions_dir: "/srv/rift-{{ rift_env }}/sessions"

# Content kommt per Sync aus dem kanonischen Cache (wie dev).
riftbreaker_content_mode: sync

# --- Tournament-Server (Referee + Web-UI, eigener Port/Unit/Install) ---------
# Prod-Zwilling: isoliert von dev (8081) auf 8082; bridge A zeigt auf die eigene
# prod-Bridge :9002 (kein Cross-Reference auf dev).
tournament_install_dir: /opt/rbmods/tournament-server-prod
tournament_unit: tournament-server-prod
tournament_port: 8082
tournament_bridge_a_url: "http://127.0.0.1:9002/exec"
tournament_bridge_b_url: "http://127.0.0.1:9002/exec"

# --- Server-Control (Prod-Zwilling des Host-Agenten, Issue #498) ------------
# Eigener Agent auf 8093 (dev bleibt 8092), eigene Unit/Install/Env-Datei —
# steuert den prod-Container (riftbreaker_server_container oben =
# riftbreaker-dedicated-prod). Das Token kommt aus dem Vault
# (vault_server_control_prod_token, gesetzt in deploy/deploy-prod.yml).
server_control_unit: server-control-prod
server_control_port: 8093
server_control_install_dir: /opt/rbmods/server-control-prod
server_control_env_file: /etc/rbmods/server-control-prod.env

# --- Website (Landing + Cockpit, eigener Caddy) -----------------------------
# Prod-Zwilling von dev: eigene Landing (www.rift.projectmellon.de) + eigenes
# Operator-Cockpit (cockpit.rift.projectmellon.de), eigener rift-caddy-prod-
# Container (plain HTTP) auf 127.0.0.1:8788 — isoliert von dev (rift-caddy
# :8787). Der geteilte Host-Caddy proxyt beide prod-Domains dorthin; die Bridge
# :9002 (oben) liefert das /contract/*-Panel.
landing_domain: www.rift.projectmellon.de
cockpit_domain: cockpit.rift.projectmellon.de
rift_caddy_container: rift-caddy-prod
rift_caddy_port: 8788
rift_caddy_deploy_dir: "/opt/rbmods/compose/rift-{{ rift_env }}/caddy"

# --- Crash-Collector (Prod-Zwilling, Issue #481) ----------------------------
# Eigene Unit + eigenes Bundle-Verzeichnis, damit "prod ist stabil" BELEGBAR
# ist (Marker im prod-Log -> Bundle unter crashes-prod, getrennt von dev).
# Der Container ist explizit der prod-Container (Default der Rolle waere
# ohnehin riftbreaker_server_container = riftbreaker-dedicated-prod).
crash_collector_unit: rbmods-crash-collector-prod
crash_collector_dir: /opt/rbmods/crashes-prod
crash_collector_container: riftbreaker-dedicated-prod
# --- Docroot/Mods/Caddy-Daten explizit prod (Issue #483, US3) ----------------
# ADDITIV, ohne Rename der dev-Pfade: dev mountet /srv/rbmods-site — Live-
# Befund #1 (beide Caddys teilten denselben docroot, prod schrieb in dev). prod
# bekommt einen EIGENEN Docroot/Mods-Ort; mods_zip_dest folgt website_mods_dir.
website_docroot: /srv/rbmods-site-prod
website_mods_dir: "{{ website_docroot }}/mods"
mods_zip_dest: "{{ website_mods_dir }}/{{ mods_zip_name }}"
# Caddy-Daten/Config explizit prod (sonst erbt prod den dev-Pfad
# {{ rift_caddy_deploy_dir }}/data|config unter /opt/rbmods/compose/rift-caddy).
rift_caddy_data_dir: "{{ rift_caddy_deploy_dir }}/data"
rift_caddy_config_dir: "{{ rift_caddy_deploy_dir }}/config"
