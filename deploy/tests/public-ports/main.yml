---
# Hermetischer Render-Test der bewusst-oeffentlichen Portmenge (Issue #536, US6).
#
# Rendert die ECHTEN Compose-Templates dreier Welten lokal (kein Host, kein
# Vault, keine Prod-Aktion):
#   * prod-A  (riftbreaker-server, prod-vars.yml)   -> Game 6322
#   * prod-B  (riftbreaker-server, prod-b-vars.yml) -> Game 6325
#   * gns-relay (network_mode: host)                -> 6321
#
# run.sh asserted daraus: Game-Publish ohne Host-IP (0.0.0.0) fuer 6322/6325,
# Bridge/Attack-Cycle explizit 127.0.0.1, gns-relay nur `network_mode: host`
# + `gns_relay_port`, oeffentliche Host-Publish-Menge == {6321, 6322, 6325}.

- name: "RIFT BATTLE — Public-Ports Render prod-A (Issue #536)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../../inventory/host_vars/planet/vars.yml
    - ../../roles/riftbreaker-server/defaults/main.yml
    - ../../prod-vars.yml

  vars:
    deploy_image_tag: check
    rift_env: prod
    rift_deploy_ref: check
    render_dir: "{{ lookup('env', 'RBBATTLE_RENDER_DIR') | default('/tmp/rbbattle-public-ports', true) }}"

  tasks:
    - name: Render-Verzeichnis sicherstellen
      file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"

    - name: prod-A riftbreaker-server Compose rendern
      template:
        src: ../../roles/riftbreaker-server/templates/docker-compose.yml.j2
        dest: "{{ render_dir }}/riftbreaker-server-a.yml"
        mode: "0644"

- name: "RIFT BATTLE — Public-Ports Render prod-B (Issue #536)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../../inventory/host_vars/planet/vars.yml
    - ../../roles/riftbreaker-server/defaults/main.yml
    - ../../prod-b-vars.yml

  vars:
    deploy_image_tag: check
    rift_env: prod-b
    rift_deploy_ref: check
    render_dir: "{{ lookup('env', 'RBBATTLE_RENDER_DIR') | default('/tmp/rbbattle-public-ports', true) }}"

  tasks:
    - name: prod-B riftbreaker-server Compose rendern
      template:
        src: ../../roles/riftbreaker-server/templates/docker-compose.yml.j2
        dest: "{{ render_dir }}/riftbreaker-server-b.yml"
        mode: "0644"

- name: "RIFT BATTLE — Public-Ports Render gns-relay (Issue #536)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../../inventory/host_vars/planet/vars.yml
    - ../../roles/gns-relay/defaults/main.yml
    - ../../roles/riftbreaker-server/defaults/main.yml
    - ../../prod-vars.yml

  vars:
    deploy_image_tag: check
    rift_env: prod
    rift_deploy_ref: check
    render_dir: "{{ lookup('env', 'RBBATTLE_RENDER_DIR') | default('/tmp/rbbattle-public-ports', true) }}"

  tasks:
    - name: gns-relay Compose rendern
      template:
        src: ../../roles/gns-relay/templates/docker-compose.yml.j2
        dest: "{{ render_dir }}/gns-relay.yml"
        mode: "0644"
