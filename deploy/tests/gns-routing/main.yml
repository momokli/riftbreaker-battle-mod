---
# Hermetischer Render-Test der GNS-Entry-Relay-Routen (Issue #995).
#
# Rendert das ECHTE gns-relay-Template routes.j2 mit den Rollen-Defaults (den
# effektiven Zielen) und schreibt die Routen-Datei nach render_dir. run.sh
# prueft damit die A/B-Zuordnung (*-a -> prod-A :6322, *-b -> prod-B :6325),
# die unveraenderten dev/staging-Ziele, den Default und die Reihenfolge
# (spezifische Suffixe VOR dem Default).
#
# Lokal (localhost), kein Host, kein Vault, keine Prod-Aktion.
- name: "RIFT BATTLE — GNS-Entry-Relay Routen rendern (Issue #995)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    # Rollen-Defaults ZUERST, dann die dev-Basis (host_vars) — bei doppelten
    # Keys gewinnt der spaetere File, so greift die ECHTE Praezedenz
    # (host_vars > defaults). Die Routen-Ziele sind Rollen-Defaults.
    - ../../roles/gns-relay/defaults/main.yml
    - ../../inventory/host_vars/planet/vars.yml

  vars:
    render_dir: "{{ lookup('env', 'RBBATTLE_RENDER_DIR') | default('/tmp/rbbattle-gns-routing', true) }}"

  tasks:
    - name: Render-Verzeichnis sicherstellen
      file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"

    - name: routes.j2 rendern
      template:
        src: ../../roles/gns-relay/templates/routes.j2
        dest: "{{ render_dir }}/routes"
        mode: "0644"
