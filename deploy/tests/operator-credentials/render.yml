---
# Issue #535: hermetischer Render-Beweis der Operator-Credential-Trennung.
#
# Läuft LOKAL auf dem Control-Node/CI-Runner: keine Host-Facts, kein SSH, kein
# Docker, kein Vault, keine Prod-Aktion. Gerendert wird die ECHTE Vorlage der
# Rolle website (kein Nachbau), geladen werden die ECHTEN Rollen-Defaults.
#
# Bewiesen wird:
#   (a) dev-Default  -> contract_basic_auth_hash == Legacy-Fallback, der
#       gerenderte Caddyfile traegt den Legacy-Hash (dev byte-identisch).
#   (b) Override     -> ein per `-e` gesetzter contract_basic_auth_hash (wie die
#       Play-Var aus deploy-prod.yml/-staging.yml) steht in JEDEM Operator-Block
#       (Cockpit-Root, /server/*, @write /tournament/*) und der geteilte
#       Legacy-Hash ist NIRGENDS mehr vorhanden (Distinctness).
#   (c) Entkopplung  -> `proxy_basic_auth_hash` (GNS-Lobby) haengt NICHT mehr an
#       `contract_basic_auth_hash`: mit gesetztem Cockpit-Override, aber OHNE
#       `vault_proxy_basic_auth_hash`, faellt die Lobby auf den Legacy-Hash
#       zurueck (nicht auf den Cockpit-Hash); mit eigenem Vault-Wert traegt die
#       Lobby genau diesen, unabhaengig vom Cockpit-Hash.
#
# Aufruf ueber run.sh (oder direkt):
#   RB_OPCRED_RENDER_DIR=$(mktemp -d) ansible-playbook \
#     deploy/tests/operator-credentials/render.yml -e expect_legacy_absent=true
- name: "Operator-Credential-Trennung (Issue #535)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    # Gleiche Praezedenz wie der echte Render-Pfad: Rollen-Defaults liefern die
    # Ports (tournament/bridge/server-control), host_vars die Domain/Site-Root.
    - "{{ playbook_dir }}/../../roles/riftbreaker-server/defaults/main.yml"
    - "{{ playbook_dir }}/../../roles/website/defaults/main.yml"
    - "{{ playbook_dir }}/../../roles/server-control/defaults/main.yml"
    - "{{ playbook_dir }}/../../inventory/host_vars/planet/vars.yml"

  vars:
    render_dir: "{{ lookup('env', 'RB_OPCRED_RENDER_DIR') | default('/tmp/rb-opcred-render', true) }}"
    # vault_contract_basic_auth_hash / vault_proxy_basic_auth_hash kommen per -e
    # (spiegeln die Vault-Werte der Plays). Die Erwartungs-Flags setzt run.sh.
    expect_legacy_absent: false
    expect_lobby_equals_proxy_vault: false
    expect_lobby_legacy_fallback: false

  tasks:
    # /server/*-Route aktivieren. set_fact (statt Play-Var): die per vars_files
    # geladenen Rollen-Defaults (server_control_enabled: false) schlagen Play-
    # vars; set_fact gewinnt dagegen (Muster check-render.yml).
    - name: "Kontext: server-control-Route aktivieren"
      set_fact:
        server_control_enabled: true

    - name: Render-Verzeichnis sicherstellen
      file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"

    - name: Cockpit-Caddyfile rendern (echte Rollen-Vorlage)
      template:
        src: "{{ playbook_dir }}/../../roles/website/templates/rift-caddy.Caddyfile.j2"
        dest: "{{ render_dir }}/Caddyfile"
        mode: "0644"

    - name: Gerendertes Caddyfile laden
      set_fact:
        caddyfile: "{{ lookup('file', render_dir ~ '/Caddyfile') }}"

    # (a)/(b) Der Operator-Block traegt exakt den aufgeloesten Hash der Env —
    # in ALLEN drei Stellen (Cockpit-Root, /server/*, @write). Alle drei kommen
    # aus derselben Variablen, daher genuegt der Nachweis der Anzahl.
    - name: "Operator-Bloecke tragen den aufgeloesten Hash (Issue #535)"
      assert:
        that:
          - "('operator ' ~ contract_basic_auth_hash) in caddyfile"
          - "((caddyfile.split('operator ' ~ contract_basic_auth_hash)) | length) - 1 == 3"
        fail_msg: >-
          Das gerenderte Caddyfile traegt nicht genau drei Operator-Bloecke mit
          dem aufgeloesten Hash (Issue #535). Erwartet: Cockpit-Root, /server/*
          und @write /tournament/* teilen sich denselben Operator-Hash der Env.
        success_msg: "Drei Operator-Bloecke tragen den Hash der Env (Issue #535)."

    # (b) Bei einem vom Legacy abweichenden Hash (Play-Var-Override) darf der
    # geteilte Legacy-Hash nirgends mehr stehen.
    - name: "Kein Legacy-Rest bei Override (Issue #535)"
      when: expect_legacy_absent | bool
      assert:
        that:
          - "contract_basic_auth_hash != contract_basic_auth_hash_legacy_shared"
          - "contract_basic_auth_hash_legacy_shared not in caddyfile"
        fail_msg: >-
          Der geteilte Legacy-Operator-Hash steht trotz Override im Caddyfile
          (Issue #535) — das geteilte Operator-Passwort bliebe aktiv.
        success_msg: "Override ersetzt den Legacy-Hash vollstaendig (Issue #535)."

    # (c1) Lobby mit eigenem Vault-Wert: eigener Hash, entkoppelt vom Cockpit.
    - name: "Lobby-Hash entkoppelt vom Cockpit-Hash (Issue #535)"
      when: expect_lobby_equals_proxy_vault | bool
      assert:
        that:
          - "proxy_basic_auth_hash == vault_proxy_basic_auth_hash"
          - "proxy_basic_auth_hash != contract_basic_auth_hash"
        fail_msg: >-
          proxy_basic_auth_hash folgt nicht dem eigenen vault_proxy_basic_auth_hash
          bzw. kollidiert mit dem Cockpit-Hash (Issue #535) — die Lobby bliebe an
          die per-Env Cockpit-Credentials gekoppelt.
        success_msg: "Lobby traegt ihren eigenen, vom Cockpit entkoppelten Hash (Issue #535)."

    # (c2) Lobby OHNE eigenen Vault-Wert, aber MIT Cockpit-Override: faellt auf
    # den Legacy-Hash zurueck und NICHT auf den Cockpit-Hash (Kern der
    # Entkopplung; vorher war proxy == contract).
    - name: "Lobby faellt auf Legacy zurueck, nicht auf den Cockpit-Hash (Issue #535)"
      when: expect_lobby_legacy_fallback | bool
      assert:
        that:
          - "proxy_basic_auth_hash == contract_basic_auth_hash_legacy_shared"
          - "proxy_basic_auth_hash != contract_basic_auth_hash"
          - "contract_basic_auth_hash != contract_basic_auth_hash_legacy_shared"
        fail_msg: >-
          Die Lobby folgt dem Cockpit-Hash (Issue #535): proxy_basic_auth_hash
          haengt noch an contract_basic_auth_hash statt am eigenen
          vault_proxy_basic_auth_hash/Fallback.
        success_msg: "Lobby entkoppelt: Legacy-Fallback statt Cockpit-Hash (Issue #535)."

    # Quell-Guards: die Lobby liest den eigenen Vault-Wert, und der Rollen-Block
    # bindet proxy_basic_auth_hash (nicht contract_basic_auth_hash).
    - name: "Quell-Guard: Lobby-Vault-Wert + Block-Bindung (Issue #535)"
      vars:
        role_defaults: "{{ lookup('file', playbook_dir ~ '/../../roles/website/defaults/main.yml') }}"
        role_tasks: "{{ lookup('file', playbook_dir ~ '/../../roles/website/tasks/main.yml') }}"
      assert:
        that:
          - "'vault_proxy_basic_auth_hash' in role_defaults"
          - "'contract_basic_auth_hash_legacy_shared' in role_defaults"
          - "'proxy_basic_auth_hash' in role_tasks"
        fail_msg: >-
          Der Quell-Guard schlaegt fehl (Issue #535): die Rolle muss den eigenen
          vault_proxy_basic_auth_hash kennen und den Lobby-Block an
          proxy_basic_auth_hash binden.
        success_msg: "Lobby-Vault-Wert + Block-Bindung vorhanden (Issue #535)."
