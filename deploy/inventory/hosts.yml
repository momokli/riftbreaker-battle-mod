---
# Ansible-Inventory für die Deployment-Hosts "planet" (Hetzner) und die
# früheren Relay-Hosts "satellite"/"sync".
#
# Mesh-first: SSH läuft AUSSCHLIESSLICH über die SSH-Aliase aus ~/.ssh/config
# (Tailscale) — NIEMALS über die Public-IP (die ist nur für Services):
#   * planet    -> 100.77.143.105   (dev/prod/staging-Dedi, Public 65.21.27.234)
#   * satellite -> Mesh-IP          (früherer Relay-Host, Public 65.21.181.48)
# Beide Aliase müssen im Mesh-Setup vorhanden sein (`ssh planet id -u` /
# `ssh satellite id -u` liefern `0`). Aufruf/Doku: deploy/README.md
# („Voraussetzungen", „Prod-Instanz + Relay-Abbau").
# Kein Deploy ohne explizite Freigabe.

all:
  hosts:
    planet:
      ansible_user: root
      ansible_connection: ssh
    # Früherer Relay-Host (Issue #328, retired #846): Der UDP-DNAT :6321 ->
    # planet:6322 wird abgebaut (deploy-prod.yml Play 2, satellite_relay_state:
    # absent). Wie planet ein Mesh-Alias (Tailscale) — niemals die Public-IP
    # 65.21.181.48 als SSH-Ziel. Die satellite_relay_*-Werte liegen in den
    # Rollen-Defaults (keine host_vars/satellite — bewusst, s. README).
    satellite:
      ansible_user: root
      ansible_connection: ssh
    # Früherer Staging-Relay-Host (retired #846): Der UDP-DNAT :6321 ->
    # planet:6323 (staging) wird abgebaut (deploy-staging.yml Play 2,
    # satellite_relay_state: absent). Anders als planet/satellite wird hier die
    # öffentliche IP explizit als ansible_host gesetzt (65.21.253.64).
    sync:
      ansible_host: 65.21.253.64
      ansible_user: root
      ansible_connection: ssh
      # Ubuntu 18.04 (EOL) hat nur Python 3.6 — ansible-core 2.19 braucht 3.7+.
      ansible_python_interpreter: /usr/bin/python3.8
