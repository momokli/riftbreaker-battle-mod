---
# Ansible-Inventory für die Deployment-Hosts "planet" (Hetzner) und "satellite".
#
# Mesh-first: SSH läuft AUSSCHLIESSLICH über die SSH-Aliase aus ~/.ssh/config
# (Tailscale) — NIEMALS über die Public-IP (die ist nur für Services):
#   * planet    -> 100.77.143.105   (dev/prod-Dedi, Public 65.21.27.234)
#   * satellite -> Mesh-IP          (Relay-Host, Public 65.21.181.48)
# Beide Aliase müssen im Mesh-Setup vorhanden sein (`ssh planet id -u` /
# `ssh satellite id -u` liefern `0`). Aufruf/Doku: deploy/README.md
# („Voraussetzungen“, „Prod-Instanz + Satellite-Relay").
# Kein Deploy ohne explizite Freigabe.

all:
  hosts:
    planet:
      ansible_user: root
      ansible_connection: ssh
    # Relay-Host (Issue #328): eigene öffentliche IPv4, UDP-DNAT :6321 ->
    # planet:6322. Wie planet ein Mesh-Alias (Tailscale) — niemals die
    # Public-IP 65.21.181.48 als SSH-Ziel. Die satellite_relay_*-Werte liegen
    # in den Rollen-Defaults (keine host_vars/satellite — bewusst, s. README).
    satellite:
      ansible_user: root
      ansible_connection: ssh
