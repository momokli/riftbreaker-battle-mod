---
# ============================================================================
# planet — nicht-geheime, HOST-WEITE Variablen (host_vars/planet/vars.yml)
# Geheimnisse (Server-Passwort) NUR in vault.yml (ansible-vault verschlüsselt).
#
# Multi-Instanz (Issue #290): instanz-spezifische Werte (Ports, Container-/
# Unit-Namen, Pfade, Volumes, Content-Dirs) stehen NICHT mehr hier, sondern in
# je einem Profil pro Instanz: deploy/instances/<name>.yml. Gewählt wird das
# Profil über `-e riftbreaker_instance=<name>` (Default `release`), siehe
# deploy/site.yml und deploy/fleet.yml. Hier bleiben nur Werte, die für ALLE
# Instanzen gleich sind (Image, Website, Probe, Content-Cache, Secrets).
# ============================================================================

# --- Instanz-Registry (host-weite Sicht) -------------------------------------
# Bewusst schlank: nur was der host-weite Probe-Timer braucht (eine Zeile je
# Instanz in status.json). Die vollständigen instanz-spezifischen Werte stehen
# in deploy/instances/<name>.yml. Bei Änderung von externem UDP-Port,
# Container-Name oder Game-Dir eines Profils hier mitpflegen.
riftbreaker_fleet:
  - probe_id: RIFT-MOD
    port_udp: 6321
    container: riftbreaker-dedicated
    game_dir: /srv/rbgame
  - probe_id: RIFT-DEV
    port_udp: 6322
    container: riftbreaker-dedicated-dev
    game_dir: /srv/rbgame-dev

# --- Laufzeit-Image (Rolle dedicated-server-image, Issue #241) ---------------
# Tag = Deploy-SHA aus site.yml (pre_tasks) — KEIN `latest`; das Image existiert
# garantiert, bevor der Container startet. EIN Image für ALLE Instanzen
# (identische Wine-Laufzeit), nur die Container-/Port-/Volume-Parameter
# unterscheiden sich je Profil.
dedicated_server_image_name: rb-dedicated
dedicated_server_image: "{{ dedicated_server_image_name }}:{{ deploy_image_tag }}"
riftbreaker_server_image: "{{ dedicated_server_image }}"

# --- Website (statics + Caddy, mellon-caddy-Container) -----------------------
website_domain: rift.projectmellon.de
website_docroot: /srv/rbmods-site
website_mods_dir: "{{ website_docroot }}/mods"
website_caddy_container: mellon-caddy
website_caddyfile_host_path: /home/momo/Caddyfile
website_caddyfile_d_dir: /home/momo/Caddyfile.d
website_caddy_import_line: "import /etc/caddy/Caddyfile.d/*"

# --- Solo-Match-Page /solo — Zugangsschutz (Issue #159) ----------------------
# Passwortschutz für /solo via Caddy basic_auth. Der bcrypt-Hash liegt NUR im
# Vault (vault_solo_basic_auth_hash) bzw. host-seitig gesetzt — der Name ist
# dokumentiert, der Wert NIE im Repo/Logs/PR.
# Fehlt/leer => /solo bleibt ungeschützt (graceful Default).
solo_basic_auth_user: operator
solo_basic_auth_hash: "{{ vault_solo_basic_auth_hash | default('') }}"

# --- Mods-Zip (Paketierung + md5-Parität) ------------------------------------
mods_zip_name: rbbattle.zip
mods_zip_dest: "{{ website_mods_dir }}/{{ mods_zip_name }}"
# Download-Parität (S1): öffentliche URL, die nach JEDEM Deploy gegen den
# deployten Stand geprüft wird (md5 muss exakt übereinstimmen).
mods_download_url: "https://{{ website_domain }}/mods/{{ mods_zip_name }}"
mods_download_tmp: /tmp/rbbattle-download-check.zip

# --- Probe-Timer (systemd, scripts/probe_servers.sh) -------------------------
# Eine Probe je Instanz (siehe probe-timer-Endpoint-Template); die Werte hier
# sind host-weit (IP, Ziele, Intervall).
probe_bin: /usr/local/bin/rbmods-probe.sh
probe_out: "{{ website_docroot }}/status.json"
probe_site_url: "https://{{ website_domain }}"
probe_endpoints_file: /usr/local/etc/rbmods-probe.endpoints
probe_interval_min: 2
probe_server_ip: 65.21.27.234

# --- Game-Content (host-weit) ------------------------------------------------
# Der Dedicated-Server-Content (Steam-App 4114030) liegt als kanonischer Cache
# auf planet und wird pro Instanz nach <game_dir> gespiegelt (modus sync).
# SteamCMD haengt am "apt install lib32gcc-s1" -> sync als Default.
riftbreaker_content_mode: sync
