---
# ============================================================================
# planet — nicht-geheime Variablen (host_vars/planet/vars.yml)
# Geheimnisse (Server-Passwort) NUR in vault.yml (ansible-vault verschlüsselt).
# ============================================================================

# --- Dedicated Game-Server (Dev-SP, 6321, 1v1 "vs sich selbst") -------------
riftbreaker_game_dir: /srv/rbgame
riftbreaker_mod_dir: "{{ riftbreaker_game_dir }}/mods/rbbattle"
# Mod-Backups liegen AUSSERHALB von mods/ — der Dedicated Server lädt sonst
# jeden Backup-Ordner mit *.manifest als zweite Mod (Befund 2026-09-10,
# Issue #212; Guard + Verifikation in der Rolle).
riftbreaker_backup_dir: "{{ riftbreaker_game_dir }}-backups"
# Laufzeit-Image (Rolle dedicated-server-image, Issue #241, Community-Rezept).
# Tag = Deploy-SHA aus site.yml (pre_tasks) — KEIN `latest`; das Image existiert
# garantiert, bevor der Container startet.
dedicated_server_image_name: rb-dedicated
dedicated_server_image: "{{ dedicated_server_image_name }}:{{ deploy_image_tag }}"
riftbreaker_server_image: "{{ dedicated_server_image }}"
riftbreaker_server_container: riftbreaker-dedicated
riftbreaker_server_port_udp: 6321
# Welt/Config gemäß Community-Rezept (config.cfg.j2). Werte = funktionierender
# Stand (verifiziert 2026-09-11).
riftbreaker_server_campaign: mp_survival/mp_survival
riftbreaker_server_mission: survival/jungle
riftbreaker_server_difficulty: coop_normal

# --- Tournament-Server (systemd, Rust/axum aus tournament/) ------------------
tournament_install_dir: /opt/rbmods/tournament-server
tournament_unit: tournament-server
tournament_port: 8081
tournament_bridge_a_url: "http://127.0.0.1:9001/exec"
tournament_bridge_b_url: "http://127.0.0.1:9002/exec"

# --- Server-Control (Plane B, systemd Host-Agent, Issue #424) ----------------
# Wrappt `docker` auf dem Host: Status/Logs/Restart/Start/Stop + config.cfg.
# Bindet NUR 127.0.0.1 — der rift-caddy proxyt /server/* dorthin (siehe
# rift-caddy.Caddyfile.j2). Der Bearer-Token liegt AUSSCHLIESSLICH im Vault
# (vault_server_control_token); ohne ihn bricht die Rolle ab (fail-closed).
server_control_port: 8092

# --- Website (Landing + Cockpit, eigener rift-caddy) -------------------------
# Architektur (Issue #322): Der Riftbreaker-Stack betreibt einen EIGENEN,
# schlanken Caddy-Container (`rift-caddy`, plain HTTP, reines Durchreichen):
#   * landing_domain (www.drift.projectmellon.de) → file_server (Landing + /mod.zip)
#   * cockpit_domain (cockpit.drift.projectmellon.de) →
#       * /contract/*  → reverse_proxy an die IO-Bridge (Operator-Cockpit) und
#       * /tournament/* → reverse_proxy an den tournament-server.
# Der GETEILTE Deploy-Host-Caddy (`mellon-caddy`, hostet viele fremde Domains)
# bekommt GENAU ZWEI Einträge (je Domain einen, per-Domain-Marker) →
# reverse_proxy 127.0.0.1:{{ rift_caddy_port }} — kein Caddyfile.d-Snippet-Mount
# mehr, kein Eingriff in fremde Sites.
landing_domain: www.drift.projectmellon.de
cockpit_domain: cockpit.drift.projectmellon.de
website_docroot: /srv/rbmods-site
website_mods_dir: "{{ website_docroot }}/mods"

# Eigener Rift-Caddy (Container, network_mode host, plain HTTP). Lauscht
# ausschliesslich auf 127.0.0.1:{{ rift_caddy_port }} (der Host-Caddy proxyt
# dorthin); TLS terminiert weiterhin der Host-Caddy. Wichtig (Issue #355): der
# Caddyfile-Template setzt `admin off`, damit der Container NICHT den Default-
# Admin-Port 127.0.0.1:2019 belegt (dort lauscht die Admin-API des geteilten
# Host-Caddys — sonst kollidiert `caddy reload` und landet beim falschen Prozess).
rift_caddy_container: rift-caddy
rift_caddy_image: caddy:2
rift_caddy_port: 8787
rift_caddy_deploy_dir: /opt/rbmods/compose/rift-caddy
rift_caddy_data_dir: "{{ rift_caddy_deploy_dir }}/data"
rift_caddy_config_dir: "{{ rift_caddy_deploy_dir }}/config"
# Docroot IM Container (read-only Bind-Mount von website_docroot).
rift_caddy_site_root: /srv/site

# Geteilter Host-Caddy: genau ZWEI Einträge (je Domain einen, idempotent, kein
# Snippet-Import). Die alte, manuell gepflegte Rift-Block-/Import-Zeile und
# verwaiste operator.*-Einträge werden von der Rolle entfernt (siehe
# deploy/roles/website/tasks/main.yml).
website_host_caddy_container: mellon-caddy
website_host_caddyfile_path: /home/momo/Caddyfile
website_host_caddyfile_owner: momo
website_host_caddyfile_group: momo

# --- Mods-Zip (Paketierung + md5-Parität) ------------------------------------
mods_zip_name: rbbattle.zip
mods_zip_dest: "{{ website_mods_dir }}/{{ mods_zip_name }}"

# --- Image-Tag-Retention (systemd, scripts/docker_image_tag_retention.sh) ----
# Issue #309: alter rb-dedicated/rb-headless-client-Tags aufräumen, aber das
# laufende Image + N Rollback-Tags behalten. Wirksame Werte stehen in den
# Rollen-Defaults (deploy/roles/image-retention/defaults/main.yml):
#   image_retention_repos         "rb-dedicated rb-headless-client"
#   image_retention_rollback_tags 2
#   image_retention_on_calendar   daily
# Der aktuelle Deploy-Tag (dedicated_server_image = rb-dedicated:<deploy-sha>)
# wird dem Service als RB_PROTECTED_TAGS uebergeben und nie entfernt.

# Game-Content ist auf planet bereits provisioniert (664 MB in /srv/rbgame).
# SteamCMD-Modus haengt am "apt install lib32gcc-s1" -> sync als No-Op.
riftbreaker_content_mode: sync
