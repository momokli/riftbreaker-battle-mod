---
# ============================================================================
# planet — nicht-geheime Variablen (host_vars/planet/vars.yml)
# Geheimnisse (Server-Passwort) NUR in vault.yml (ansible-vault verschlüsselt).
#
# PROD-ONLY (Issue #1034): Die frühere dev-Welt (site.yml) ist entfallen. Damit
# enthält diese Datei KEINE dev-Welt-Pfade/Ports/Container/Domains mehr — sie
# hält nur noch die host-weiten SINGLETON-Werte (gns-relay, image-retention,
# host-hygiene) sowie env-unabhängige Basen. Die per-Env-Werte (prod/prod-b/
# test) stehen in den jeweiligen Override-Dateien (prod-vars.yml,
# prod-b-vars.yml, test-vars.yml); der env-schema-Audit (env-assert.yml) erzwingt,
# dass jede env-spezifische Komponente dort EXPLIZIT gesetzt ist.
# ============================================================================

# --- Laufzeit-Image (Rolle dedicated-server-image, Issue #241) ---------------
# Tag = Deploy-SHA aus den pre_tasks des deployenden Plays — KEIN `latest`; das
# Image existiert garantiert, bevor ein Container startet.
dedicated_server_image_name: rb-dedicated
dedicated_server_image: "{{ dedicated_server_image_name }}:{{ deploy_image_tag }}"
riftbreaker_server_image: "{{ dedicated_server_image }}"

# Welt/Config gemäß Community-Rezept (config.cfg.j2). Werte = funktionierender
# Stand (verifiziert 2026-09-11). Env-übergreifend identisch (shared).
riftbreaker_server_campaign: mp_survival/mp_survival
riftbreaker_server_mission: survival/jungle
riftbreaker_server_difficulty: coop_normal

# --- GNS-Entry-Relay (Issue #843) --------------------------------------------
# Terminiert GameNetworkingSockets auf dem client-hardgewireten UDP-Port 6321
# und routet (Spielname-Suffix) auf prod-A :6322 / prod-B :6325. Als
# EINZIGER öffentlicher Einstieg ist der Relay ein SINGLETON auf planet; seit
# #1034 fährt ihn das prod-Play (deploy-prod.yml, Play 0) mit. `network_mode:
# host` -> der Relay besitzt 6321 direkt auf dem Host. Er läuft auf demselben
# Laufzeit-Image wie der Dedicated Server.
gns_relay_container: gns-relay
gns_relay_image: "{{ dedicated_server_image }}"
gns_relay_port: 6321
gns_relay_deploy_dir: /opt/rbmods/compose/gns-relay
gns_relay_bin_dir: /opt/rbmods/gns-relay/bin
gns_relay_wine_volume: gns-relay-wine

# --- Parked-Pool-Dienst (Warm-Pool, Issue #928) ------------------------------
# Host-weiter SINGLETON (ein Relay auf dem Host): seit #1034 von Play 0
# (deploy-prod.yml) deployt. Unit-/Pfad-Namen sind deshalb env-FREI (neutral),
# nicht mehr an den dev-Zwilling gebunden. Haelt N Dedicated-Instanzen
# "geparkt" und bietet claim()/recycle()/reap() per HTTP an (Bearer aus dem
# Vault: vault_parked_pool_token). Port 9201: 127.0.0.1:8092 hält der
# prod-server-control, und der Bereich 8000-8500 ist host-weit von azuracast
# belegt (Docker-port-proxy); daher eigener Block ab 9200 (9200 = Relay-Lobby).
parked_pool_unit: rbmods-parked
parked_pool_port: 9201
parked_pool_pool_size: 1
parked_pool_install_dir: /opt/rbmods/parked-pool
parked_pool_env_file: /etc/rbmods/parked-pool.env

# --- Kapsel-Flow-Dienst (Issue #931) -----------------------------------------
# Host-weiter SINGLETON (env-freie Namen). Eigener Port + der Parked-Port als
# Nachbar (der Dienst claimt dort ohne resume -> pausiertes Spiel). Gleicher
# Port-Block wie parked-pool.
capsule_flow_port: 9211
capsule_flow_parked_port: 9201

# --- Queue-Dienst (Issue #998) -----------------------------------------------
# Host-weiter SINGLETON (env-freie Namen). Casual-Queue: paart Spieler
# (aktiv 1v1, FIFO) und provisioniert KALT zwei frische VS-Welten (A/B) +
# Referee-Lobby. Eigener Port 9221 (frei neben Parked 9201 / Kapsel 9211).
# Referee IST der prod-tournament-server (prod-Port 8082, docs/VS_MATCH.md).
queue_unit: rbmods-queue
queue_port: 9221
queue_install_dir: /opt/rbmods/queue
queue_env_file: /etc/rbmods/queue.env
queue_state_dir: /var/lib/rbmods/queue
queue_provisioner_url: "http://127.0.0.1:8094"
queue_referee_url: "http://127.0.0.1:8082"

# --- Website: geteilter Host-Caddy (Issue #322) ------------------------------
# Der GETEILTE Deploy-Host-Caddy (`mellon-caddy`, hostet viele fremde Domains)
# bekommt je Domain GENAU einen Eintrag (per-Domain-Marker) → reverse_proxy
# 127.0.0.1:<rift_caddy_port> — kein Caddyfile.d-Snippet-Mount, kein Eingriff in
# fremde Sites. Host-Konstante (ein Caddy pro Host), env-unabhängig.
website_host_caddy_container: mellon-caddy
website_host_caddyfile_path: /home/momo/Caddyfile
website_host_caddyfile_owner: momo
website_host_caddyfile_group: momo

# Eigener Rift-Caddy: Image + container-interner Docroot sind env-unabhängig
# (shared); die per-Env-Werte (Container-/Port-/Pfad-/Domain-Namen) stehen in
# den Override-Dateien (prod-vars.yml).
rift_caddy_image: caddy:2
rift_caddy_site_root: /srv/site

# --- Mods-Zip (Paketierung + md5-Parität) ------------------------------------
# Der Dateiname ist historisch fix (md5-Parität/Download-Link); die Env-Trennung
# läuft über das je Env abweichende mods_zip_dest (Override-Dateien).
mods_zip_name: rbbattle.zip

# --- Game-Content ------------------------------------------------------------
# Kanonischer Content-Cache auf planet → Sync-Modus in jeder Env (shared).
riftbreaker_content_mode: sync
