# RIFT BATTLE — Ansible-Konfiguration (Deployment auf planet)
#
# Deploy NUR über das Playbook (kein manuelles Gedudel):
#   ansible-playbook -i deploy/inventory deploy/site.yml --ask-vault-pass

[defaults]
inventory = deploy/inventory
roles_path = deploy/roles
retry_files_enabled = False
host_key_checking = False
interpreter_python = auto_silent
# Vault-Passwort-Quelle (lokal ablegen, NIEMALS committen).
# Alternativ beim Lauf: --ask-vault-pass
# vault_password_file = .vault_pass
